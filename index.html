// MS PROJECT IMPORT ENGINE
// Handles: .xml (MSPDI format, all versions 2003–2021)
//          .mpp (binary — guides user to export XML)
//          .xlsx schedule sheets
// ═══════════════════════════════════════════════════════

// Parse MS Project ISO 8601 duration: "PT8H" = 1 day, "PT40H" = 5 days
// MS Project uses 8-hour days by default
function parseMSPDuration(durStr) {
  if (!durStr) return 0;
  const s = String(durStr).trim();
  // Already a number
  if (/^\d+(\.\d+)?$/.test(s)) return Math.round(+s);
  // ISO 8601 duration: P[n]Y[n]M[n]DT[n]H[n]M[n]S
  let hours = 0;
  const m = s.match(/P(?:(\d+(?:\.\d+)?)Y)?(?:(\d+(?:\.\d+)?)M)?(?:(\d+(?:\.\d+)?)D)?(?:T(?:(\d+(?:\.\d+)?)H)?(?:(\d+(?:\.\d+)?)M)?(?:(\d+(?:\.\d+)?)S)?)?/);
  if (m) {
    const days  = parseFloat(m[3]||0);
    const hrs   = parseFloat(m[4]||0);
    const mins  = parseFloat(m[5]||0);
    hours = days * 8 + hrs + mins / 60;
  }
  // Round to work days (8h/day)
  return Math.max(1, Math.round(hours / 8));
}

// Helper: get text content of a direct child element (namespace-agnostic)
function mspEl(parent, tag) {
  if (!parent) return null;
  // Try direct querySelector first
  let el = parent.querySelector(tag);
  if (el) return el;
  // Try without namespace prefix
  const kids = parent.children || [];
  for (let i = 0; i < kids.length; i++) {
    const lc = kids[i].localName || kids[i].tagName || "";
    if (lc === tag || lc.endsWith(":"+tag)) return kids[i];
  }
  return null;
}
function mspText(parent, tag) {
  const el = mspEl(parent, tag);
  return el ? el.textContent.trim() : "";
}

// Main XML importer — production grade
function importMSProjectXML(xmlText, options = {}) {
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlText, "text/xml");

    // Check for parse error
    if (doc.querySelector("parsererror")) {
      showSaveIndicator("⚠ XML parse error — file may be corrupted");
      return;
    }

    const root = doc.documentElement;

    // Detect if this is actually MSPDI format
    const isProject = root.localName === "Project" ||
                      xmlText.includes("<Tasks>") ||
                      xmlText.includes("<Task>");
    if (!isProject) {
      showSaveIndicator("⚠ Not a recognized MS Project XML file");
      return;
    }

    // === Pass 1: Build UID→task map and collect all task elements ===
    const taskEls   = Array.from(doc.querySelectorAll("Task"));
    const uidToTask = new Map(); // MS Project UID → task element
    for (const el of taskEls) {
      const uid = mspText(el, "UID");
      if (uid) uidToTask.set(uid, el);
    }

    // === Pass 2: Build UID→generated ID map so predecessors resolve ===
    const uidToId = new Map();
    for (const uid of uidToTask.keys()) {
      uidToId.set(uid, uid === "0" ? "_proj" : `msp_${uid}`);
    }

    // === Pass 3: Parse each task ===
    const newTasks = [];
    for (const task of taskEls) {
      const uid     = mspText(task, "UID");
      const name    = mspText(task, "Name");
      if (!name || uid === "0") continue; // skip project summary row

      const isSummary  = mspText(task, "Summary") === "1";
      const isMilestone= mspText(task, "Milestone") === "1";
      const outlineRaw = parseInt(mspText(task, "OutlineLevel") || "1");
      // MS Project OutlineLevel is 1-based; we want 0=summary, 1-4=detail
      const level = isSummary ? 0 : Math.min(4, outlineRaw);

      const startRaw  = mspText(task, "Start");
      const finishRaw = mspText(task, "Finish");
      const start  = startRaw  ? startRaw.substring(0, 10)  : "";
      const end    = finishRaw ? finishRaw.substring(0, 10) : "";
      const pct    = parseFloat(mspText(task, "PercentComplete") || "0");
      const durRaw = mspText(task, "Duration");
      const duration = isMilestone ? 0 : parseMSPDuration(durRaw);
      const notes  = mspText(task, "Notes") || "";

      // Predecessors — each <PredecessorLink> child
      const predLinks = Array.from(task.querySelectorAll("PredecessorLink"));
      const predStrs  = [];
      for (const link of predLinks) {
        const predUID    = mspText(link, "PredecessorUID");
        if (!predUID || predUID === "0") continue;
        const lagDurRaw  = mspText(link, "LinkLag"); // in 1/10 minutes
        const lagType    = mspText(link, "Type") || "1"; // 1=FS,2=SS,3=FF,4=SF
        const mappedId   = uidToId.get(predUID);
        if (!mappedId) continue;
        // Convert lag: LinkLag is in tenths of minutes; 1 day = 480 min = 4800 tenths
        let lagDays = 0;
        if (lagDurRaw) {
          lagDays = Math.round(parseInt(lagDurRaw) / 4800);
        }
        predStrs.push(lagDays !== 0 ? `${mappedId}${lagDays > 0 ? "+" : ""}${lagDays}d` : mappedId);
      }

      newTasks.push({
        id:  uidToId.get(uid) || uid,
        name,
        level,
        start,
        end,
        duration: duration || "",
        percentComplete: pct,
        predecessors: predStrs.join(","),
        notes: notes.replace(/\r\n|\r/g, "\n").substring(0, 200),
        isMilestone
      });
    }

    if (!newTasks.length) {
      showSaveIndicator("⚠ No tasks found in MS Project XML");
      return;
    }

    // === Show import preview and let user choose replace vs append ===
    showMSPImportPreview(newTasks, "MS Project XML");

  } catch(e) {
    console.error("MS Project XML parse error:", e);
    showSaveIndicator("⚠ Error parsing MS Project XML: " + (e.message || "unknown"));
  }
}

window.commitMSPImport = (mode) => {
  if (!_pendingImportTasks) return;
  if (mode === "replace") {
    state.schedule.tasks = _pendingImportTasks;
  } else {
    state.schedule.tasks = [...state.schedule.tasks, ..._pendingImportTasks];
  }
  const count = _pendingImportTasks.length;
  _pendingImportTasks  = null;
  _pendingImportSource = "";
  saveData(state);
  closeModal("mspImportPreview");
  activeTab = "schedule";
  showSaveIndicator(`✓ ${mode==="replace"?"Replaced":"Appended"} ${count} schedule tasks`);
  render();
};

function importInvoicePO(rows, sn) {
  // Try to find PO-level header: PO #, vendor, amount, description
  const hr = findHeaderRow(rows, ["po #","vendor","invoice","amount","purchase"]);
  if (!hr) return;
  const h = hr.headers;

  const ci = {
    poNum:    colIdx(h,"po #","po number","purchase order","po"),
    vendor:   colIdx(h,"vendor","supplier","company","sub"),
    desc:     colIdx(h,"description","scope","work"),
    orig:     colIdx(h,"original","original po","po amount","contract","amount","value"),
    adj:      colIdx(h,"adjusted","change","revised"),
    inv:      colIdx(h,"invoice amount","invoiced","billed","paid"),
    invNum:   colIdx(h,"invoice #","invoice number","inv #"),
    invDate:  colIdx(h,"invoice date","date","billing date"),
  };

  const newPOs = [];
  for (let i = hr.idx + 1; i < rows.length; i++) {
    const r = rows[i];
    const poNum  = String(r[ci.poNum  >= 0 ? ci.poNum  : 0] || "").trim();
    const vendor = String(r[ci.vendor >= 0 ? ci.vendor : 1] || "").trim();
    if (!poNum && !vendor) continue;

    const origAmt = parseFloat(String(r[ci.orig >= 0 ? ci.orig : -1] || "0").replace(/[$,]/g,"")) || 0;
    const invAmt  = parseFloat(String(r[ci.inv  >= 0 ? ci.inv  : -1] || "0").replace(/[$,]/g,"")) || 0;
    const invNum  = ci.invNum  >= 0 ? String(r[ci.invNum]  || "").trim() : "";
    const invDate = ci.invDate >= 0 ? cleanDate(r[ci.invDate]) : "";

    const po = {
      id: uid(),
      poNumber: poNum,
      vendor,
      description: ci.desc >= 0 ? String(r[ci.desc] || "").trim() : "",
      originalAmount: origAmt,
      adjustedAmount: ci.adj >= 0 ? parseFloat(String(r[ci.adj] || "0").replace(/[$,]/g,"")) || 0 : 0,
      invoices: invAmt > 0 ? [normalizeInvoice({
        id: uid(),
        number: invNum,
        dateReceived: invDate,
        amount: invAmt,
        description: "Imported"
      })] : []
    };
    newPOs.push(po);
  }
  if (newPOs.length) state.purchaseOrders = [...(state.purchaseOrders||[]), ...newPOs];
}

// ── SheetJS styling helper: apply cell styles using s: property
// Note: SheetJS community edition supports s: in write() with cellStyles option
// We build styled cells directly on the worksheet object.

// Style presets (SheetJS cell style format)
const XL_STYLES = {
  title:   { font:{bold:true,sz:14}, fill:{fgColor:{rgb:"3D405B"}}, alignment:{horizontal:"left"} },
  header:  { font:{bold:true,sz:10,color:{rgb:"FFFFFF"}}, fill:{fgColor:{rgb:"3D405B"}}, alignment:{horizontal:"center",wrapText:true} },
  catHead: { font:{bold:true,sz:10,color:{rgb:"FFFFFF"}}, fill:{fgColor:{rgb:"81B29A"}}, alignment:{horizontal:"left"} },
  subHead: { font:{bold:true,sz:9,color:{rgb:"3D405B"}},  fill:{fgColor:{rgb:"F7F3ED"}}, alignment:{horizontal:"left"} },
  total:   { font:{bold:true,sz:10}, fill:{fgColor:{rgb:"EEE8E0"}}, numFmt:"$#,##0.00" },
  money:   { numFmt:"$#,##0.00", alignment:{horizontal:"right"} },
  moneyRed:{ numFmt:"$#,##0.00", alignment:{horizontal:"right"}, font:{color:{rgb:"C1121F"}} },
  pct:     { numFmt:"0.0%", alignment:{horizontal:"right"} },
  date:    { numFmt:"mm/dd/yyyy", alignment:{horizontal:"center"} },
  even:    { fill:{fgColor:{rgb:"FFFBF5"}} },
  odd:     { fill:{fgColor:{rgb:"FFFFFF"}} },
  center:  { alignment:{horizontal:"center"} },
};

// Apply a style object to a cell address in a worksheet
function xlStyle(ws, addr, style) {
  if (!ws[addr]) ws[addr] = {t:"z",v:""};
  ws[addr].s = Object.assign({}, ws[addr].s || {}, style);
}

// Style an entire row by row index (0-based) and col count
function xlStyleRow(ws, rowIdx, colCount, style) {
  for (let c = 0; c < colCount; c++) {
    const addr = XLSX.utils.encode_cell({r:rowIdx, c});
    xlStyle(ws, addr, style);
  }
}

// Style a range of cells
function xlStyleRange(ws, r1, c1, r2, c2, style) {
  for (let r = r1; r <= r2; r++)
    for (let c = c1; c <= c2; c++)
      xlStyle(ws, XLSX.utils.encode_cell({r,c}), style);
}

// Set a cell's value and style together
function xlSet(ws, r, c, v, style) {
  const addr = XLSX.utils.encode_cell({r,c});
  const t = typeof v === "number" ? "n" : v instanceof Date ? "d" : "s";
  ws[addr] = { t, v: v === null || v === undefined ? "" : v };
  if (style) ws[addr].s = style;
}

// Add a freeze pane at a row
function xlFreeze(ws, row) {
  ws["!freeze"] = { xSplit:0, ySplit:row, topLeftCell: XLSX.utils.encode_cell({r:row,c:0}) };
}

// Merge cells
function xlMerge(ws, r1, c1, r2, c2) {
  if (!ws["!merges"]) ws["!merges"] = [];
  ws["!merges"].push({s:{r:r1,c:c1},e:{r:r2,c:c2}});
}

// Download helper — write with cellStyles:true
function downloadXLSX(wb, filename) {
  const data = XLSX.write(wb, {type:"array", bookType:"xlsx", cellStyles:true});
  const blob = new Blob([data], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showSaveIndicator("✓ Exported: " + filename);
}

// ── Project info header block used on every sheet ──
function xlProjectHeader(ws, projName, sheetTitle, cols) {
  // Row 0: Project name + sheet title
  xlMerge(ws, 0, 0, 0, cols-1);
  xlSet(ws, 0, 0, `${projName}  ·  ${sheetTitle}`, XL_STYLES.title);
  // Row 1: Exported date
  xlMerge(ws, 1, 0, 1, cols-1);
  xlSet(ws, 1, 0, "Exported: " + new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"}),
    {font:{sz:9,italic:true,color:{rgb:"9A8C98"}}, alignment:{horizontal:"left"}});
  return 2; // next row index
}

// ── Currency format helper (number for XLSX, string for display) ──
function xlNum(v) { return +v || 0; }

function exportCostsToExcel(projName) {
  const wb = XLSX.utils.book_new();
  buildCostSheet(wb, projName);
  downloadXLSX(wb, projName.replace(/\s+/g,"_") + "_Cost_Breakdown.xlsx");
}
function buildCostSheet(wb, projName) {
  const rows = state.costs || blankCosts();
  const COLS = ["CT","Cost Type","Estimated","Month To Date","Job To Date","Projected","Variance","% Complete","Open/Committed","Unapproved AP"];
  const ws = XLSX.utils.aoa_to_sheet([[],[]]);
  xlProjectHeader(ws, projName, "Cost Breakdown", COLS.length);
  let rowIdx = 2;

  // Grand totals
  const gEst  = rows.reduce((s,r)=>s+(+(r.estimated)||0),0);
  const gMTD  = rows.reduce((s,r)=>s+(+(r.mtd)||0),0);
  const gJTD  = rows.reduce((s,r)=>s+(+(r.jtd)||0),0);
  const gComm = rows.reduce((s,r)=>s+(+(r.openCommitted)||0),0);
  const gUAP  = rows.reduce((s,r)=>s+(+(r.unapprovedAP)||0),0);
  const gProj = rows.reduce((s,r)=>s+ctProjected(r),0);
  const gVar  = gEst - gProj;
  const gPct  = gProj > 0 ? gJTD / gProj : (gEst > 0 ? gJTD / gEst : 0);

  // Header row
  COLS.forEach((h,c) => xlSet(ws, rowIdx, c, h, XL_STYLES.header));
  rowIdx++;

  rows.forEach((r, i) => {
    const est  = +(r.estimated)||0;
    const mtd  = +(r.mtd)||0;
    const jtd  = +(r.jtd)||0;
    const comm = +(r.openCommitted)||0;
    const uap  = +(r.unapprovedAP)||0;
    const proj = ctProjected(r);
    const vari = ctVariance(r);
    const pct  = ctPct(r) / 100;
    const base = i%2===0 ? XL_STYLES.even : XL_STYLES.odd;
    xlSet(ws, rowIdx, 0, r.ct, base);
    xlSet(ws, rowIdx, 1, r.name, base);
    [[2,est],[3,mtd],[4,jtd],[5,proj]].forEach(([c,v])=>xlSet(ws,rowIdx,c,v,{...base,...XL_STYLES.money}));
    xlSet(ws,rowIdx,6,vari,{...base,...XL_STYLES.money,...(vari<0?{font:{color:{rgb:"C1121F"}}}:{})});
    xlSet(ws,rowIdx,7,pct,{...base,numFmt:"0.0%"});
    [[8,comm],[9,uap]].forEach(([c,v])=>xlSet(ws,rowIdx,c,v,{...base,...XL_STYLES.money,...(c===9&&v>0?{font:{color:{rgb:"C1121F"}}}:{})}));
    rowIdx++;
  });

  // Totals row
  xlSet(ws, rowIdx, 0, "", XL_STYLES.total);
  xlSet(ws, rowIdx, 1, "TOTAL", XL_STYLES.total);
  [[2,gEst],[3,gMTD],[4,gJTD],[5,gProj]].forEach(([c,v])=>xlSet(ws,rowIdx,c,v,{...XL_STYLES.total,...XL_STYLES.money}));
  xlSet(ws,rowIdx,6,gVar,{...XL_STYLES.total,...XL_STYLES.money,...(gVar<0?XL_STYLES.moneyRed:{})});
  xlSet(ws,rowIdx,7,gPct,{...XL_STYLES.total,numFmt:"0.0%"});
  [[8,gComm],[9,gUAP]].forEach(([c,v])=>xlSet(ws,rowIdx,c,v,{...XL_STYLES.total,...XL_STYLES.money}));
  rowIdx++;

  ws["!cols"] = [{wch:5},{wch:26},{wch:14},{wch:14},{wch:14},{wch:14},{wch:14},{wch:10},{wch:16},{wch:14}];
  xlFreeze(ws, 3);
  ws["!ref"] = XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rowIdx,c:COLS.length-1}});
  XLSX.utils.book_append_sheet(wb, ws, "Cost Breakdown");
}

function buildInvoiceSheet(wb, projName) {
  const pos = state.purchaseOrders;
  if (!pos.length) { XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["No POs"]]), "Invoices"); return; }
  // Summary sheet
  const SCOLS = ["PO #","Vendor","Description","Original $","Adjusted $","Invoiced $","Remaining $"];
  const sRows = [[],[],SCOLS];
  let sTotalOrig=0, sTotalAdj=0, sTotalInv=0;
  for (const po of pos) {
    const inv = (po.invoices||[]).reduce((s,i)=>s+(+i.amount||0),0);
    const adj  = +po.adjustedAmount||+po.originalAmount||0;
    sTotalOrig+=+po.originalAmount||0; sTotalAdj+=adj; sTotalInv+=inv;
    sRows.push([po.poNumber,po.vendor,po.description,xlNum(po.originalAmount),xlNum(adj),inv,adj-inv]);
  }
  sRows.push(["","","TOTAL",sTotalOrig,sTotalAdj,sTotalInv,sTotalAdj-sTotalInv]);
  const ws = XLSX.utils.aoa_to_sheet(sRows);
  xlProjectHeader(ws, projName, "Invoice / PO Tracker", SCOLS.length);
  SCOLS.forEach((h,c) => xlSet(ws, 2, c, h, XL_STYLES.header));
  xlFreeze(ws, 3);
  pos.forEach((_,i) => {
    const r = 3+i; xlStyleRow(ws, r, SCOLS.length, i%2===0?XL_STYLES.even:XL_STYLES.odd);
    [3,4,5,6].forEach(c=>xlStyle(ws, XLSX.utils.encode_cell({r,c}), XL_STYLES.money));
  });
  const tr = 3+pos.length;
  xlStyleRow(ws, tr, SCOLS.length, XL_STYLES.total);
  [3,4,5,6].forEach(c=>xlStyle(ws, XLSX.utils.encode_cell({r:tr,c}), XL_STYLES.total));
  ws["!cols"] = [{wch:12},{wch:22},{wch:28},{wch:14},{wch:14},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws, "PO Summary");
  // Individual PO detail sheets
  for (const po of pos) {
    const DCOLS = ["Invoice #","Date Received","Date Approved","Date Paid","Amount","Description"];
    const dRows = [
      ["PO #",po.poNumber||"","Vendor",po.vendor||""],
      ["Description",po.description||"","Original $",xlNum(po.originalAmount)],
      ["Adjusted $",xlNum(po.adjustedAmount)||"","",""],
      [],
      DCOLS,
      ...(po.invoices||[]).map(inv=>[inv.number||"",inv.dateReceived||"",inv.dateApproved||"",inv.datePaid||"",xlNum(inv.amount),inv.description||""])
    ];
    const invTotal = (po.invoices||[]).reduce((s,i)=>s+(+i.amount||0),0);
    dRows.push(["","","","TOTAL",invTotal,""]);
    const dws = XLSX.utils.aoa_to_sheet(dRows);
    DCOLS.forEach((h,c) => xlSet(dws, 4, c, h, XL_STYLES.header));
    xlSet(dws, 0, 3, xlNum(po.originalAmount), XL_STYLES.money);
    xlSet(dws, 1, 3, xlNum(po.adjustedAmount)||xlNum(po.originalAmount), XL_STYLES.money);
    const invTotalRow = 5+(po.invoices||[]).length;
    xlStyleRow(dws, invTotalRow, DCOLS.length, XL_STYLES.total);
    xlSet(dws, invTotalRow, 4, invTotal, XL_STYLES.total);
    (po.invoices||[]).forEach((_,i) => {
      xlStyleRow(dws, 5+i, DCOLS.length, i%2===0?XL_STYLES.even:XL_STYLES.odd);
      xlStyle(dws, XLSX.utils.encode_cell({r:5+i,c:4}), XL_STYLES.money);
    });
    dws["!cols"] = [{wch:14},{wch:14},{wch:14},{wch:14},{wch:14},{wch:32}];
    const sn = (po.poNumber||po.vendor||"PO").replace(/[:\\\/\?\*\[\]]/g,"").substring(0,31);
    XLSX.utils.book_append_sheet(wb, dws, sn || "PO");
  }
}

function buildCoverSheet(wb, projName) {
  const p = state.project;
  const allCosts = state.costs || blankCosts();
  const totalBudget   = allCosts.reduce((s,r)=>s+(+(r.estimated)||0),0);
  const totalForecast = allCosts.reduce((s,r)=>s+ctProjected(r),0);
  const variance      = totalBudget - totalForecast;
  const totalPOValue  = (state.purchaseOrders||[]).reduce((s,po)=>s+(+po.originalAmount||0),0);
  const totalInvoiced = (state.purchaseOrders||[]).flatMap(po=>po.invoices||[]).reduce((s,i)=>s+(+i.amount||0),0);
  const openRFIs      = (state.rfis||[]).filter(r=>r.status==="Open").length;
  const pendingSubs   = (state.submittals||[]).filter(s=>s.status==="Awaiting Approval").length;
  const openCOs       = (state.changeOrders||[]).filter(c=>!c.amountApproved).length;

  const rows = [
    ["PROJECT OVERVIEW"],
    ["Exported: " + new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"})],
    [],
    ["PROJECT INFORMATION",""],
    ["Job #",p.jobNumber||""],["Project Name",p.projectName||""],["Address",p.address||""],
    ["Work Type",p.workType||""],["Job Type",p.jobType||""],["Size (kWdc)",p.sizeDC||""],
    ["Customer",p.customer||""],["PM",p.pm||""],["Superintendent",p.superintendent||""],
    ["Engineer",p.engineer||""],["Contract Type",p.contractType||""],["Contract Amount",p.contractAmount||""],
    ["Scheduled Start",p.scheduleStart||""],["Scheduled End",p.scheduleEnd||""],
    [],
    ["COST SUMMARY",""],
    ["Total Budget",totalBudget],["Total Forecast",totalForecast],
    ["Variance",variance],["PO Committed",totalPOValue],["Invoiced to Date",totalInvoiced],
    [],
    ["QUICK METRICS",""],
    ["Open RFIs",openRFIs],["Pending Submittals",pendingSubs],
    ["Open Change Orders",openCOs],["Total Change Orders",state.changeOrders.length],
    ["Schedule Tasks",state.schedule.tasks.length],
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  // Styles
  xlMerge(ws, 0, 0, 0, 1); xlSet(ws, 0, 0, "PROJECT OVERVIEW — " + (p.projectName||""), XL_STYLES.title);
  xlMerge(ws, 1, 0, 1, 1); xlSet(ws, 1, 0, rows[1][0], {font:{sz:9,italic:true,color:{rgb:"9A8C98"}}});
  [[3,0],[17,0],[22,0]].forEach(([r]) => {
    xlMerge(ws, r, 0, r, 1);
    xlSet(ws, r, 0, rows[r][0], XL_STYLES.catHead);
  });
  // Money cells
  [[18,1,totalBudget],[19,1,totalForecast],[20,1,variance],[21,1,totalPOValue],[22,1,totalInvoiced]].forEach(([r,c,v])=>{
    xlSet(ws, r, c, v, v<0&&r===20?{...XL_STYLES.money,...XL_STYLES.moneyRed}:XL_STYLES.money);
  });
  ws["!cols"] = [{wch:24},{wch:32}];
  XLSX.utils.book_append_sheet(wb, ws, "Project Overview");
}

// ═══════════════════════════════════════════════════════
// PROJECT DASHBOARD — Home Landing Page
// Live metrics from all modules: Cost, Cash Flow, Schedule, COs, RFIs, Submittals
// ═══════════════════════════════════════════════════════

function renderDashboard() {
  const p = state.project;
  const today = new Date().toISOString().split("T")[0];

  // ── Cost Health ──
  const allCosts = state.costs || blankCosts();
  const totalBudget    = allCosts.reduce((s,r)=>s+(+(r.estimated)||0),0);
  const totalCommitted = allCosts.reduce((s,r)=>s+(+(r.openCommitted)||0),0);
  const totalActual    = allCosts.reduce((s,r)=>s+(+(r.jtd)||0),0);
  const totalForecast  = allCosts.reduce((s,r)=>s+ctProjected(r),0);
  const costVariance = totalBudget - totalForecast;
  const costPct = totalBudget > 0 ? Math.min(100, (totalForecast/totalBudget)*100) : 0;
  const costRAG = costVariance >= 0 ? (costVariance/totalBudget > 0.05 ? "green" : "gold") : "red";

  // ── Change Orders ──
  const cos = state.changeOrders || [];
  const coApproved = cos.reduce((s,c)=>s+(+c.amountApproved||0),0);
  const coPending  = cos.reduce((s,c)=>s+(+c.amountPending||0),0);
  const contractAmt = (+p.contractAmount||0) + coApproved;

  // ── Invoice / PO Spend ──
  const pos = state.purchaseOrders || [];
  const totalPOValue = pos.reduce((s,p)=>s+(+p.originalAmount||0),0);
  const totalInvoiced = pos.reduce((s,po)=>s+(po.invoices||[]).reduce((a,i)=>a+(+i.amount||0),0),0);
  const invoiceSpendPct = totalPOValue > 0 ? Math.min(100,(totalInvoiced/totalPOValue)*100) : 0;
  const invoiceRAG = invoiceSpendPct < 50 ? "green" : invoiceSpendPct < 85 ? "gold" : "red";

  // ── Cash Flow / Billing ──
  const billingPct = contractAmt > 0 ? Math.min(100,(totalInvoiced/contractAmt)*100) : 0;
  const billingRAG = billingPct >= costPct ? "green" : (costPct - billingPct < 15 ? "gold" : "red");

  // ── Schedule ──
  const tasks = (state.schedule && state.schedule.tasks) || [];
  const completableTasks = tasks.filter(t=>t.percentComplete!==undefined);
  const avgPct = completableTasks.length > 0 ? completableTasks.reduce((s,t)=>s+(+t.percentComplete||0),0)/completableTasks.length : 0;
  const schedEnd   = p.scheduleEnd   || p.substCompletion || p.endDate   || "";
  const schedStart  = p.scheduleStart || p.startDate || "";
  let daysRemaining = null, daysElapsed = 0, schedDuration = 0, schedPct = 0;
  if (schedStart && schedEnd) {
    const msStart = new Date(schedStart+"T00:00:00").getTime();
    const msEnd   = new Date(schedEnd+"T00:00:00").getTime();
    const msNow   = new Date().getTime();
    schedDuration = Math.max(1, Math.ceil((msEnd-msStart)/86400000));
    daysElapsed   = Math.max(0, Math.ceil((msNow-msStart)/86400000));
    daysRemaining = Math.ceil((msEnd-msNow)/86400000);
    schedPct      = Math.min(100, (daysElapsed/schedDuration)*100);
  }
  const schedRAG = daysRemaining === null ? "gold" : daysRemaining > 30 ? "green" : daysRemaining > 0 ? "gold" : "red";

  // ── RFIs / Submittals ──
  const rfis = state.rfis || [];
  const openRFIs   = rfis.filter(r=>r.status==="Open").length;
  const closedRFIs = rfis.filter(r=>r.status==="Closed").length;
  const subs = state.submittals || [];
  const pendingSubs   = subs.filter(s=>s.status==="Awaiting Approval").length;
  const approvedSubs  = subs.filter(s=>s.status==="Approved").length;
  const rfiRAG = openRFIs === 0 ? "green" : openRFIs < 5 ? "gold" : "red";
  const subRAG = pendingSubs === 0 ? "green" : pendingSubs < 5 ? "gold" : "red";

  // ── Subcontractors ──
  const subcos = state.subcontractors || [];
  const awardedSubs = subcos.filter(s=>s.awarded).length;
  const totalSubs   = subcos.length;

  // ── Spec Exceptions ──
  const specs = state.specExceptions || [];
  const pendingSpecs = specs.filter(s=>!s.approvalStatus||s.approvalStatus==="Pending").length;

  // ── RAG color helper ──
  const RAG = {
    green: { bg:"#81B29A22", border:"#81B29A", text:"#2d6a4f", dot:"#81B29A" },
    gold:  { bg:"#F2CC8F22", border:"#F2CC8F", text:"#8a6d00", dot:"#F2CC8F" },
    red:   { bg:"#c1121f18", border:"#c1121f", text:"#c1121f", dot:"#c1121f" }
  };

  function ragDot(color) {
    const c = RAG[color]||RAG.gold;
    return `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c.dot};margin-right:5px;flex-shrink:0"></span>`;
  }

  function progressBar(pct, color="#3D405B", height=8, bg="#eee8e0") {
    return `<div style="background:${bg};border-radius:99px;height:${height}px;overflow:hidden;width:100%">
      <div style="height:100%;width:${Math.min(100,pct||0).toFixed(1)}%;background:${color};border-radius:99px;transition:width .4s ease"></div>
    </div>`;
  }

  // SVG Donut chart
  function donutChart(segments, size=120, stroke=14) {
    // segments: [{value, color, label}]
    const total = segments.reduce((s,x)=>s+(+x.value||0),0);
    if (total === 0) return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${(size-stroke)/2}" fill="none" stroke="#eee8e0" stroke-width="${stroke}"/></svg>`;
    const r = (size-stroke)/2;
    const circumference = 2*Math.PI*r;
    let offset = 0;
    let paths = "";
    for (const seg of segments) {
      if (!seg.value) continue;
      const frac = seg.value/total;
      const dash = frac * circumference;
      const gap = circumference - dash;
      paths += `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${stroke}" stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-dashoffset="${(-offset*circumference/total).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dasharray .4s"/>`;
      offset += seg.value;
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>`;
  }

  function bigCard(title, content, rag) {
    const c = RAG[rag]||RAG.gold;
    return `<div style="background:var(--card);border-radius:16px;border:2px solid ${c.border};padding:22px 24px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:${c.text}">${ragDot(rag)}${esc(title)}</div>
      ${content}
    </div>`;
  }

  let html = `<div class="page-title" data-module="dashboard">Dashboard<span class="sub">${esc(p.projectName||"—")}</span></div>`;
  html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;margin-bottom:24px">`;

  // ── Card 1: Cost Health ──
  html += bigCard("Cost Health", `
    <div style="display:flex;align-items:center;gap:18px">
      <div style="flex-shrink:0;position:relative">
        ${donutChart([
          {value:totalActual, color:"var(--accent)"},
          {value:Math.max(0,totalForecast-totalActual), color:"#F2CC8F"},
          {value:Math.max(0,totalBudget-totalForecast), color:"#eee8e0"}
        ])}
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div style="font-size:13px;font-weight:700;color:var(--text-mid)">${costPct.toFixed(0)}%</div>
          <div style="font-size:9px;color:var(--text-lt);text-transform:uppercase">of budget</div>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:7px">
        <div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:var(--text-lt)">Budget</span><strong>${fmt$(totalBudget)}</strong></div>
        <div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:var(--text-lt)">Committed</span><span>${fmt$(totalCommitted)}</span></div>

  html += bigCard("Invoice / PO Spend", `

  // ── Recent Activity widget ──
  html += `<div style="background:var(--card);border-radius:14px;border:1px solid var(--border);padding:16px 20px;margin-top:16px">

let portfolioProjects = JSON.parse(localStorage.getItem("planwise_portfolio")||"[]");
function savePortfolio() { localStorage.setItem("planwise_portfolio", JSON.stringify(portfolioProjects)); }

function renderPortfolio() {
  let html = `<div class="page-title" data-module="portfolio">Portfolio Dashboard</div>`;
  html += secHeader("Portfolio Dashboard", portfolioProjects.length);

  // Explainer banner
  html += `<div class="form-card" style="margin-bottom:20px;display:flex;gap:18px;align-items:flex-start">

  // Drop zone
  html += `<div id="portfolioDropZone" style="border:2px dashed var(--border-dk);border-radius:14px;padding:32px;text-align:center;margin-bottom:24px;background:var(--card);cursor:pointer;transition:border-color .2s"
    ondragover="event.preventDefault();this.style.borderColor='var(--accent)'"
    ondragleave="this.style.borderColor='var(--border-dk)'"
    ondrop="handlePortfolioDrop(event)"
    onclick="document.getElementById('portfolioFileInput').click()">
    <div style="font-size:28px;margin-bottom:8px">&#128194;</div>
    <div style="font-size:14px;font-weight:600;color:var(--text-mid);margin-bottom:4px">Drop saved Planwise <code>.html</code> project files here</div>

  </div>`;

  if (!portfolioProjects.length) {
    html += `<div class="form-card">${emptyState("—","No projects imported yet — drop saved Planwise project files above to build your portfolio view")}</div>`;
  } else {

    const totalContract = portfolioProjects.reduce((s,p)=>s+(+p.contractAmount||0),0);

    const totalBudget = portfolioProjects.reduce((s,p)=>s+(+p.totalBudget||0),0);
    html += `<div class="stat-grid" style="grid-template-columns:repeat(4,1fr)">

function extractProjectSummary(htmlString) {
  // Parse the embedded JSON data from a Planwise HTML file
  const match = htmlString.match(/<!--PLANWISE_DATA_START-->[\s\S]*?id="planwise-embedded-data">([\s\S]*?)<\/script>[\s\S]*?<!--PLANWISE_DATA_END-->/);
  if (!match || !match[1] || match[1].trim()==="null") return null;
  try {
    const data = JSON.parse(match[1]);
    const p = data.project || {};
    const allCosts = Array.isArray(data.costs) ? data.costs : Object.values(data.costs||{}).flat();
    return {
      id: uid(),
      projectName: p.projectName || "",
      jobNumber: p.jobNumber || "",
      contractAmount: p.contractAmount || 0,
      totalBudget: allCosts.reduce((s,r)=>s+(+(r.estimated||r.budget)||0),0),
      totalActual: allCosts.reduce((s,r)=>s+(+(r.jtd||r.actual)||0),0),
      coCount: (data.changeOrders||[]).length,
      openRFIs: (data.rfis||[]).filter(r=>r.status==="Open").length,
      submittalsAwaiting: (data.submittals||[]).filter(s=>s.status==="Awaiting Approval").length,
      scheduleStart: p.scheduleStart || "",
      scheduleEnd: p.scheduleEnd || "",
      pm: p.pm || "",
      importedAt: new Date().toLocaleDateString()
    };
  } catch(e) { return null; }
}

window.handlePortfolioDrop = (e) => {
  e.preventDefault();
  e.currentTarget.style.borderColor = "var(--border-dk)";
  handlePortfolioFiles(e.dataTransfer.files);
};

window.handlePortfolioFiles = (files) => {
  let skipped = 0;
  for (const file of files) {
    if (!file.name.endsWith(".html")) { skipped++; continue; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const summary = extractProjectSummary(e.target.result);
      if (summary) {
        // Replace if same job number exists
        const idx = portfolioProjects.findIndex(p=>p.jobNumber && p.jobNumber===summary.jobNumber);
        if (idx>=0) portfolioProjects[idx] = summary;
        else portfolioProjects.push(summary);
        savePortfolio();
        render();
        showSaveIndicator("✓ Imported: " + (summary.projectName||file.name));
      } else {
        showSaveIndicator("⚠ No project data found in " + file.name);
      }
    };
    reader.readAsText(file);
    if (skipped === files.length) {
      showSaveIndicator("⚠ Portfolio only accepts saved Planwise .html files — use Import Files for Vista PDF exports or Excel");
    }
  }
};

window.rmPortfolioProject = (id) => {
  portfolioProjects = portfolioProjects.filter(p=>p.id!==id);
  savePortfolio();
  render();
};

const ACT_MODULE_META = {
  rfis:           { label:"RFI Log",        color:"#E07A5F" },
  changeOrders:   { label:"Change Orders",  color:"#3D405B" },
  purchaseOrders: { label:"Invoices/POs",   color:"#81B29A" },
  subcontractors: { label:"Subcontractors", color:"#F2CC8F" },
  submittals:     { label:"Submittals",     color:"#9A8C98" },
  specExceptions: { label:"Spec Except.",   color:"#C1121F" },
  schedule:       { label:"Schedule",       color:"#3D405B" },
  costs:          { label:"Cost Breakdown", color:"#81B29A" },
  import:         { label:"Import",         color:"#F4A261" },
  export:         { label:"Export",         color:"#9A8C98" },
  system:         { label:"System",         color:"#C4BBB2" },
};

// ── Core log function ──
function logActivity(module, type, action, detail) {
  // type: "create" | "delete" | "status" | "import" | "export" | "edit"
  if (!state.activityLog) state.activityLog = [];
  state.activityLog.unshift({
    id: uid(),
    ts: new Date().toISOString(),
    module,
    type,
    action,
    detail: detail || ""
  });
  // Cap at 500 entries
  if (state.activityLog.length > 500) state.activityLog.length = 500;
  // No saveData here — callers already call saveData after their own mutation
}

// ── Activity log filter state ──
let actLogFilter = "all";
window.setActFilter = (f) => { actLogFilter = f; render(); };

// ── Format relative timestamp ──
function fmtActTime(isoStr) {
  const d = new Date(isoStr);
  const now = new Date();
  const diffMs = now - d;
  const diffMin = Math.floor(diffMs / 60000);
  const diffHr  = Math.floor(diffMin / 60);
  const diffDay = Math.floor(diffHr / 24);
  if (diffMin < 1)   return "just now";
  if (diffMin < 60)  return diffMin + "m ago";
  if (diffHr  < 24)  return diffHr  + "h ago";
  if (diffDay < 7)   return diffDay + "d ago";
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}

function fmtActDate(isoStr) {
  const d = new Date(isoStr);
  const today = new Date();
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
  if (d.toDateString() === today.toDateString())     return "Today";
  if (d.toDateString() === yesterday.toDateString()) return "Yesterday";
  return d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
}

// ── Render the full Activity Log tab ──
function renderActivityLog() {
  const log = state.activityLog || [];

  const modules = [...new Set(log.map(e=>e.module))].filter(m=>ACT_MODULE_META[m]);
  const filtered = actLogFilter === "all" ? log : log.filter(e=>e.module===actLogFilter);

  // Filter bar
  let html = `<div class="page-title" data-module="activityLog">Activity Log</div>`;
  html += secHeader("Activity Log", log.length, "", "");
  html += `<div class="act-filter-bar">
    <button class="act-filter-btn ${actLogFilter==="all"?"active":""}" onclick="setActFilter('all')">All</button>
    ${modules.map(m=>`<button class="act-filter-btn ${actLogFilter===m?"active":""}" onclick="setActFilter('${m}')">
      ${esc(ACT_MODULE_META[m]?.label||m)}
    </button>`).join("")}
    ${log.length>0?`<button class="act-filter-btn" style="margin-left:auto;color:var(--red)" onclick="if(confirm('Clear all activity log entries?')){state.activityLog=[];saveData(state);render();}">Clear Log</button>`:""}
  </div>`;

  if (!filtered.length) {
    return html + `<div class="act-empty">
      <div style="font-size:36px;margin-bottom:8px">📋</div>
      <div style="font-weight:600">${log.length?'No entries for this filter':'No activity recorded yet'}</div>
      <div style="font-size:12px;margin-top:6px">Actions like creating records, changing statuses, and importing data will appear here.</div>
    </div>`;
  }

  // Group by date
  const byDay = [];
  let currentDay = "", currentGroup = null;
  for (const entry of filtered) {
    const day = fmtActDate(entry.ts);
    if (day !== currentDay) {
      currentDay = day;
      currentGroup = { day, entries: [] };
      byDay.push(currentGroup);
    }
    currentGroup.entries.push(entry);
  }

  html += `<div class="act-timeline">`;
  for (const group of byDay) {
    html += `<div class="act-day-label">${esc(group.day)} <span style="font-weight:400;font-size:10px">(${group.entries.length})</span></div>`;
    for (const e of group.entries) {
      const meta = ACT_MODULE_META[e.module] || { label:e.module, color:"#9A8C98" };
      const dotClass = `act-dot-${e.type||"edit"}`;
      html += `<div class="act-entry">
        <div class="act-dot ${dotClass}"></div>
        <div class="act-body">
          <div class="act-action">${esc(e.action)}</div>
          ${e.detail?`<div class="act-meta">
            <span class="act-module-badge" style="background:${meta.color}22;color:${meta.color}">${esc(meta.label)}</span>
            <span>${esc(e.detail.substring(0,120))}</span>
          </div>`:`<div class="act-meta"><span class="act-module-badge" style="background:${meta.color}22;color:${meta.color}">${esc(meta.label)}</span></div>`}
        </div>
        <div class="act-time">${fmtActTime(e.ts)}</div>
      </div>`;
    }
  }
  html += `</div>`;
  return html;
}

// ── Mini activity widget for dashboard (last N entries) ──
function renderActDashWidget(n=8) {
  const log = (state.activityLog||[]).slice(0,n);
  if (!log.length) return `<div style="color:var(--text-lt);font-size:12px;padding:12px 0">No activity recorded yet.</div>`;
  return log.map(e=>{
    const meta = ACT_MODULE_META[e.module] || { label:e.module, color:"#9A8C98" };
    const dotClass = `act-dot-${e.type||"edit"}`;
    return `<div class="act-dash-row">
      <div class="act-dot ${dotClass}" style="flex-shrink:0"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.action)}</div>
        <div style="font-size:10px;color:var(--text-lt);margin-top:1px">
          <span style="display:inline-block;padding:0 5px;border-radius:8px;background:${meta.color}22;color:${meta.color};font-weight:700;font-size:9px">${esc(meta.label)}</span>
          ${e.detail?`&nbsp;${esc(e.detail.substring(0,50))}`:""}

      <div style="font-size:10px;color:var(--text-lt);flex-shrink:0;white-space:nowrap">${fmtActTime(e.ts)}</div>
    </div>`;
  }).join("");
}

// Keyword + fuzzy cross-module search, zero dependencies
// Cmd/Ctrl+K to open, Esc to close, ↑↓ to navigate
// ═══════════════════════════════════════════════════════

let searchOpen   = false;
let searchQuery  = "";
let searchFocus  = 0;   // index of keyboard-focused result

// ── Index: flatten every record across all modules into searchable documents ──
function buildSearchIndex() {
  const docs = [];

  const add = (tab, icon, title, meta, id, score0=1) =>
    docs.push({ tab, icon, title, meta: meta || "", id, score0 });

  // RFIs
  for (const r of (state.rfis||[])) {

      [r.question, r.response, r.questionFrom, r.status].filter(Boolean).join(" · ").substring(0,100),
      r.id, r.status==="Open"?1.2:1);
  }

  // Change Orders
  for (const c of (state.changeOrders||[])) {
    add("changeOrders","📝",
      `CO #${c.coNumber||""}${c.description?" — "+c.description.substring(0,60):""}`,
      [c.dateSubmitted, c.approvedBy, c.custCONumber].filter(Boolean).join(" · "),
      c.id);
  }

  // Invoice / POs
  for (const po of (state.purchaseOrders||[])) {
    add("invoices","🧾",
      `PO ${po.poNumber||""}${po.vendor?" · "+po.vendor:""}`,
      [po.description, po.originalAmount?"$"+Number(po.originalAmount).toLocaleString():""].filter(Boolean).join(" · ").substring(0,100),
      po.id);
    for (const inv of (po.invoices||[])) {
      add("invoices","🧾",
        `Invoice ${inv.number||""}${po.vendor?" ("+po.vendor+")":""}`,
        [inv.description, inv.amount?"$"+Number(inv.amount).toLocaleString():"", inv.dateReceived].filter(Boolean).join(" · "),
        po.id);  // navigate to parent PO
    }
  }

  // Subcontractors
  for (const s of (state.subcontractors||[])) {
    add("subcontractors","🏗️",
      `${s.company||"Unknown"}${s.trade?" ["+s.trade+"]":""}`,
      [s.contact, s.phone, s.email, s.awarded?"AWARDED":"", s.quoteAmount?"Quote: "+fmt$(+s.quoteAmount):""].filter(Boolean).join(" · ").substring(0,100),
      s.id, s.awarded?1.3:1);
  }

  // Submittals
  for (const s of (state.submittals||[])) {
    add("submittals","📄",
      s.description||s.fileName||"Submittal",
      [s.status, s.uploadedBy, s.uploadDate, s.fileName].filter(Boolean).join(" · "),
      s.id);
  }

  // Spec Exceptions
  for (const s of (state.specExceptions||[])) {
    add("specExceptions","📋",
      `Spec ${s.specRef||""}${s.varianceRequest?" — "+s.varianceRequest.substring(0,50):""}`,
      [s.approvalStatus, s.justification].filter(Boolean).join(" · ").substring(0,100),
      s.id);
  }

  // Schedule tasks
  for (const t of (state.schedule&&state.schedule.tasks||[])) {
    add("schedule","📅",
      t.name||"Task",
      [t.start&&t.end?t.start+" → "+t.end:"", t.percentComplete?t.percentComplete+"%":""].filter(Boolean).join(" · "),
      t.id, (+t.level||0)===0?1.2:1);
  }

  // Cost lines
  for (const r of (state.costs||[])) {
    add("costs","📊",
      `[CT${r.ct}] ${r.name||"Cost Type"}`,
      [r.estimated?"Est: $"+Number(r.estimated).toLocaleString():"", r.jtd?"JTD: $"+Number(r.jtd).toLocaleString():""].filter(Boolean).join(" · "),
      r.id);
  }

  // Drawings
  for (const d of (state.drawings||[])) {
    add("drawings","📐",
      `${d.drawingNumber||""} ${d.title||d.description||"Drawing"}`.trim(),
      [d.discipline, d.revision?"Rev "+d.revision:"", d.status].filter(Boolean).join(" · "),
      d.id);
  }

  // Look-ahead tasks
  for (const t of (state.lookAhead&&state.lookAhead.tasks||[])) {
    add("lookAhead","🗓️", t.name||"LA Task", t.notes||"", t.id);
  }

  return docs;
}

// ── Tokenise a string into lowercase words ──
function tokenise(s) {
  return String(s||"").toLowerCase().replace(/[^a-z0-9$#.\-]/g," ").split(/\s+/).filter(Boolean);
}

// ── Score a document against a query ──
// Returns 0 if no match, higher = better
function scoreDoc(doc, queryTokens, rawQuery) {
  if (!queryTokens.length) return 0;
  const fullText = (doc.title + " " + doc.meta).toLowerCase();
  const titleText = doc.title.toLowerCase();

  // Exact phrase match in title
  if (titleText.includes(rawQuery.toLowerCase())) return 100 * doc.score0;

  // Exact phrase match in meta
  if (fullText.includes(rawQuery.toLowerCase())) return 60 * doc.score0;

  // All tokens must match somewhere
  let score = 0;
  for (const tok of queryTokens) {
    if (titleText.includes(tok)) {
      // Prefix match in title gets highest per-token score
      score += titleText.split(tok).length > 1 ? 20 : 10;
    } else if (fullText.includes(tok)) {
      score += 5;
    } else {
      // Fuzzy: allow 1 char off for tokens >= 4 chars
      if (tok.length >= 4) {
        let fuzzyHit = false;
        for (let i=0; i<fullText.length-tok.length+1; i++) {
          let diff=0;
          for (let j=0;j<tok.length;j++) if (fullText[i+j]!==tok[j]) diff++;
          if (diff<=1) { fuzzyHit=true; break; }
        }
        if (fuzzyHit) score += 2;
        else return 0; // token completely absent = no match
      } else return 0;
    }
  }
  return score * doc.score0;
}

// ── BM25 Search — zero dependencies, works offline ──
// BM25 is the industry standard ranking algorithm (Elasticsearch, Lucene).
// Better than keyword counting: rewards term frequency, penalises common terms.
// k1=1.5 (term saturation), b=0.75 (length normalisation) — standard defaults.
let _bm25Index = null;   // {idf: Map<term,float>, avgLen: float, docs: array}
let _bm25Stale = true;

function _bm25BuildIndex(docs) {
  const N = docs.length;
  if (!N) return { idf: new Map(), avgLen: 0, docs };
  // Term → document frequency
  const df = new Map();
  const docTerms = docs.map(doc => {
    const terms = tokenise(doc.title + ' ' + doc.title + ' ' + doc.meta); // title weighted 2x
    const freq = new Map();
    for (const t of terms) freq.set(t, (freq.get(t) || 0) + 1);
    for (const t of freq.keys()) df.set(t, (df.get(t) || 0) + 1);
    return { freq, len: terms.length };
  });
  const avgLen = docTerms.reduce((s, d) => s + d.len, 0) / N;
  // IDF: log((N - df + 0.5) / (df + 0.5) + 1)  — Robertson/Sparck-Jones
  const idf = new Map();
  for (const [t, dft] of df) idf.set(t, Math.log((N - dft + 0.5) / (dft + 0.5) + 1));
  return { idf, avgLen, docTerms, docs };
}

function _bm25Score(idx, qTerms, docIdx) {
  const { idf, avgLen, docTerms } = idx;
  const { freq, len } = docTerms[docIdx];
  const k1 = 1.5, b = 0.75;
  let score = 0;
  for (const qt of qTerms) {
    const tf = freq.get(qt) || 0;
    if (!tf) continue;
    const idfVal = idf.get(qt) || 0;
    score += idfVal * (tf * (k1 + 1)) / (tf + k1 * (1 - b + b * len / avgLen));
  }
  return score;
}

function runSearch(query) {
  if (!query || query.trim().length < 1) return [];
  const raw    = query.trim();
  const tokens = tokenise(raw);
  if (!tokens.length) return [];
  const docs   = buildSearchIndex();
  if (!docs.length) return [];

  // Rebuild BM25 index if stale (data changed)
  if (_bm25Stale || !_bm25Index || _bm25Index.docs.length !== docs.length) {
    _bm25Index = _bm25BuildIndex(docs);
    _bm25Stale = false;
  }
  const idx = _bm25Index;

  // Exact phrase boost: if raw query appears verbatim in title, score 1000
  const results = docs.map((doc, i) => {
    let score = _bm25Score(idx, tokens, i) * doc.score0;
    const titleLo = doc.title.toLowerCase();
    const fullLo  = (doc.title + ' ' + doc.meta).toLowerCase();
    const rawLo   = raw.toLowerCase();
    if (titleLo.includes(rawLo))  score += 1000;
    else if (fullLo.includes(rawLo)) score += 400;
    return { ...doc, score };
  });

  return results
    .filter(d => d.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 40);
}

// ── Highlight matching text ──
function hlText(text, query) {
  if (!query || !text) return esc(text);
  const raw = query.trim();
  const idx = text.toLowerCase().indexOf(raw.toLowerCase());
  if (idx >= 0) {
    return esc(text.substring(0,idx)) +
      `<mark>${esc(text.substring(idx, idx+raw.length))}</mark>` +
      esc(text.substring(idx+raw.length));
  }
  // Try individual tokens
  let result = esc(text);
  for (const tok of tokenise(raw)) {
    const ti = text.toLowerCase().indexOf(tok);
    if (ti >= 0) {
      result = esc(text.substring(0,ti)) + `<mark>${esc(text.substring(ti,ti+tok.length))}</mark>` + esc(text.substring(ti+tok.length));
      break;
    }
  }
  return result;
}

function renderSearchOverlay() {

  const groups = {};

  for (const r of results) {
    if (!groups[r.tab]) { groups[r.tab] = []; order.push(r.tab); }
    groups[r.tab].push(r);
  }

  let flatList = []; // for keyboard nav
  let resultHTML = "";

  if (!searchQuery.trim()) {
    resultHTML = `<div class="search-empty">
      <div style="font-size:28px;margin-bottom:8px">🔍</div>

      resultHTML += `<div class="search-group-label">${esc(MODULE_LABELS[tab]||tab)} <span style="font-weight:400;text-transform:none;letter-spacing:0">(${items.length}${groups[tab].length>8?"+":""})</span></div>`;

        </div>`;
      }
    }
  }

  return `<div class="search-overlay" id="searchOverlay">
    <div class="search-overlay-bg" onclick="closeSearch()"></div>

        <span><kbd>Esc</kbd> close</span>
        <span style="margin-left:auto;display:flex;align-items:center;gap:8px">
          ${results.length?`<span>${results.length} result${results.length!==1?"s":""}</span>`:""}

// ── Lightweight re-render just the search results without full page render ──
function rerenderSearch() {
  // Only re-render the overlay contents without a full page render
  const overlay = document.getElementById("searchOverlay");
  if (!overlay) { render(); return; }
  const tmp = document.createElement("div");
  tmp.innerHTML = renderSearchOverlay();
  const newOverlay = tmp.firstElementChild;
  if (newOverlay) overlay.replaceWith(newOverlay);
  // Refocus input
  const inp = document.getElementById("searchInput");
  if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

window.closeSearch = () => {
  searchOpen = false; searchQuery = ""; searchFocus = 0;
  render();
};

window.searchNavigate = (tab, id) => {
  searchOpen = false; searchQuery = ""; searchFocus = 0;
  activeTab = tab;
  openModals = {};
  render();
  // Scroll to & flash-highlight the matching row
  setTimeout(() => {
    const el = document.getElementById("row_" + id) ||
               document.querySelector(`[data-id="${id}"]`);
    if (el) {
      el.scrollIntoView({behavior:"smooth", block:"center"});
      el.style.transition = "background .1s";
      el.style.background = "rgba(224,122,95,.25)";
      setTimeout(() => { el.style.background = ""; }, 1600);
    }
  }, 80);
};

window.searchKeydown = (e) => {
  const results = runSearch(searchQuery);
  const total = Math.min(results.length, 40);
  if (e.key === "ArrowDown") {
    e.preventDefault();
    searchFocus = Math.min(searchFocus+1, total-1);
    rerenderSearch();
    document.getElementById("sr_"+searchFocus)?.scrollIntoView({block:"nearest"});
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    searchFocus = Math.max(searchFocus-1, 0);
    rerenderSearch();
    document.getElementById("sr_"+searchFocus)?.scrollIntoView({block:"nearest"});
  } else if (e.key === "Enter") {
    if (results[searchFocus]) {
      const r = results[searchFocus];
      searchNavigate(r.tab, r.id);
    }
  } else if (e.key === "Escape") {
    closeSearch();
  }
};

            <button class="btn-sm-outline" onclick="openImportDialog()" title="Import Viewpoint Vista PDF reports (standard) or Excel/CSV files to populate tabs"><svg viewBox="0 0 16 16" width="13" height="13" style="display:inline-block;vertical-align:middle;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5v8M5 7l3 3 3-3"/><path d="M3 12.5v2h10v-2"/></svg> Import Files</button>
            ${activeTab!=="portfolio"?'<button class="btn-sm-outline" onclick="exportCurrentTab()" title="Export this tab to Excel"><svg viewBox="0 0 16 16" width="13" height="13" style="display:inline-block;vertical-align:middle;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9.5v-8M5 4l3-3 3 3"/><path d="M3 12.5v2h10v-2"/></svg> Export Tab</button>':""}
            <button class="btn-sm-outline" onclick="exportFullProject()" title="Export all modules as a single styled workbook"><svg viewBox="0 0 16 16" width="13" height="13" style="display:inline-block;vertical-align:middle;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9.5v-8M5 4l3-3 3 3"/><path d="M3 12.5v2h10v-2"/></svg> Export All</button>
          </div>
        </div>
        ${pageHTML}
      </div>
    </div>
    <!-- Undo Reset Toast -->
    <div class="undo-toast" id="undoResetToast">
      <span>⚠️ Project was reset</span>
      <button class="undo-toast-btn" onclick="undoReset()">Undo Reset</button>
      <button class="undo-toast-close" onclick="hideUndoToast()" title="Dismiss">✕</button>
      <div class="undo-toast-bar"></div>
    </div>
    ${mobileDrawerHTML}
    ${mobileNavHTML}`;
  const _mainAfter = document.getElementById("mainScroll");
  if (_mainAfter && _st) _mainAfter.scrollTop = _st;
  // Re-show undo toast if snapshot still available (survives re-renders)
  if (sessionStorage.getItem(UNDO_SNAPSHOT_KEY)) {
    const t = document.getElementById("undoResetToast");
    if (t && !t.classList.contains("show")) t.classList.add("show");
  }
}


// === COLUMN RESIZE ===
let _resizing = null;
document.addEventListener("mousedown", e => {
  if (e.target.classList.contains("col-resize")) {
    const th = e.target.parentElement;
    _resizing = { th, startX: e.clientX, startW: th.offsetWidth };
    e.target.classList.add("dragging");
    e.preventDefault();
  }
});
document.addEventListener("mousemove", e => {
  if (_resizing) {
    const w = Math.max(40, _resizing.startW + (e.clientX - _resizing.startX));
    _resizing.th.style.width = w + "px";
    _resizing.th.style.minWidth = w + "px";
  }
});
document.addEventListener("mouseup", e => {
  if (_resizing) {
    document.querySelectorAll(".col-resize.dragging").forEach(el => el.classList.remove("dragging"));
    _resizing = null;
  }
});

// Add resize handles + auto-size textareas after render
const _origRender = render;
render = function() {
  _origRender();
  // Column resize handles
  document.querySelectorAll("th").forEach(th => {
    if (!th.querySelector(".col-resize")) {
      const handle = document.createElement("div");
      handle.className = "col-resize";
      th.appendChild(handle);
    }
  });
  // Auto-size all textareas to fit content
  document.querySelectorAll("textarea.ecell").forEach(ta => {
    ta.style.height = "auto";
    ta.style.height = Math.max(28, ta.scrollHeight) + "px";
    if (!ta._hasAutoResize) {
      ta._hasAutoResize = true;
      ta.addEventListener("input", function() {
        this.style.height = "auto";
        this.style.height = Math.max(28, this.scrollHeight) + "px";
      });
    }
  });
};

// === DRAWINGS TAB ===
function renderDrawings() {
  const drawings = state.drawings || [];
  let html = `<div class="page-title" data-module="drawings">Project Drawings</div>`;
  html += secHeader("Project Drawings", drawings.length);
  
  html += `<div id="drawingDropZone" style="border:2px dashed var(--border-dk);border-radius:14px;padding:32px;text-align:center;margin-bottom:24px;background:var(--card);cursor:pointer;transition:border-color .2s"
    ondragover="event.preventDefault();this.style.borderColor='var(--accent)'"
    ondragleave="this.style.borderColor='var(--border-dk)'"
    ondrop="handleDrawingDrop(event)"
    onclick="document.getElementById('drawingFileInput').click()">
    <div style="font-size:28px;margin-bottom:8px">📐</div>
    <div style="font-size:14px;font-weight:600;color:var(--text-mid);margin-bottom:4px">Drop drawings here (PDF, JPG, PNG)</div>
    <div style="font-size:12px;color:var(--text-lt)">Files are embedded in the saved HTML — no external storage needed</div>
    <input type="file" id="drawingFileInput" accept=".pdf,.jpg,.jpeg,.png,.gif,.bmp,.tiff,.dwg,.dxf" multiple style="display:none" onchange="handleDrawingFiles(this.files)">
  </div>`;

  if (!drawings.length) {
    html += `<div class="form-card">${emptyState("—","No drawings uploaded yet")}</div>`;
  } else {
    html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px">`;
    for (const d of drawings) {
      const isImage = d.type && d.type.startsWith("image/");
      html += `<div class="form-card" style="padding:16px;position:relative">
        <button class="btn-danger" style="position:absolute;top:8px;right:8px" onclick="rmDrawing('${d.id}')">×</button>
        ${isImage ? `<div style="margin-bottom:10px;border-radius:8px;overflow:hidden;background:var(--surface);max-height:180px;display:flex;align-items:center;justify-content:center"><img src="${d.data}" style="max-width:100%;max-height:180px;object-fit:contain" onclick="window.open(this.src)"></div>` : 
        `<div style="margin-bottom:10px;padding:24px;text-align:center;background:var(--surface);border-radius:8px"><div style="font-size:28px">📄</div><div style="font-size:11px;color:var(--text-lt)">${esc(d.type||"file")}</div></div>`}
        <div style="font-weight:600;font-size:13px;margin-bottom:4px">${ecell(d.name,`updDrawing('${d.id}','name',this.value)`,"text","Drawing name…")}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
          <div style="font-size:11px;color:var(--text-lt)">${esc(d.category||"Uncategorized")}</div>
          <div style="font-size:11px;color:var(--text-lt);text-align:right">${esc(d.uploadDate||"")}</div>
        </div>
        <div style="margin-top:6px"><select class="ecell" style="font-size:11px;padding:2px 6px" onchange="updDrawing('${d.id}','category',this.value)">
          <option value="">— Category —</option>
          ${["Site Plan","Electrical","Mechanical","Structural","Civil","Grading","Fencing","Equipment","As-Built","Other"].map(c => `<option ${d.category===c?"selected":""}>${c}</option>`).join("")}
        </select></div>
        ${d.data ? `<a href="${d.data}" download="${esc(d.originalName||d.name)}" style="font-size:11px;color:var(--accent);margin-top:6px;display:block">⬇ Download</a>` : ""}
      </div>`;
    }
    html += `</div>`;
  }
  return html;
}

window.handleDrawingDrop = (e) => {
  e.preventDefault();
  e.currentTarget.style.borderColor = "var(--border-dk)";
  handleDrawingFiles(e.dataTransfer.files);
};

window.handleDrawingFiles = (files) => {
  if (!state.drawings) state.drawings = [];
  for (const file of files) {
    const reader = new FileReader();
    reader.onload = (e) => {
      state.drawings.push({
        id: uid(),
        name: file.name.replace(/\.[^.]+$/, ""),
        originalName: file.name,
        type: file.type,
        size: file.size,
        category: "",
        uploadDate: new Date().toLocaleDateString(),
        data: e.target.result
      });
      saveData(state);
      render();
      showSaveIndicator("✓ Added: " + file.name);
    };
    reader.readAsDataURL(file);
  }
};

window.updDrawing = (id, f, v) => {
  if (!state.drawings) return;
  const d = state.drawings.find(x => x.id === id);
  if (d) { d[f] = v; saveData(state); }
};

window.rmDrawing = (id) => {
  if (!state.drawings) return;
  state.drawings = state.drawings.filter(x => x.id !== id);
  saveData(state);
  render();
};

// === PROJECT KNOWLEDGE BASE (Overview import) ===
window.openKnowledgeImport = () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".pdf,.xlsx,.xls,.csv,.docx,.doc,.txt,.mpp,.xml,.jpg,.png";
  input.multiple = true;
  input.onchange = async (e) => {
    if (!state.knowledgeBase) state.knowledgeBase = [];
    for (const file of e.target.files) {
      const ext = file.name.split(".").pop().toLowerCase();
      showSaveIndicator("📥 Processing: " + file.name);
      
      // For Excel/CSV: also run intelligent import
      if (["xlsx","xls","csv"].includes(ext)) {
        const data = await file.arrayBuffer();
        try {
          await loadSheetJS();
          const wb = XLSX.read(data);
        const detail = classifyAndImportWorkbook(wb, file.name.toLowerCase(), file.name);
        if (detail) {
          saveData(state); render();
          showSaveIndicator("✓ " + detail);
        }
        } catch(err) { console.error(err); }
      }
      
      // For MPP: parse with XML export guidance
      if (ext === "mpp") {
        const data2 = await file.arrayBuffer();
        try {
          await loadSheetJS();
          importMPPFile(new Uint8Array(data2), file.name);
        } catch(e2) { console.error(e2); }
      }
      
      // Store as knowledge base entry
      const reader = new FileReader();
      reader.onload = (ev) => {
        const entry = {
          id: uid(),
          name: file.name,
          type: file.type || ext,
          size: file.size,
          importedAt: new Date().toLocaleDateString(),
          // Store text content for searchability, or base64 for binary
        };
        
        if (["txt","csv"].includes(ext)) {
          entry.textContent = ev.target.result.substring(0, 50000); // Cap at 50KB of text
        } else {
          entry.dataPreview = file.name + " (" + (file.size/1024).toFixed(0) + " KB)";
        }
        
        state.knowledgeBase.push(entry);
        saveData(state);
        render();
      };
      
      if (["txt","csv"].includes(ext)) reader.readAsText(file);
      else reader.readAsDataURL(file);
    }
  };
  input.click();
};


render();

// Ctrl+S / Cmd+S to save file
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") {
    e.preventDefault();
    saveToFile();
  }
  // Ctrl+K / Cmd+K to open search
  if ((e.ctrlKey || e.metaKey) && e.key === "k") {
    e.preventDefault();
    if (searchOpen) closeSearch();
    else openSearch();
  }
  // Escape closes search OR any open modal
  if (e.key === "Escape") {
    if (searchOpen) {
      closeSearch();
    } else if (Object.keys(openModals).length > 0) {
      // Close the most recently opened modal
      const keys = Object.keys(openModals);
      closeModal(keys[keys.length - 1]);
    }
  }
});
</script>
