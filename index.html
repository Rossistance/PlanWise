<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planwise — Construction PM Suite</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%233D405B'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-weight='bold'>◆</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFFBF5;--card:#fff;--border:#eee8e0;--border-dk:#e0d8cd;
  --text:#1D1B20;--text-mid:#3D405B;--text-lt:#9a8c98;--text-faint:#c4bbb2;
  --accent:#E07A5F;--accent2:#3D405B;--green:#81B29A;--gold:#F2CC8F;--red:#c1121f;
  --surface:#f7f3ed;--white:#fff;
  --font:"DM Sans",sans-serif;--font-display:"Fraunces",serif;
}
html,body{height:100%;font-family:var(--font);color:var(--text);background:var(--bg)}
input,select,textarea,button{font-family:var(--font)}
.app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:230px;background:var(--accent2);color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:width .25s;overflow:hidden}
.sidebar.collapsed{width:56px}
.sidebar-logo{padding:20px;display:flex;align-items:center;gap:10px;cursor:pointer}
.sidebar-logo .icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#E07A5F,#F2CC8F);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:14px}
.sidebar-logo .name{font-family:var(--font-display);font-size:17px;font-weight:500;white-space:nowrap}
.sidebar.collapsed .name{display:none}
.sidebar nav{flex:1;padding:8px 10px;overflow-y:auto;overflow-x:hidden}
.sidebar.collapsed nav{padding:8px 6px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:9px;border:none;background:transparent;color:rgba(255,255,255,.6);cursor:pointer;font-size:13px;font-weight:400;text-align:left;white-space:nowrap;margin-bottom:2px;transition:.15s}
.nav-btn.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn .icon{flex-shrink:0;width:18px;height:18px;display:flex;align-items:center;justify-content:center;opacity:0.85}
.sidebar.collapsed .nav-label{display:none}
.sidebar-footer{padding:12px 16px;font-size:11px;color:rgba(255,255,255,.35);border-top:1px solid rgba(255,255,255,.08)}

/* Sidebar search bar */
.sidebar-search{padding:8px 10px 4px;flex-shrink:0}
.sidebar-search-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:rgba(255,255,255,.5);cursor:pointer;font-size:12px;font-family:var(--font);text-align:left;transition:.15s}
.sidebar-search-btn:hover{background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.25)}
.sidebar-search-btn .kbd{margin-left:auto;font-size:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:3px;padding:1px 4px;color:rgba(255,255,255,.35)}
.sidebar.collapsed .sidebar-search{padding:8px 6px 4px}
.sidebar.collapsed .sidebar-search-btn .kbd,.sidebar.collapsed .sidebar-search-btn span{display:none}
.sidebar.collapsed .sidebar-search-btn{padding:8px;justify-content:center}

/* Sidebar team connector */
.sidebar-team{padding:8px 14px 6px;flex-shrink:0}
.sidebar.collapsed .sidebar-team{display:none}
.team-status-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.team-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.team-dot.local{background:rgba(255,255,255,.25)}
.team-dot.connected{background:#81B29A}
.team-dot.error{background:#E07A5F}
.team-action-row{display:flex;gap:4px}
.team-action-btn{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.75);border-radius:6px;padding:5px 6px;font-size:10px;cursor:pointer;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:4px;transition:.15s}
.team-action-btn:hover{background:rgba(255,255,255,.18);color:#fff}

/* Settings popover */
.settings-wrap{position:relative;padding:8px 10px 10px;flex-shrink:0;border-top:1px solid rgba(255,255,255,.08)}
.sidebar.collapsed .settings-wrap{padding:8px 6px}
.settings-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 14px;border-radius:9px;border:none;background:transparent;color:rgba(255,255,255,.45);cursor:pointer;font-size:12px;font-family:var(--font);transition:.15s}
.settings-btn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.8)}
.sidebar.collapsed .settings-btn span{display:none}
.sidebar.collapsed .settings-btn{padding:8px;justify-content:center}
.settings-popover{position:absolute;bottom:calc(100% + 6px);left:10px;right:10px;background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.18);padding:8px;z-index:500;display:none}
.settings-popover.open{display:block}
.settings-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-size:12px;font-family:var(--font);color:var(--text-mid);text-align:left;transition:.12s}
.settings-item:hover{background:var(--surface)}
.settings-item.danger{color:var(--red)}
.settings-item.danger:hover{background:#fff0f0}
.settings-divider{border:none;border-top:1px solid var(--border);margin:4px 0}
.sidebar.collapsed .sidebar-footer{display:none}

/* MAIN */
.main{flex:1;overflow-y:auto;overflow-x:hidden}
.main-inner{padding:24px 32px 60px;max-width:1200px;margin:0 auto}
.page-title{font-family:var(--font-display);font-size:26px;font-weight:500;margin-bottom:24px}
.page-title .sub{font-size:16px;color:var(--text-lt);font-weight:400;margin-left:6px}

/* SECTION HEADER */
.sec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sec-header h2{font-family:var(--font-display);font-size:20px;font-weight:500}
.sec-header .count{font-size:12px;color:var(--text-lt);font-weight:500;background:var(--surface);padding:2px 10px;border-radius:20px;margin-left:10px}

/* CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--card);border-radius:12px;padding:16px 20px;border:1px solid var(--border)}
.stat-card .label{font-size:11px;font-weight:600;color:var(--text-lt);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.stat-card .value{font-family:var(--font-display);font-size:22px;font-weight:500}
.form-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:24px;margin-bottom:20px}
.form-card h4{font-family:var(--font-display);font-size:15px;font-weight:500;margin-bottom:16px;color:var(--text-mid)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}

/* FORM ELEMENTS */
.field label{font-size:11px;font-weight:600;color:var(--text-lt);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--white);outline:none;color:var(--text);transition:border .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:60px}

/* BUTTONS */
.btn{font-size:13px;font-weight:600;padding:8px 20px;border-radius:9px;border:none;cursor:pointer;transition:.15s}
.btn-primary{background:var(--accent2);color:#fff}
.btn-primary:hover{background:#2d2f45}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--accent2)}
.btn-sm{font-size:12px;padding:5px 14px;border-radius:7px}
.btn-sm-outline{font-size:12px;padding:5px 14px;border-radius:7px;background:transparent;border:1px solid var(--border);color:var(--accent2);font-weight:600;cursor:pointer}
.btn-sm-outline:hover{border-color:var(--accent)}
.btn-danger{color:var(--text-faint);background:none;border:none;cursor:pointer;font-size:16px;padding:2px 6px}
.btn-danger:hover{color:var(--red)}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);background:var(--card)}
table{width:100%;border-collapse:collapse;table-layout:auto}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-lt);padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);background:var(--surface);white-space:normal;word-wrap:break-word;overflow-wrap:break-word}
td{font-size:13px;padding:10px 14px;border-bottom:1px solid var(--border);white-space:normal;word-wrap:break-word;overflow-wrap:break-word;vertical-align:top}
td.mono{font-variant-numeric:tabular-nums}
td.right{text-align:right}

/* EDITABLE CELL */
.ecell{border:1px solid transparent;background:transparent;padding:4px 6px;font-size:13px;border-radius:6px;width:100%;outline:none;color:var(--text);font-family:var(--font);white-space:normal;word-wrap:break-word;overflow-wrap:break-word;box-sizing:border-box}
.ecell:focus{border-color:var(--accent);background:var(--white)}
textarea.ecell{resize:vertical;min-height:28px;overflow:hidden}

/* BADGE */
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}

/* CROSS-MODULE LINK CHIPS */
.link-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 6px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(61,64,91,.08);color:var(--accent2);border:1px solid rgba(61,64,91,.18);cursor:pointer;white-space:nowrap;transition:.15s;text-decoration:none;vertical-align:middle}
.link-chip:hover{background:rgba(61,64,91,.14);border-color:var(--accent2)}
.link-chip .chip-icon{font-size:10px;opacity:.7}
.link-chip.chip-co{background:rgba(242,204,143,.15);color:#8a6d00;border-color:#F2CC8F}
.link-chip.chip-rfi{background:rgba(224,122,95,.1);color:#b85a3f;border-color:var(--accent)}
.link-chip.chip-po{background:rgba(129,178,154,.12);color:#2d6a4f;border-color:var(--green)}
.link-chip.chip-cost{background:rgba(61,64,91,.08);color:var(--accent2);border-color:var(--accent2)}
.link-chip.chip-sub{background:rgba(129,178,154,.12);color:#2d6a4f;border-color:var(--green)}
.link-select{font-size:12px;padding:3px 8px;border-radius:7px;border:1px solid var(--border);background:var(--white);color:var(--text);outline:none;cursor:pointer;transition:border .2s}
.link-select:focus{border-color:var(--accent)}
.links-cell{display:flex;flex-direction:column;gap:4px;min-width:120px}

/* SCHEDULE GANTT ENHANCEMENTS */
.gantt-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);background:var(--card)}
.gantt-table{width:100%;border-collapse:collapse}
.gantt-table th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-lt);padding:7px 10px;border-bottom:1px solid var(--border);background:var(--surface);white-space:nowrap}
.gantt-table td{font-size:12px;padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.gantt-table tr.summary-row{background:var(--surface);font-weight:700}
.gantt-table tr.critical-row td{background:rgba(193,18,31,.035)}
.gantt-table tr:hover:not(.summary-row) td{background:rgba(61,64,91,.03)}
.task-ctrl-btn{background:none;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:10px;padding:1px 5px;color:var(--text-lt);transition:.12s;line-height:1.4}
.task-ctrl-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.sched-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:10px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px}
.sched-toolbar label{font-size:12px;font-weight:600;color:var(--text-mid)}
.toggle-pill{display:flex;align-items:center;gap:7px;cursor:pointer}
.toggle-pill input{display:none}
.toggle-track{display:inline-block;width:34px;height:18px;border-radius:9px;background:var(--border-dk);transition:.2s;position:relative;flex-shrink:0}
.toggle-pill input:checked+.toggle-track{background:var(--green)}
.toggle-track::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-pill input:checked+.toggle-track::after{left:18px}
.cp-badge{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:4px;vertical-align:middle;flex-shrink:0}

/* ACTIVITY LOG */
.act-timeline{display:flex;flex-direction:column;gap:0}
.act-day-label{font-size:11px;font-weight:700;color:var(--text-lt);text-transform:uppercase;letter-spacing:.07em;padding:18px 0 8px;border-bottom:1px solid var(--border);margin-bottom:2px}
.act-day-label:first-child{padding-top:0}
.act-entry{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.act-entry:last-child{border-bottom:none}
.act-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px}
.act-dot-create{background:var(--green)}
.act-dot-delete{background:var(--red)}
.act-dot-status{background:var(--gold)}
.act-dot-import{background:var(--accent2)}
.act-dot-export{background:#9A8C98}
.act-dot-edit{background:var(--border)}
.act-body{flex:1;min-width:0}
.act-action{font-size:13px;color:var(--text);line-height:1.4}
.act-action strong{font-weight:600}
.act-meta{font-size:11px;color:var(--text-lt);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.act-module-badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.act-time{font-size:11px;color:var(--text-lt);flex-shrink:0;white-space:nowrap;margin-top:3px}
.act-filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.act-filter-btn{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);color:var(--text-lt);transition:.15s}
.act-filter-btn.active,.act-filter-btn:hover{border-color:var(--accent2);color:var(--accent2);background:rgba(61,64,91,.06)}
.act-empty{text-align:center;padding:60px 24px;color:var(--text-lt)}
.act-dash-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.act-dash-row:last-child{border-bottom:none}


/* GLOBAL SEARCH */
.search-trigger{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:5px 10px;cursor:pointer;color:rgba(255,255,255,.65);font-size:12px;font-family:var(--font);transition:.15s;white-space:nowrap}
.search-trigger:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.search-trigger kbd{font-size:10px;background:rgba(255,255,255,.15);border-radius:3px;padding:1px 5px;margin-left:4px;font-family:var(--font)}
.search-overlay{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;align-items:center;padding-top:80px}
.search-overlay-bg{position:absolute;inset:0;background:rgba(29,27,32,.6);backdrop-filter:blur(8px)}
.search-box{position:relative;z-index:1;width:100%;max-width:640px;background:var(--bg);border-radius:16px;box-shadow:0 32px 80px rgba(0,0,0,.25);overflow:hidden;border:1px solid var(--border)}
.search-input-wrap{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.search-input-wrap .search-icon{display:flex;align-items:center;color:var(--text-lt);flex-shrink:0;opacity:.7}
.search-input{flex:1;border:none;outline:none;font-size:16px;font-family:var(--font);background:transparent;color:var(--text)}
.search-input::placeholder{color:var(--text-lt)}
.search-kbd-esc{font-size:10px;color:var(--text-lt);background:var(--surface);border-radius:4px;padding:2px 7px;flex-shrink:0;border:1px solid var(--border)}
.search-results{max-height:460px;overflow-y:auto}
.search-group-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-lt);padding:8px 18px 4px;background:var(--surface)}
.search-result{display:flex;align-items:flex-start;gap:12px;padding:10px 18px;cursor:pointer;transition:.1s;border-bottom:1px solid var(--border)}
.search-result:hover,.search-result.focused{background:var(--surface)}
.search-result:last-child{border-bottom:none}
.search-result-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.search-result-body{flex:1;min-width:0}
.search-result-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result-title mark{background:transparent;color:var(--accent2);font-weight:700}
.search-result-meta{font-size:11px;color:var(--text-lt);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result-badge{flex-shrink:0;font-size:10px;font-weight:700;color:var(--text-lt);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1px 8px;align-self:center}
.search-empty{padding:40px 24px;text-align:center;color:var(--text-lt);font-size:13px}
.search-footer{padding:8px 18px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:16px;font-size:11px;color:var(--text-lt)}
.search-footer span{display:flex;align-items:center;gap:4px}
.search-footer kbd{background:var(--card);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-size:9px;font-family:var(--font)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-bg{position:absolute;inset:0;background:rgba(29,27,32,.45);backdrop-filter:blur(6px)}
.modal{position:relative;background:var(--bg);border-radius:16px;width:92%;max-height:88vh;overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.18);padding:28px 32px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h3{font-family:var(--font-display);font-size:20px;font-weight:500}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-lt)}

/* EMPTY STATE */
.empty{text-align:center;padding:48px 24px;color:var(--text-lt)}
.empty .icon{font-size:36px;margin-bottom:8px}
.empty-cta-block{text-align:center;padding:48px 24px;color:var(--text-lt)}
.empty-cta-block .empty-icon{font-size:40px;margin-bottom:10px}
.empty-cta-block .empty-title{font-size:16px;font-weight:600;color:var(--text-mid);margin-bottom:6px}
.empty-cta-block .empty-sub{font-size:13px;color:var(--text-lt);max-width:380px;margin:0 auto;line-height:1.5}

/* ACCORDION */
.accordion{background:var(--card);border-radius:14px;border:1px solid var(--border);margin-bottom:10px;overflow:hidden}
.accordion-head{display:flex;align-items:center;padding:14px 20px;cursor:pointer;gap:16px}
.accordion-head .arrow{font-size:16px;transition:transform .2s}
.accordion-head .arrow.open{transform:rotate(90deg)}
.accordion-body{padding:0 20px 16px;border-top:1px solid var(--border)}

/* LOOK-AHEAD GRID */
.la-day{text-align:center;padding:2px;cursor:pointer;border-bottom:1px solid var(--border);min-width:36px}
.la-day.weekend{background:rgba(224,122,95,.04)}
.la-check{width:20px;height:20px;border-radius:5px;background:var(--accent2);margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}


/* CO-DELTA INFO TIP */
.co-info-tip{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.co-info-tip .tip-icon{width:15px;height:15px;border-radius:50%;background:var(--gold);color:#fff;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;user-select:none}
.co-info-tip .tip-body{
  display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--bg);font-size:11px;line-height:1.45;padding:7px 10px;
  border-radius:7px;white-space:normal;width:260px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.18);
  pointer-events:none;
}
.co-info-tip .tip-body::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--text)}
/* Desktop: hover */
@media(hover:hover){

<script>
// ═══════════════════════════════════════════════════════
// PLANWISE — Construction PM Suite v2.0
// Storage: Shared JSON file (OneDrive) + localStorage fallback
// ═══════════════════════════════════════════════════════

// === STORAGE ARCHITECTURE ===
// Priority order:
//   1. planwise-data.json file in same folder (shared across team via OneDrive)
//   2. Embedded data in this HTML file (for portability / archiving)
//   3. localStorage (browser-local fallback)
//
// HOW IT WORKS:
//   - On load: reads from JSON file if available, else embedded, else localStorage
//   - On every edit: writes to localStorage immediately (fast, local)
//   - Auto-sync: every 30s, writes to JSON file via File System Access API (Chrome 86+)
//   - Manual save: "Save to Team File" button forces JSON write + prompts if no handle

const STORAGE_KEY = "planwise_data_v2";
const JSON_FILENAME = "planwise-data.json";
let hasUnsavedChanges = false;
let lastSavedTime = null;
let _jsonFileHandle = null;       // File System Access API handle (Chrome)
let _syncInterval = null;
let _pendingJsonWrite = false;
let _currentUser = localStorage.getItem("planwise_user") || "";

// --- Embedded data (baked into HTML for portability) ---
function loadEmbeddedData() {
  try {
    const el = document.getElementById("planwise-embedded-data");
    if (el) { const d = JSON.parse(el.textContent); if (d && d.project) return d; }
  } catch(e) {}
  return null;
}

// --- localStorage ---
function loadLocalData() {
  try { const d = localStorage.getItem(STORAGE_KEY); return d ? JSON.parse(d) : null; } catch(e) { return null; }
}
function saveLocalData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}

// --- JSON File (shared via OneDrive) ---
async function loadJsonFile() {
  // If we have a stored handle, try to use it
  const storedHandle = await getStoredFileHandle();
  if (storedHandle) {
    try {
      const perm = await storedHandle.queryPermission({ mode: "readwrite" });
      if (perm === "granted" || await storedHandle.requestPermission({ mode: "readwrite" }) === "granted") {
        _jsonFileHandle = storedHandle;
        const file = await storedHandle.getFile();
        const text = await file.text();
        const data = JSON.parse(text);
        if (data && data.project) return data;
      }
    } catch(e) { console.warn("Stored handle failed:", e); }
  }
  return null;
}

async function saveJsonFile(data) {
  if (!_jsonFileHandle) return false;
  try {
    const perm = await _jsonFileHandle.queryPermission({ mode: "readwrite" });
    if (perm !== "granted") {
      const req = await _jsonFileHandle.requestPermission({ mode: "readwrite" });
      if (req !== "granted") return false;
    }
    const writable = await _jsonFileHandle.createWritable();
    await writable.write(JSON.stringify(data, null, 2));
    await writable.close();
    // Store handle for next session
    await storeFileHandle(_jsonFileHandle);
    return true;
  } catch(e) { console.warn("JSON file write failed:", e); return false; }
}

// Store/retrieve file handle using IndexedDB (handles survive page reload)
function getStoredFileHandle() {
  return new Promise(resolve => {
    try {
      const req = indexedDB.open("planwise_fsa", 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore("handles");
      req.onsuccess = e => {
        const tx = e.target.result.transaction("handles", "readonly");
        const get = tx.objectStore("handles").get("jsonFile");
        get.onsuccess = () => resolve(get.result || null);
        get.onerror = () => resolve(null);
      };
      req.onerror = () => resolve(null);
    } catch(e) { resolve(null); }
  });
}

function storeFileHandle(handle) {
  return new Promise(resolve => {
    try {
      const req = indexedDB.open("planwise_fsa", 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore("handles");
      req.onsuccess = e => {
        const tx = e.target.result.transaction("handles", "readwrite");
        tx.objectStore("handles").put(handle, "jsonFile");
        tx.oncomplete = resolve;
        tx.onerror = resolve;
      };
      req.onerror = resolve;
    } catch(e) { resolve(); }
  });
}

function clearStoredFileHandle() {
  return new Promise(resolve => {
    try {
      const req = indexedDB.open("planwise_fsa", 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore("handles");
      req.onsuccess = e => {
        const tx = e.target.result.transaction("handles", "readwrite");
        tx.objectStore("handles").delete("jsonFile");
        tx.oncomplete = resolve;
        tx.onerror = resolve;
      };
      req.onerror = resolve;
    } catch(e) { resolve(); }
  });
}

// --- Main load/save ---
async function loadData() {
  // 1. Try JSON file (team shared)
  const jsonData = await loadJsonFile();
  if (jsonData) { showStorageMode("team"); return jsonData; }
  // 2. Load both localStorage and embedded data
  const local = loadLocalData();
  const embedded = loadEmbeddedData();
  // 3. Prefer embedded data if it has a higher version (freshly updated HTML)
  //    or if localStorage has no real project data
  if (embedded) {
    const embV = embedded._version || 0;
    const localV = (local && local._version) || 0;
    const localHasProject = local && local.project && local.project.projectName;
    if (!localHasProject || embV > localV) {
      showStorageMode("embedded");
      return embedded;
    }
  }
  if (local) { showStorageMode("local"); return local; }
  return null;
}

function saveData(data) {
  // Bump version for team sync conflict detection
  data._version = (data._version || 0) + 1;
  // Always write to localStorage immediately
  saveLocalData(data);
  // Also update embedded element for HTML export
  const el = document.getElementById("planwise-embedded-data");
  if (el) { try { el.textContent = JSON.stringify(data); } catch(e) {} }
  lastSavedTime = new Date();
  // Mark unsaved changes — cleared only when user explicitly exports to file
  hasUnsavedChanges = true;
  _pendingJsonWrite = true;
  updateSaveButton();
  // Debounced JSON file write (300ms)
  clearTimeout(saveData._debounce);
  saveData._debounce = setTimeout(async () => {
    if (_jsonFileHandle && _pendingJsonWrite) {
      const ok = await saveJsonFile(data);
      if (ok) { _pendingJsonWrite = false; hasUnsavedChanges = false; updateSaveButton(); updateStorageStatus("✓ Synced to team file"); }
    }
  }, 300);
}

// --- Connect to team file ---
async function connectTeamFile() {
  if (!window.showOpenFilePicker) {
    alert("Your browser doesn't support the File System Access API.\n\nUse Chrome or Edge 86+ to enable team file sharing.\n\nYour data still saves locally.");
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: "Planwise Data", accept: { "application/json": [".json"] } }],
      multiple: false
    });
    _jsonFileHandle = handle;
    await storeFileHandle(handle);
    // Load from file
    const file = await handle.getFile();
    const text = await file.text();
    try {
      const data = JSON.parse(text);
      if (data && data.project) {
        state = data;
        mergeDefaults(state, DEFAULT_DATA);
        saveLocalData(state);
        showSaveIndicator("✓ Connected to team file — data loaded");
        showStorageMode("team");
        render();
        return;
      }
    } catch(e) {}
    // File exists but is empty/new — write current data to it
    await saveJsonFile(state);
    showSaveIndicator("✓ Connected — current data saved to team file");
    showStorageMode("team");
  } catch(e) {
    if (e.name !== "AbortError") console.error(e);
  }
}

async function createTeamFile() {
  if (!window.showSaveFilePicker) {
    alert("Your browser doesn't support the File System Access API.\n\nUse Chrome or Edge 86+.");
    return;
  }
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: "planwise-data.json",
      types: [{ description: "Planwise Data", accept: { "application/json": [".json"] } }]
    });
    _jsonFileHandle = handle;
    await storeFileHandle(handle);
    await saveJsonFile(state);
    showSaveIndicator("✓ Team file created — place it in your OneDrive project folder");
    showStorageMode("team");
    render();
  } catch(e) {
    if (e.name !== "AbortError") console.error(e);
  }
}

// --- Storage mode UI ---
let _storageMode = "local";
function showStorageMode(mode) { _storageMode = mode; }

function updateStorageStatus(msg) {
  const el = document.getElementById("storageStatus");
  if (el) { el.textContent = msg; setTimeout(() => { if (el) el.textContent = storageStatusLabel(); }, 3000); }
}

function storageStatusLabel() {
  if (_storageMode === "team") return "● Team file connected";
  if (_storageMode === "embedded") return "● Loaded from file";
  return "● Local only";
}

// --- Auto-reload from JSON file (checks for newer version) ---
let _lastFileModified = 0;
async function checkForTeamUpdates() {
  if (!_jsonFileHandle) return;
  try {
    const file = await _jsonFileHandle.getFile();
    if (file.lastModified > _lastFileModified + 2000) {
      _lastFileModified = file.lastModified;
      if (_pendingJsonWrite) return; // We just wrote — skip
      const text = await file.text();
      const incoming = JSON.parse(text);
      if (incoming && incoming.project) {
        // Merge: incoming wins for most fields, but protect items with local-only edits
        // Simple strategy: if incoming _version > local, accept it
        const inV = incoming._version || 0;
        const curV = state._version || 0;
        if (inV > curV) {
          state = incoming;
          mergeDefaults(state, DEFAULT_DATA);
          saveLocalData(state);
          render();
          updateStorageStatus("↻ Updated from team file");
        }
      }
    }
  } catch(e) {}
}

  );
  const projName = (state.project.projectName || "Planwise").replace(/[^a-zA-Z0-9_\- ]/g, "").trim();
  const dateStr = new Date().toISOString().split("T")[0];
  const filename = `${projName}_${dateStr}.html`;

// ── Undo Reset: restores the pre-reset snapshot from sessionStorage ──
const UNDO_SNAPSHOT_KEY = "planwise_undo_snapshot";
let _undoToastTimer = null;

function undoReset() {
  try {
    const snap = sessionStorage.getItem(UNDO_SNAPSHOT_KEY);
    if (!snap) return;
    const restored = JSON.parse(snap);
    // Restore state
    state = restored;
    // Persist restored state so page reload keeps it
    saveLocalData(state);
    const el = document.getElementById("planwise-embedded-data");
    if (el) el.textContent = JSON.stringify(state);
    sessionStorage.removeItem(UNDO_SNAPSHOT_KEY);
    hideUndoToast();
    hasUnsavedChanges = false;
    settingsOpen = false;
    updateSaveButton();
    render();
    showSaveIndicator("✓ Reset undone — project restored");
  } catch(e) { console.warn("Undo failed", e); }
}

function showUndoToast() {
  const el = document.getElementById("undoResetToast");
  if (!el) return;
  el.classList.add("show");
  if (_undoToastTimer) clearTimeout(_undoToastTimer);
  _undoToastTimer = setTimeout(() => {
    hideUndoToast();
    sessionStorage.removeItem(UNDO_SNAPSHOT_KEY);
  }, 30000);
}

function hideUndoToast() {
  const el = document.getElementById("undoResetToast");
  if (el) el.classList.remove("show");
  if (_undoToastTimer) { clearTimeout(_undoToastTimer); _undoToastTimer = null; }
}

// ── Disconnect Team File ──
function disconnectTeamFile() {
  _jsonFileHandle = null;
  _pendingJsonWrite = false;
  clearStoredFileHandle();
  _storageMode = "local";
  updateSaveButton();
  render();
  updateStorageStatus("✓ Team file disconnected");
}

// ── Full Reset: clears ALL data stores so nothing persists after page refresh ──
function performFullReset() {
  // 1. Remove from localStorage
  localStorage.removeItem(STORAGE_KEY);
  // 2. Clear the embedded-data element so a page refresh won't reload old data
  const embEl = document.getElementById("planwise-embedded-data");
  if (embEl) embEl.textContent = "{}";
  // 2b. Save a snapshot to sessionStorage BEFORE wiping, so Undo can restore it
  try {
    // Only snapshot if there's actually meaningful data worth saving
    if (state && state.project && state.project.projectName && state.project.projectName !== "New Project") {
      sessionStorage.setItem(UNDO_SNAPSHOT_KEY, JSON.stringify(state));
    }
  } catch(e) {}
  // 3. Reset in-memory state to clean defaults
  state = JSON.parse(JSON.stringify(DEFAULT_DATA));
  // 4. Add a system audit entry so the activity log shows the reset event
  state.activityLog = [{
    id: uid(), ts: new Date().toISOString(),
    module: "system", type: "reset",
    action: "Project data reset",
    detail: "All project data was cleared via Settings → Reset All Data."
  }];
  // 5. Write blank state to localStorage so it takes priority over embedded on next load
  saveLocalData(state);
  // 6. Disconnect team file handle — also remove from IndexedDB so next page load
  //    doesn't reload the old team JSON file and re-populate stale data
  _jsonFileHandle = null;
  _pendingJsonWrite = false;
  clearStoredFileHandle(); // async — fire-and-forget; removes handle from IndexedDB
  // 7. Reset storage-mode indicator back to local
  _storageMode = "local";
  // 8. Clear UI flags and re-render
  hasUnsavedChanges = false;
  settingsOpen = false;
  updateSaveButton();
  render();
  // 9. Show undo toast (only if we snapshotted something worth restoring)
  if (sessionStorage.getItem(UNDO_SNAPSHOT_KEY)) showUndoToast();
}

}

// Computed helpers — never stored
const ctProjected = row => (+(row.jtd)||0) + (+(row.openCommitted)||0);
const ctVariance  = row => (+(row.estimated)||0) - ctProjected(row);
const ctPct = row => {
  const proj = ctProjected(row), jtd = +(row.jtd)||0, est = +(row.estimated)||0;
  if (proj > 0) return Math.round((jtd / proj) * 1000) / 10;
  if (est  > 0) return Math.round((jtd / est)  * 1000) / 10;
  return 0;
};

const uid = () => Math.random().toString(36).slice(2,9);
const fmt$ = n => n==null||n===""?"":"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
// fmt$0: like fmt$ but shows "-" for zero (use for display-only cells where 0 means "not set")
const fmt$0 = n => (!n && n !== false) ? "—" : "$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = d => {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  // Guard: reject invalid dates and implausible years (corrupt timestamp strings like "+045575-01-01")
  if (isNaN(dt.getTime()) || dt.getFullYear() < 1970 || dt.getFullYear() > 2100) return "";
  return dt.toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"});
};
const esc = s => {
  const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML;
};

// === STATE ===
function mergeDefaults(obj, defaults) {
  for (const k in defaults) {
    if (!(k in obj)) {
      obj[k] = JSON.parse(JSON.stringify(defaults[k]));
    } else if (k === "costs") {
      // costs is a flat array keyed by CT — ensure all standard CTs present
      if (!Array.isArray(obj[k])) obj[k] = blankCosts();
      const blank = blankCosts();
      for (const bRow of blank) {
        if (!obj[k].find(r=>r.id===bRow.id)) obj[k].push(bRow);
      }
      // Migrate old object-keyed costs if present
    } else if (typeof defaults[k]==="object"&&!Array.isArray(defaults[k])&&defaults[k]!==null&&typeof obj[k]==="object"&&!Array.isArray(obj[k])) {
      mergeDefaults(obj[k],defaults[k]);
    }
  }
}

  if (co.costLineId && !splits.some(s => s.costLineId === co.costLineId)) {

// ── CO Split CRUD operations ──
window.addCOSplit = function(coId) {
  const co = (state.changeOrders||[]).find(c => c.id === coId);
  if (!co) return;
  if (!Array.isArray(co.costSplits)) co.costSplits = [];
  // Migrate legacy into array first
  if (co.costLineId && !co.costSplits.some(s => s.costLineId === co.costLineId)) {
    co.costSplits.unshift({ id: uid(), costLineId: co.costLineId, amount: co.amountApproved || co.amountSubmitted || 0, note: "" });
    co.costLineId = "";
  }
  co.costSplits.push({ id: uid(), costLineId: "", amount: 0, linkedPOId: "", note: "" });
  saveData(state); render();
};

window.updCOSplit = function(coId, splitId, field, value) {
  const co = (state.changeOrders||[]).find(c => c.id === coId);
  if (!co || !Array.isArray(co.costSplits)) return;
  const sp = co.costSplits.find(s => s.id === splitId);
  // Handle legacy shim id
  if (!sp) {
    // Could be legacy — migrate first
    if (!co.costSplits.some(s => s.costLineId === co.costLineId)) {
      co.costSplits.unshift({ id: co.costLineId + "_legacy", costLineId: co.costLineId, amount: co.amountApproved || co.amountSubmitted || 0, note: "" });
      co.costLineId = "";
    }
    const sp2 = co.costSplits.find(s => s.id === splitId);
    if (sp2) { sp2[field] = value; sp2.id = uid(); }
  } else {
    sp[field] = value;
  }
  saveData(state); render();
};

window.rmCOSplit = function(coId, splitId) {
  const co = (state.changeOrders||[]).find(c => c.id === coId);
  if (!co) return;
  if (!Array.isArray(co.costSplits)) co.costSplits = [];
  co.costSplits = co.costSplits.filter(s => s.id !== splitId);
  // Also clear legacy if it was the legacy one
  saveData(state); render();
};

window.addCOLinkedPO = function(coId) {
  const co = (state.changeOrders||[]).find(c => c.id === coId);
  if (!co) return;
  if (!Array.isArray(co.linkedPOs)) co.linkedPOs = [];
  if (co.linkedPOId && !co.linkedPOs.some(l => l.poId === co.linkedPOId)) {
    co.linkedPOs.unshift({ id: uid(), poId: co.linkedPOId, amount: 0, note: "" });

  co.linkedPOs.push({ id: uid(), poId: "", amount: 0, note: "" });

};

window.updCOLinkedPO = function(coId, linkId, field, value) {
  const co = (state.changeOrders||[]).find(c => c.id === coId);
  if (!co || !Array.isArray(co.linkedPOs)) return;
  const lk = co.linkedPOs.find(l => l.id === linkId);
  if (!lk) {
    if (!co.linkedPOs.some(l => l.poId === co.linkedPOId) && co.linkedPOId) {
      co.linkedPOs.unshift({ id: co.linkedPOId + "_legacy", poId: co.linkedPOId, amount: 0, note: "" });

    }

window.convertSubToPO = (subId) => {
  const sub = (state.subcontractors||[]).find(s=>s.id===subId);
  if (!sub) return;
  if (sub.linkedPOId) {
    const existing = (state.purchaseOrders||[]).find(p=>p.id===sub.linkedPOId);
    if (existing) { activeTab="invoices"; expandedPO=existing.id; render(); return; }
  }
  // Create PO from quote
  const quoteAmt = +sub.quoteAmount||parseFloat(String(sub.quote||0).replace(/[^0-9.]/g,""))||0;
  const newPO = {
    id: uid(),
    poNumber: "",
    vendor: sub.company||"",
    description: sub.trade||"",
    originalAmount: quoteAmt,
    adjustedAmount: 0,
    invoices: [],
    costLineId: sub.costLineId||"",
    fromSubId: sub.id
  };
  if (!state.purchaseOrders) state.purchaseOrders = [];
  state.purchaseOrders.push(newPO);
  sub.linkedPOId = newPO.id;
  saveData(state);
  expandedPO = newPO.id;
  activeTab = "invoices";
  render();
  showSaveIndicator(`✓ PO created from ${sub.company} quote`);
};

// ── Referential integrity: clean up broken links on delete ──
const _origRmArr = window.rmArr || removeFromArray;
window.rmArr = (path, id) => {
  // Before deleting, null out any links pointing to this id
  const cleanLinks = (arr, field) => { if(arr) arr.forEach(item=>{ if(item[field]===id) item[field]=""; }); };
  if (path==="purchaseOrders") {
    cleanLinks(state.changeOrders, "linkedPOId");
    cleanLinks(state.subcontractors, "linkedPOId");
    // Also clean from costSplits/linkedPOs arrays
    (state.changeOrders||[]).forEach(co => {
      if (Array.isArray(co.linkedPOs)) co.linkedPOs = co.linkedPOs.filter(l => l.poId !== id);
    });
  }
  if (path==="submittals") cleanLinks(state.rfis, "linkedSubmittalId");
  if (path==="drawings")   cleanLinks(state.rfis, "linkedDrawingId");
  // Clean cost line links — iterate all cost arrays
  const allCostIds = (state.costs||[]).map(l=>l.id);
  if (!allCostIds.includes(id)) {
    // It was a cost line being deleted — clean up
    cleanLinks(state.changeOrders,    "costLineId");
    cleanLinks(state.purchaseOrders,  "costLineId");
    cleanLinks(state.subcontractors,  "costLineId");
    // Also clean from costSplits arrays
    (state.changeOrders||[]).forEach(co => {
      if (Array.isArray(co.costSplits)) co.costSplits = co.costSplits.filter(s => s.costLineId !== id);
    });
  }
  removeFromArray(path, id);
};

// ── Inbound links: which items link TO a given cost line? ──
function getLinksToConstLine(costLineId) {
  const cos  = (state.changeOrders||[]).filter(c => {
    // Check legacy single field
    if (c.costLineId === costLineId) return true;
    // Check costSplits array
    if (Array.isArray(c.costSplits) && c.costSplits.some(s => s.costLineId === costLineId)) return true;
    return false;
  });
  const pos  = (state.purchaseOrders||[]).filter(p=>p.costLineId===costLineId);
  const subs = (state.subcontractors||[]).filter(s=>s.costLineId===costLineId);
  return { cos, pos, subs };
}

// ── Mobile Detection ──────────────────────────────────────────────────────────
// Detects iOS / Android; on mobile devices applies body.mobile-view for a
// responsive bottom-nav layout. Respects a "forceMobile" / "forceDesktop"
// override stored in localStorage so the "View desktop site" toggle persists.
const MOBILE_OVERRIDE_KEY = "planwise_mobile_override";
function isMobileDevice() {
  const ua = navigator.userAgent || "";
  const isPhone = /android|iphone|ipad|ipod|blackberry|windows phone/i.test(ua);
  const isNarrow = window.innerWidth < 768;
  return isPhone || isNarrow;
}
function applyMobileLayout() {
  const override = localStorage.getItem(MOBILE_OVERRIDE_KEY);
  if (override === "desktop") { document.body.classList.remove("mobile-view"); return; }

function setState(path, value) {
  const keys = path.split(".");
  let obj = state;
  for (let i=0; i<keys.length-1; i++) obj = obj[keys[i]];
  obj[keys[keys.length-1]] = value;
  saveData(state);
  render();
}

function updateInArray(arrayPath, id, field, value) {
  const keys = arrayPath.split(".");
  let arr = state;
  for (const k of keys) arr = arr[k];
  const item = arr.find(x => x.id === id);
  if (item) { item[field] = value; saveData(state); render(); }
}

function addToArray(arrayPath, item) {
  const keys = arrayPath.split(".");
  let arr = state;
  for (const k of keys) arr = arr[k];
  arr.push({ ...item, id: uid() });
  saveData(state);
  render();
}

function removeFromArray(arrayPath, id) {
  const keys = arrayPath.split(".");
  let parent = state;
  for (let i=0; i<keys.length-1; i++) parent = parent[keys[i]];
  parent[keys[keys.length-1]] = parent[keys[keys.length-1]].filter(x => x.id !== id);
  saveData(state);
  render();
}

// === HTML BUILDERS ===
function h(tag, attrs={}, ...children) {
  const parts = [`<${tag}`];
  for (const [k,v] of Object.entries(attrs)) {
    if (v===false||v===null||v===undefined) continue;
    if (k==="style" && typeof v==="object") parts.push(` style="${Object.entries(v).map(([p,val])=>`${p.replace(/[A-Z]/g,m=>"-"+m.toLowerCase())}:${val}`).join(";")}"`);
    else parts.push(` ${k}="${esc(String(v))}"`);
  }
  const voidTags = ["input","br","hr","img","meta","link"];
  if (voidTags.includes(tag)) { parts.push(">"); return parts.join(""); }
  parts.push(">");
  for (const c of children) { if (c!=null) parts.push(typeof c==="string" ? c : String(c)); }
  parts.push(`</${tag}>`);
  return parts.join("");
}

// CO DELTA ENGINE
// Computes approved CO impact on a cost line without mutating state.
//
// For each approved CO split pointing at costLineId:
//   - No linked PO  → adds to projDelta (open scope risk)
//   - Linked PO already within Viewpoint committed → no delta (already counted)
//   - Linked PO NOT yet in Viewpoint committed → adds to commitDelta + warning
//
// "Already in Viewpoint" test:
//   Sort POs linked to this cost line by orderDate ascending (oldest first).
//   Greedily accumulate their adjustedAmount until we've consumed the imported
//   committed value. POs within that budget are "known to Viewpoint"; remainder
//   are "unreconciled". The CO split amount is added to commitDelta only when
//   its linked PO falls in the unreconciled portion.
// ═══════════════════════════════════════════════════════════════════
function computeCODeltas(costLineId, baseCommitted) {
  const cos = state.changeOrders || [];
  const pos = state.purchaseOrders || [];

  // ── Determine which POs are already within Viewpoint's committed budget ──
  // POs directly linked to this cost line, sorted oldest-first
  const linePOs = pos
    .filter(p => p.costLineId === costLineId)
    .sort((a,b) => {
      const da = a.orderDate||a.dateCreated||"0";
      const db = b.orderDate||b.dateCreated||"0";
      return da < db ? -1 : da > db ? 1 : 0;
    });

  let vpBudgetRemaining = +baseCommitted || 0;
  const vpKnownPOIds = new Set();
  for (const po of linePOs) {
    const amt = +po.adjustedAmount || +po.originalAmount || 0;
    if (amt <= vpBudgetRemaining + 0.01) {
      vpKnownPOIds.add(po.id);
      vpBudgetRemaining -= amt;
    }
    // Once we exceed committed, remaining POs are unreconciled
  }

  let projDelta   = 0;   // adds to Displayed Projected
  let commitDelta = 0;   // adds to Displayed Committed
  const warnings  = [];  // {poId, poNumber, vendor} for ⓘ tooltip

  for (const co of cos) {
    const approved = +co.amountApproved || 0;
    if (!approved) continue; // only approved COs

    const splits = coGetCostSplits(co);
    for (const sp of splits) {
      if (sp.costLineId !== costLineId) continue;
      const amt = +sp.amount || 0;
      if (!amt) continue;

      if (sp.linkedPOId) {
        // Split is backed by a PO
        if (vpKnownPOIds.has(sp.linkedPOId)) {
          // PO already in Viewpoint committed — no delta needed
        } else {
          // PO not yet reconciled with Viewpoint
          commitDelta += amt;
          const po = pos.find(p => p.id === sp.linkedPOId);
          if (po && !warnings.some(w => w.poId === po.id)) {
            warnings.push({ poId: po.id, poNumber: po.poNumber||"—", vendor: po.vendor||"" });
          }
        }
      } else {
        // No PO linked — pure scope risk, adjusts projected
        projDelta += amt;
      }
    }
  }

  return { projDelta, commitDelta, warnings };
}

// --- COST BREAKDOWN ---
function renderCosts() {
  const rows = state.costs || blankCosts();

  // ── Aggregate totals ──
  const gEst   = rows.reduce((s,r)=>s+(+(r.estimated)||0),0);
  const gMTD   = rows.reduce((s,r)=>s+(+(r.mtd)||0),0);
  const gJTD   = rows.reduce((s,r)=>s+(+(r.jtd)||0),0);
  const gComm  = rows.reduce((s,r)=>s+(+(r.openCommitted)||0),0);
  const gUAP   = rows.reduce((s,r)=>s+(+(r.unapprovedAP)||0),0);
  const gProj  = rows.reduce((s,r)=>s+ctProjected(r),0);
  const gVar   = gEst - gProj;
  const gPct   = gProj > 0 ? Math.round((gJTD/gProj)*1000)/10 : (gEst>0?Math.round((gJTD/gEst)*1000)/10:0);

  let html = `<div class="page-title" data-module="costs">Cost Breakdown</div>`;

    ${statCard("Job To Date",fmt$(gJTD),"var(--accent)")}
    ${statCard("Projected",fmt$(gProj),"var(--text-mid)")}
    ${statCard("Variance",fmt$(gVar),gVar>=0?"var(--green)":"var(--red)")}
    ${statCard("% Complete",gPct.toFixed(1)+"%",gPct>=100?"var(--green)":gPct>=75?"var(--accent)":"var(--gold)")}
    ${statCard("Open / Committed",fmt$(gComm),"var(--gold)")}
    ${statCard("Unapproved AP",fmt$(gUAP),gUAP>0?"var(--red)":"var(--text-faint)")}
  </div>`;

  // ── % complete pill ──
  const pctPill = pct => {
    const col = pct >= 100 ? "var(--green)" : pct >= 75 ? "var(--accent)" : pct >= 40 ? "var(--gold)" : "var(--red)";
    return `<div style="min-width:64px">
      <span style="font-size:12px;font-weight:700;color:${col}">${pct.toFixed(1)}%</span>
      <div style="height:3px;border-radius:2px;background:var(--border);margin-top:3px;overflow:hidden">
        <div style="height:100%;width:${Math.min(100,Math.max(0,pct))}%;background:${col};border-radius:2px"></div>
      </div>
    </div>`;
  };

  // ── Cost type table ──
  html += `<div class="table-wrap" style="margin-bottom:24px;overflow-x:auto">
  <table style="min-width:960px">
    <thead><tr>
      <th style="min-width:60px">CT</th>
      <th style="min-width:180px">Cost Type</th>
      <th class="right" title="Original bid amount — locked from import">Estimated</th>
      <th class="right" title="Costs posted this calendar month">Month To Date</th>
      <th class="right" title="All costs posted to date">Job To Date</th>
      <th class="right" title="Job To Date + Open Committed">Projected</th>
      <th class="right" title="Estimated minus Projected">Variance</th>
      <th style="min-width:80px" title="Job To Date ÷ Projected">% Complete</th>
      <th class="right" title="Open purchase orders / uncommitted subcontract spend">Open / Committed</th>
      <th class="right" title="Invoices received but not yet approved in AP">Unapproved AP</th>
    </tr></thead>
    <tbody>`;

  for (const r of rows) {
    const est  = +(r.estimated)||0;
    const mtd  = +(r.mtd)||0;
    const jtd  = +(r.jtd)||0;
    const comm = +(r.openCommitted)||0;
    const uap  = +(r.unapprovedAP)||0;
    const proj = ctProjected(r);

    const pct  = ctPct(r);
    const hasData = est||mtd||jtd||comm||uap;
    const varCol = vari >= 0 ? "var(--green)" : "var(--red)";

    html += `<tr>

               <button onclick="unlockCTEstimated('${r.id}')" title="Estimated locked from import — click to unlock"
                 style="border:none;background:none;cursor:pointer;padding:0;color:var(--text-lt);font-size:12px;line-height:1;flex-shrink:0">🔒</button>
             </span>`

    <td class="mono right" style="color:${gUAP>0?"var(--red)":"inherit"}">${fmt$(gUAP)}</td>

  html += `</tbody></table></div>`;
  html += `<p style="font-size:11px;color:var(--text-lt);margin-top:-12px">

  return html;
}

// ════════════════════════════════════════════════════════════════════════════
//  AXIS ENERGY PDF PO IMPORTER  ·  100% local, zero API cost
//  Uses PDF.js 3.11 from cdnjs for text extraction, then regex parser.
//  Identifies Axis POs by inspecting content (not filename).
// ════════════════════════════════════════════════════════════════════════════

// ── PDF.js lazy loader ────────────────────────────────────────────────────
let _pdfJsReady = false, _pdfJsPromise = null;
function _loadPdfJs() {
  if (_pdfJsReady) return Promise.resolve();
  if (_pdfJsPromise) return _pdfJsPromise;
  _pdfJsPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => {
      if (!window.pdfjsLib) { reject(new Error("pdfjsLib not found")); return; }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      _pdfJsReady = true;
      resolve();
    };
    s.onerror = () => reject(new Error("Failed to load PDF.js from CDN. Check internet connection."));
    document.head.appendChild(s);
  });
  return _pdfJsPromise;
}

// ── JSZip lazy loader (for Claude-format ZIP-packaged PDFs) ─────────────
let _jsZipReady = false, _jsZipPromise = null;
function _loadJSZip() {
  if (_jsZipReady) return Promise.resolve();
  if (_jsZipPromise) return _jsZipPromise;
  _jsZipPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    s.onload = () => { _jsZipReady = true; resolve(); };
    s.onerror = () => {
      // Fallback CDN
      const s2 = document.createElement("script");
      s2.src = "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";
      s2.onload = () => { _jsZipReady = true; resolve(); };
      s2.onerror = () => reject(new Error("Failed to load JSZip from CDN."));
      document.head.appendChild(s2);
    };
    document.head.appendChild(s);
  });
  return _jsZipPromise;
}

// ── Detect ZIP magic bytes (PK signature 0x50 0x4B 0x03 0x04) ───────────
// Use DataView for reliable single-byte access — Uint8Array(buf,offset,len) can behave
// unexpectedly on some Chrome builds when offset/length args are passed to ArrayBuffer.
function _isZipBuffer(buf) {
  try {
    const dv = new DataView(buf);
    return dv.getUint8(0) === 0x50 && dv.getUint8(1) === 0x4B &&
           dv.getUint8(2) === 0x03 && dv.getUint8(3) === 0x04;
  } catch(e) { return false; }
}

// ── Extract all text from a Claude-format ZIP-packaged PDF ──────────────
// Format: manifest.json lists pages in order; each page has a text.path
// pointing to N.txt files inside the ZIP.
async function _extractZipPdfText(bufOrUint8) {
  await _loadJSZip();
  // Accept either ArrayBuffer or Uint8Array
  const zip = await JSZip.loadAsync(bufOrUint8);

  // Try manifest-based page order first
  const manifestFile = zip.file("manifest.json");
  if (manifestFile) {
    const manifest = JSON.parse(await manifestFile.async("string"));
    const pages = manifest.pages || [];
    if (pages.length) {
      const texts = [];
      for (const page of pages) {
        const txtPath = page.text && page.text.path;
        if (!txtPath) continue;
        const txtFile = zip.file(txtPath);
        if (!txtFile) continue;
        const t = await txtFile.async("string");
        texts.push(t.replace(/\r\n/g, "\n").replace(/\r/g, "\n"));
      }
      if (texts.length) return texts.join("\n");
    }
  }

  // Fallback: collect 1.txt, 2.txt … N.txt in numeric order
  const txtEntries = Object.keys(zip.files)
    .filter(n => /^\d+\.txt$/.test(n))
    .sort((a, b) => parseInt(a) - parseInt(b));
  if (!txtEntries.length) throw new Error("No text pages found in ZIP package");
  const texts = [];
  for (const name of txtEntries) {
    const t = await zip.file(name).async("string");
    texts.push(t.replace(/\r\n/g, "\n").replace(/\r/g, "\n"));
  }
  return texts.join("\n");
}

    </div>`;
  }

  // ── batch_results phase ────────────────────────────────────────────────
  if (s.phase === "batch_results") {

    const okCount   = results.filter(r => r.status === "ok").length;

// ── File handler (drag-drop or browse) ──────────────────────────────────
window.poPdfDrop = async function(files) {
  if (!files || !files[0]) return;

  // ── Single file → preview flow (allows editing before importing) ──
  if (files.length === 1) {
    const file = files[0];
    const ext  = file.name.toLowerCase();
    if (!ext.endsWith(".pdf") && file.type !== "application/pdf") {
      _poPdfSetPhase("error", { errorMsg: "Please select a PDF file (.pdf)." }); return;
    }
    _poPdfSetPhase("loading", { fileName: file.name });
    try {
      if (!_pdfJsReady) await _loadPdfJs();
      _poPdfSetPhase("reading", { fileName: file.name });
      const buf    = await file.arrayBuffer();
      const text   = await _pdfExtractAllText(buf);
      const parsed = _parseAxisPO(text);
      if (!parsed) { _poPdfSetPhase("not_axis", { fileName: file.name }); return; }
      _poPdfSetPhase("preview", { fileName: file.name, parsed });
    } catch(err) {
      _poPdfSetPhase("error", { errorMsg: err.message || String(err) });
    }
    return;
  }

  // ── Multiple files → batch auto-import (no per-file preview) ──
  const pdfs = Array.from(files).filter(f =>
    f.name.toLowerCase().endsWith(".pdf") || f.type === "application/pdf"
  );
  if (!pdfs.length) { _poPdfSetPhase("error", { errorMsg: "No PDF files found in selection." }); return; }

  _poPdfSetPhase("loading", { fileName: `Loading PDF reader…` });
  try { if (!_pdfJsReady) await _loadPdfJs(); } catch(e) {
    _poPdfSetPhase("error", { errorMsg: "Failed to load PDF reader: " + e.message }); return;
  }

  const batchResults = [];
  for (let i = 0; i < pdfs.length; i++) {
    const file = pdfs[i];
    _poPdfSetPhase("reading", { fileName: `(${i + 1}/${pdfs.length}) ${file.name}` });
    try {
      const buf    = await file.arrayBuffer();
      const text   = await _pdfExtractAllText(buf);
      const parsed = _parseAxisPO(text);
      if (!parsed) {
        batchResults.push({ fileName: file.name, status: "skip", detail: "Not an Axis Energy PO — skipped" });
        continue;
      }
      // Auto-import: update existing or push new
      const existing = (state.purchaseOrders || []).find(p => p.poNumber === parsed.poNumber && parsed.poNumber);
      if (existing) {
        Object.assign(existing, {
          vendor:         parsed.vendor        || existing.vendor,
          description:    parsed.description   || existing.description,
          originalAmount: parsed.amount        || existing.originalAmount,
          adjustedAmount: parsed.amount        || existing.adjustedAmount,
          orderDate:      parsed.orderDate     || existing.orderDate,
          jobNumber:      parsed.jobNumber     || existing.jobNumber,
          shipTo:         parsed.shipTo        || existing.shipTo,
          sourceFile: file.name, importedVia: "axis-pdf",
        });
        batchResults.push({ fileName: file.name, status: "updated",
          detail: `PO ${parsed.poNumber} — ${parsed.vendor} — ${fmt$(parsed.amount)}` });
      } else {
        const newPO = {
          id: uid(), poNumber: parsed.poNumber, vendor: parsed.vendor,
          description: parsed.description, originalAmount: parsed.amount,
          adjustedAmount: parsed.amount, orderDate: parsed.orderDate,
          jobNumber: parsed.jobNumber, shipTo: parsed.shipTo,
          orderedBy: "", invoices: [], changeOrders: [],
          sourceFile: file.name, importedVia: "axis-pdf",
        };
        if (!state.purchaseOrders) state.purchaseOrders = [];
        state.purchaseOrders.push(newPO);
        logActivity("import", "import", "PDF Batch Import",
          `PO ${parsed.poNumber} — ${parsed.vendor} — ${fmt$(parsed.amount)}`);
        batchResults.push({ fileName: file.name, status: "ok",
          detail: `PO ${parsed.poNumber} — ${parsed.vendor} — ${fmt$(parsed.amount)}` });
      }
    } catch(err) {
      batchResults.push({ fileName: file.name, status: "error", detail: err.message || "Parse error" });
    }
  }

  saveData(state);
  _poPdfSetPhase("batch_results", { batchResults });
};

// ── PDF.js text extraction (all pages, y-grouped into lines) ─────────────
async function _pdfExtractAllText(arrayBuf) {
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuf }).promise;
  const pageTexts = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const tc   = await page.getTextContent();
    // Group items by Y coordinate (same Y ≈ same line)
    const byY  = {};
    for (const item of tc.items) {
      if (!item.str.trim()) continue;
      const y = Math.round(item.transform[5]);
      if (!byY[y]) byY[y] = [];
      byY[y].push(item.str.trim());
    }
    const sorted = Object.keys(byY).map(Number).sort((a,b)=>b-a);
    pageTexts.push(sorted.map(y => byY[y].join(" ")).join("\n"));
  }
  return pageTexts.join("\n");
}

// ── Axis Energy PO parser ────────────────────────────────────────────────
// Parses the Axis Energy "Purchase Agreement" format with these sections:
//   Title:    "Purchase Agreement #: XXXXX"  + AXIS ENERGY logo text
//   Vendor:   "Vendor:" label followed by vendor name line
//   Bill/Ship:"Bill:  Ship To:" (may be on same line), site name follows
//   Items:    Sequential 1, 2, 3... each with Job:/Phase: sub-lines and
//             "LS 0.000 $0.000 $AMOUNT" amount line
//   Subtotal: "Subtotal: $AMOUNT"
//   Footer:   "Report Date: M/D/YYYY ..."
function _parseAxisPO(text) {
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);

  // Identity: must have Purchase Agreement title AND Axis Energy branding
  if (!/purchase agreement\s*#:/i.test(text)) return null;
  const hasAxis = /axis\s*energy/i.test(text) || lines.some(l => /^axis$/i.test(l));
  if (!hasAxis) return null;

  // PO number — first occurrence (title line, not footer repeat)
  let poNumber = "";
  const poM = text.match(/Purchase Agreement\s*#:\s*(\S+)/i);
  if (poM) poNumber = poM[1].replace(/[^\w\-]/g, "");

  // Vendor — line after "Vendor:" label, strip trailing "(NNN)" code
  let vendor = "";
  const vIdx = lines.findIndex(l => /^vendor:$/i.test(l));
  if (vIdx >= 0) vendor = (lines[vIdx + 1] || "").replace(/\s*\(\d+\)\s*$/, "").trim();

  // Ship To — search for "Ship To:" anywhere on a line
  // PDF.js may join "Bill:" + "Ship To:" on one line, or they may be separate
  let shipTo = "";
  for (let i = 0; i < lines.length; i++) {
    if (/ship\s+to:/i.test(lines[i])) {
      // Try to get what's after "Ship To:" on the same line
      const after = lines[i].replace(/.*ship\s+to:\s*/i, "").trim();
      if (after && !/^(item\s+description)/i.test(after)) {
        shipTo = after;
      } else {
        // Scan next lines, skip Axis Energy bill-to address content
        for (let j = i + 1; j < Math.min(i + 7, lines.length); j++) {
          const nl = lines[j];
          if (/^(item\s+description|report\s+date)/i.test(nl)) break;
          if (/axis\s*energy|400\s+interstate|atlanta.*ga\s+\d|^\d{5}/i.test(nl)) continue;
          if (nl) { shipTo = nl; break; }
        }
      }
      break;
    }
  }

  // Line items — between "Item Description..." header and "Subtotal:" line
  // Key: track inPhase flag to skip phase-continuation lines like "3916 kWh BESS"
  // Key: only accept items at expected sequential numbers (1, 2, 3...)
  const lineItems = [];
  let jobNumber = "", phaseStr = "";
  const hIdx   = lines.findIndex(l => /^item\s+description/i.test(l));
  const stIdx  = lines.findIndex((l, i) => i > hIdx && /^subtotal:/i.test(l));
  const start  = hIdx >= 0 ? hIdx + 1 : 0;
  const stop   = stIdx > 0 ? stIdx : lines.length;

  let cur = null, inPhase = false, nextNum = 1;
  for (let i = start; i < stop; i++) {
    const l = lines[i];

    // Amount line: "LS 0.000 $0.000 $1,234,567.890"
    const aM = l.match(/^([A-Z]{1,4})\s+[\d.]+\s+\$[\d.,]+\s+\$([\d,]+\.?\d*)/i);
    if (aM && cur) {
      cur.um = aM[1]; cur.total = parseFloat(aM[2].replace(/,/g, ""));
      inPhase = false; continue;
    }

    // Phase: line — set inPhase flag so continuation lines are skipped
    if (/^Phase:\s*/i.test(l)) {
      if (!phaseStr) phaseStr = l.replace(/^Phase:\s*/i, "").trim();
      inPhase = true; continue;
    }

    if (inPhase) continue; // skip "3916 kWh BESS" etc.

    // Job: line
    const jM = l.match(/^Job:\s*(\S+)/i);
    if (jM) { if (!jobNumber) jobNumber = jM[1]; continue; }

    // New item — only at expected sequential number
    const iM = l.match(/^(\d+)\s+(.+)/);
    if (iM && parseInt(iM[1]) === nextNum) {
      if (cur) lineItems.push(cur);
      // Strip trailing UM/price columns that PDF.js may join onto the description line
      // e.g. "Item Name LS 0.000 $0.000 $1,234.56" → "Item Name"
      let rawDesc = iM[2].trim();
      rawDesc = rawDesc.replace(/\s+[A-Z]{1,4}\s+[\d.]+\s+\$[\d,.]+\s+\$[\d,.]+\s*$/i, "").trim();
      cur = { description: rawDesc, um: "", total: 0 };
      nextNum++; inPhase = false; continue;
    }
  }
  if (cur) lineItems.push(cur);

  // Description from all item descriptions
  const description = lineItems.map(l => l.description).filter(Boolean).join("; ");

  // Amount from Subtotal line
  let amount = 0;
  const stM = text.match(/Subtotal:\s*\$([\d,]+\.?\d*)/i);
  if (stM) amount = parseFloat(stM[1].replace(/,/g, ""));
  if (!amount) amount = lineItems.reduce((s, li) => s + (li.total || 0), 0);

  // Order date from Report Date footer
  let orderDate = "";
  const rdM = text.match(/Report Date:\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/i);
  if (rdM) {
    orderDate = `${rdM[3]}-${rdM[1].padStart(2,"0")}-${rdM[2].padStart(2,"0")}`;
  }

  return { poNumber, vendor, description, amount, orderDate, jobNumber, phase: phaseStr, shipTo, lineItems };
}

// ── Confirm import ────────────────────────────────────────────────────────
window.poPdfConfirmImport = function() {
  const gf = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
  const amt = parseFloat(gf("ppv_amt")) || 0;
  const newPO = {
    id: uid(), poNumber: gf("ppv_num"), vendor: gf("ppv_vendor"),
    description: gf("ppv_desc"), originalAmount: amt, adjustedAmount: amt,
    orderDate: gf("ppv_date"), jobNumber: gf("ppv_job"), shipTo: gf("ppv_shipto"),
    orderedBy: "", invoices: [], changeOrders: [],
    sourceFile: _poPdf.fileName, importedVia: "axis-pdf",
  };

  // Update existing PO if same PO number found
  const existing = (state.purchaseOrders || []).find(p => p.poNumber === newPO.poNumber && newPO.poNumber);
  if (existing) {
    Object.assign(existing, {
      vendor: newPO.vendor || existing.vendor,
      description: newPO.description || existing.description,
      originalAmount: newPO.originalAmount || existing.originalAmount,
      adjustedAmount: newPO.adjustedAmount || existing.adjustedAmount,
      orderDate: newPO.orderDate || existing.orderDate,
      jobNumber: newPO.jobNumber || existing.jobNumber,
      shipTo: newPO.shipTo || existing.shipTo,
      sourceFile: newPO.sourceFile,
      importedVia: "axis-pdf",
    });
    saveData(state);
    closeModal("importPOPdf");
    _poPdf = { phase: "idle", fileName: "", parsed: null, errorMsg: "" };
    showToast(`PO ${newPO.poNumber} updated from PDF`);
    render(); return;
  }

  addToArray("purchaseOrders", newPO);
  closeModal("importPOPdf");
  _poPdf = { phase: "idle", fileName: "", parsed: null, errorMsg: "" };
  showToast(`PO ${newPO.poNumber} imported — ${fmt$(amt)}`);
};

// ── Toast notification ────────────────────────────────────────────────────
function showToast(msg, ms) {
  ms = ms || 3500;
  const old = document.getElementById("pw-toast");
  if (old) old.remove();
  const t = document.createElement("div");
  t.id = "pw-toast";
  t.style.cssText = "position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#3D405B;color:#fff;padding:10px 22px;border-radius:100px;font-size:13px;font-weight:500;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.25);pointer-events:none;animation:fadeInUp .2s ease";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { if (t.parentNode) t.remove(); }, ms);
}

// Normalize any invoice object to canonical schema regardless of import source
function normalizeInvoice(inv) {
  return {
    id:           inv.id           || inv._id          || "",
    number:       inv.number       || inv.invoiceNumber || "",
    dateReceived: inv.dateReceived || inv.date          || "",
    dateApproved: inv.dateApproved || "",
    datePaid:     inv.datePaid     || "",
    amount:       +(inv.amount     || 0),
    description:  inv.description  || "",
  };
}

// Normalize all invoices in all POs on load (migration for any legacy data)
function migrateInvoiceSchema() {
  for (const po of (state.purchaseOrders || [])) {
    if (!po.invoices) continue;
    po.invoices = po.invoices.map(normalizeInvoice);
  }
}

window.addInvoiceToPO = poId => {
  const po = state.purchaseOrders.find(p=>p.id===poId);
  if(po){if(!po.invoices)po.invoices=[];po.invoices.push(normalizeInvoice({id:uid(),number:"",dateReceived:"",dateApproved:"",datePaid:"",amount:0,description:""}));saveData(state);render();}
};
window.updPOInv = (poId,invId,f,v) => {
  const po = state.purchaseOrders.find(p=>p.id===poId);
  if(po){const inv=po.invoices.find(i=>i.id===invId);if(inv){inv[f]=v;saveData(state);}}
};
window.rmPOInv = (poId,invId) => {
  const po = state.purchaseOrders.find(p=>p.id===poId);
  if(po){po.invoices=po.invoices.filter(i=>i.id!==invId);saveData(state);render();}
};

// --- RFI LOG ---
// Validate RFI close — warn if response or response date is missing.
// Returns true to proceed, false to abort. Soft validation: user can confirm.
window.validateAndSetRFIStatus = (id, newStatus) => {
  if (newStatus !== "Closed") {
    updArr('rfis', id, 'status', newStatus);
    return;
  }
  const rfi = (state.rfis || []).find(r => r.id === id);
  if (!rfi) return;
  const missingResponse = !rfi.response || rfi.response.trim().length < 3;
  const missingDate     = !rfi.responseDate;
  if (missingResponse || missingDate) {
    const missing = [missingResponse ? "response text" : null, missingDate ? "response date" : null].filter(Boolean).join(" and ");
    const msg = `Close RFI ${rfi.rfiNumber || id} without ${missing}?\n\nBest practice is to document the response before closing.`;
    if (!confirm(msg)) return;
  }
  updArr('rfis', id, 'status', newStatus);
};

// ═══════════════════════════════════════════════════════
// CPM SCHEDULE ENGINE
// Forward pass → backward pass → float → critical path
// ═══════════════════════════════════════════════════════

const WORK_DAYS_PER_WEEK = 5; // Mon–Fri

// Add n work days to a date string, return date string
function addWorkDays(dateStr, n) {
  if (!dateStr || isNaN(n)) return dateStr;
  let d = new Date(dateStr + "T00:00:00");
  let remaining = Math.abs(n);
  const dir = n >= 0 ? 1 : -1;
  while (remaining > 0) {
    d.setDate(d.getDate() + dir);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6) remaining--;
  }
  return d.toISOString().split("T")[0];
}

// Work-day difference between two date strings (end - start, inclusive of both)
function workDaysBetween(startStr, endStr) {
  if (!startStr || !endStr) return 0;
  let s = new Date(startStr + "T00:00:00");
  let e = new Date(endStr + "T00:00:00");
  if (s > e) return 0;
  let count = 0;
  let cur = new Date(s);
  while (cur <= e) {
    const dow = cur.getDay();
    if (dow !== 0 && dow !== 6) count++;
    cur.setDate(cur.getDate() + 1);
  }
  return count;
}

// Parse predecessors string: "sc5,sc3+2d,sc4-1d" → [{id, lag}]
function parsePreds(predStr) {
  if (!predStr) return [];
  return predStr.split(/[,;\s]+/).filter(Boolean).map(p => {
    const m = p.match(/^([^\+\-]+)([\+\-]\d+d?)?$/i);
    if (!m) return { id: p.trim(), lag: 0 };
    const lag = m[2] ? parseInt(m[2]) : 0;
    return { id: m[1].trim(), lag };
  });
}

// Full CPM calculation: returns Map of taskId → {es, ef, ls, lf, float, isCritical, duration}
function runCPM(tasks) {
  const byId = new Map(tasks.map(t => [t.id, t]));
  const cpm  = new Map(); // taskId → {es,ef,ls,lf,float,isCritical}

  // Seed each task with its current start as ES
  for (const t of tasks) {
    const dur = +t.duration > 0 ? +t.duration
              : (t.start && t.end ? workDaysBetween(t.start, t.end) : 1);
    cpm.set(t.id, { es: t.start||"", ef: t.end||"", ls:"", lf:"", float:null, isCritical:false, dur });
  }

  // Forward pass (topological — iterate until stable, max 20 passes for cycles)
  for (let pass = 0; pass < 20; pass++) {
    let changed = false;
    for (const t of tasks) {
      const preds = parsePreds(t.predecessors||"");
      if (!preds.length) continue;
      const c = cpm.get(t.id);
      let latestEF = "";
      for (const { id: predId, lag } of preds) {
        const pred = cpm.get(predId);
        if (!pred || !pred.ef) continue;
        const candidate = lag !== 0 ? addWorkDays(pred.ef, lag) : pred.ef;
        if (!latestEF || candidate > latestEF) latestEF = candidate;
      }
      if (latestEF && latestEF > (c.es||"")) {
        // Start day after predecessor finish
        const newES = addWorkDays(latestEF, 1);
        if (newES !== c.es) { c.es = newES; changed = true; }
        const newEF = addWorkDays(newES, c.dur - 1);
        if (newEF !== c.ef) { c.ef = newEF; changed = true; }
      }
    }
    if (!changed) break;
  }

  // Find project end (max EF)
  let projectEnd = "";
  for (const [, c] of cpm) { if (c.ef > projectEnd) projectEnd = c.ef; }

  // Backward pass
  for (const t of [...tasks].reverse()) {
    const c = cpm.get(t.id);
    if (!c.lf) c.lf = projectEnd;
    c.ls = addWorkDays(c.lf, -(c.dur - 1));
    c.float = workDaysBetween(c.es, c.ls);
    c.isCritical = c.float <= 0;
    // Push LF to predecessors
    for (const { id: predId } of parsePreds(t.predecessors||"")) {
      const pc = cpm.get(predId);
      if (!pc) continue;
      const predLF = addWorkDays(c.ls, -1);
      if (!pc.lf || predLF < pc.lf) pc.lf = predLF;
    }
  }

  return cpm;
}

// --- CONSTRUCTION SCHEDULE (Gantt) ---
let schedAutoSchedule = false;

function renderSchedule() {
  const tasks = state.schedule.tasks;

  // Run CPM
  const cpm = tasks.length ? runCPM(tasks) : new Map();

  // If auto-schedule is on, push computed ES/EF back into tasks
  if (schedAutoSchedule) {
    for (const t of tasks) {
      const c = cpm.get(t.id);
      if (!c) continue;
      if (parsePreds(t.predecessors||"").length > 0 && c.es) {
        t.start = c.es;
        t.end   = c.ef;
      }
    }
  }

  // Date range
  let minD = null, maxD = null;
  for (const t of tasks) {
    const c = cpm.get(t.id);
    const s = (schedAutoSchedule && c?.es) ? c.es : t.start;
    const e = (schedAutoSchedule && c?.ef) ? c.ef : t.end;
    if (s && (!minD || s < minD)) minD = s;
    if (e && (!maxD || e > maxD)) maxD = e;
    if (c?.lf && (!maxD || c.lf > maxD)) maxD = c.lf;
  }
  const today = new Date().toISOString().split("T")[0];
  if (!minD) minD = today;
  if (!maxD) { const d=new Date(minD+"T00:00:00"); d.setMonth(d.getMonth()+6); maxD=d.toISOString().split("T")[0]; }

  const msStart = new Date(minD+"T00:00:00").getTime();
  const msEnd   = new Date(maxD+"T00:00:00").getTime();
  const span    = Math.max(1, msEnd - msStart);
  // Dynamic gantt width based on viewport
  const _vw = typeof window !== 'undefined' ? (window.innerWidth || 1280) : 1280;
  const ganttW = Math.max(400, _vw - 280 - 440);

  // Month headers
  const months = [];
  let cur = new Date(minD+"T00:00:00"); cur.setDate(1);
  while (cur.getTime() <= msEnd) {
    months.push({ label: cur.toLocaleDateString("en-US",{month:"short",year:"2-digit"}), ms: cur.getTime() });
    cur.setMonth(cur.getMonth()+1);
  }

  const todayMs = new Date(today+"T00:00:00").getTime();
  const todayX  = todayMs >= msStart && todayMs <= msEnd
    ? Math.round(((todayMs-msStart)/span)*ganttW) : null;

  // Critical path count
  const cpCount = [...cpm.values()].filter(c=>c.isCritical).length;

  let html = `<div class="page-title" data-module="schedule">Construction Schedule</div>`;
  html += secHeader("Construction Schedule", tasks.length, "openModal('addSchedTask')", "+ Task");

  // Toolbar
  html += `<div class="sched-toolbar">

    </label>
    <span style="font-size:11px;color:var(--text-lt);margin-left:4px">|</span>
    ${cpCount>0?`<span style="font-size:11px;color:var(--red);font-weight:600"><span class="cp-badge"></span>${cpCount} critical task${cpCount!==1?"s":""}</span>`:""}
    <span style="flex:1"></span>
    <button class="btn btn-secondary btn-sm" onclick="openModal('addSchedTask')">+ Task</button>
    <button class="btn btn-secondary btn-sm" onclick="runAutoSchedulePass()" title="Recalculate CPM now">⟳ Recalc</button>
  </div>`;

  // Gantt table
  const _tableMinW = ganttW + 560;
  html += `<div class="gantt-wrap"><table class="gantt-table" style="min-width:${_tableMinW}px">
    <colgroup>
      <col style="min-width:180px;width:20%"><col style="width:${ganttW}px"><col style="width:38px"><col style="width:84px"><col style="width:84px"><col style="width:40px"><col style="width:46px"><col style="width:44px">
    </colgroup>
    <thead><tr>

        <div style="position:relative;width:${ganttW}px;height:18px;overflow:hidden">
          ${months.map(m=>{
            const mEnd = new Date(m.ms); mEnd.setMonth(mEnd.getMonth()+1);
            const x1 = Math.round(((m.ms-msStart)/span)*ganttW);
            const x2 = Math.min(ganttW, Math.round(((mEnd.getTime()-msStart)/span)*ganttW));
            const w  = Math.max(24, x2-x1);
            return `<div style="position:absolute;left:${x1}px;width:${w}px;border-right:1px solid var(--border);font-size:9px;text-align:center;overflow:hidden;white-space:nowrap;line-height:18px">${esc(m.label)}</div>`;

  if (!tasks.length) {

  for (let i=0; i<tasks.length; i++) {

    const isMilestone = t.start === t.end && t.start;
    const isCritical = c.isCritical && !isSummary;
    const pct  = +t.percentComplete || 0;
    const indent = level * 14;
    const floatDays = (c.float !== null && c.float !== undefined && !isSummary) ? c.float : null;

    // Gantt bar
    let barHtml = "";
    const drawStart = t.start || c.es;
    const drawEnd   = t.end   || c.ef;
    if (drawStart && drawEnd) {
      const sMs = new Date(drawStart+"T00:00:00").getTime();
      const eMs = new Date(drawEnd+"T00:00:00").getTime();
      const left  = Math.max(0, Math.round(((sMs-msStart)/span)*ganttW));
      const wFull = Math.max(isMilestone?8:3, Math.round(((eMs-sMs)/span)*ganttW));

        </div>`;
      } else {

          ${floatBarHtml}
          <div style="position:absolute;left:${left}px;width:${wFull}px;height:14px;top:2px;background:${barColor}22;border-radius:4px;border:1px solid ${barColor}55">
            <div style="height:100%;width:${pct}%;background:${barColor};border-radius:3px 0 0 3px;min-width:${pct>0?2:0}px"></div>
          </div>
        </div>`;
      }
    }

    const rowClass = isSummary ? "summary-row" : (isCritical ? "critical-row" : "");
    const displayStart = t.start || "";
    const displayEnd   = t.end   || "";

    html += `<tr id="row_${t.id}" class="${rowClass}">
      <td style="padding-left:${4+indent}px;overflow:hidden">
        <div style="display:flex;align-items:center;gap:3px;min-width:0">
          ${isCritical?`<span class="cp-badge" title="Critical path" style="flex-shrink:0"></span>`:""}
          <div style="display:flex;gap:1px;flex-shrink:0">
            <button class="task-ctrl-btn" onclick="schedMoveTask('${t.id}',-1)" title="Move up" style="font-size:9px;padding:1px 3px;line-height:1">▲</button>
            <button class="task-ctrl-btn" onclick="schedMoveTask('${t.id}',1)" title="Move down" style="font-size:9px;padding:1px 3px;line-height:1">▼</button>
          </div>
          <div style="flex:1;min-width:0;overflow:hidden">${ecell(t.name,`updSchedTask('${t.id}','name',this.value)`,"text","Task name…")}</div>
        </div>
      </td>
      <td style="padding:2px 2px">${barHtml||`<div style="width:${ganttW}px;height:18px"></div>`}</td>
      <td style="text-align:center;padding:4px 2px">
        <select class="ecell" style="width:32px;font-size:10px;padding:1px 2px" onchange="updSchedTask('${t.id}','level',+this.value)">
          ${[0,1,2,3,4].map(l=>`<option value="${l}" ${level===l?"selected":""}>${l}</option>`).join("")}
        </select>
      </td>
      <td style="font-size:11px;white-space:nowrap;padding:4px 6px">${ecell(displayStart,`updSchedTask('${t.id}','start',this.value)`,"date")}</td>
