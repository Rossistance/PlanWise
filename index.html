  html += `</tbody></table></div>`;

  // CPM legend
  html += `<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;font-size:11px;color:var(--text-lt)">

window.updSchedTask = (id, f, v) => {
  const t = state.schedule.tasks.find(x=>x.id===id);
  if (!t) return;
  t[f] = v;
  // If duration changes and start is known, recompute end
  if (f === "duration" && +v > 0 && t.start) {
    t.end = addWorkDays(t.start, +v - 1);
  }
  // If start changes and duration is set, recompute end
  if (f === "start" && +t.duration > 0 && v) {
    t.end = addWorkDays(v, +t.duration - 1);
  }
  saveData(state);
  render();
};
window.rmSchedTask = id => {
  state.schedule.tasks = state.schedule.tasks.filter(x=>x.id!==id);
  saveData(state); render();
};
window.submitSchedTask = () => {
  const name = gv("sched_name"); if (!name) return;
  const dur  = +gv("sched_dur") || 0;
  const start = gv("sched_start");
  let end = gv("sched_end");
  if (dur > 0 && start && !end) end = addWorkDays(start, dur - 1);
  state.schedule.tasks.push({
    id: uid(), name,
    level: +gv("sched_level") || 0,
    start, end,
    duration: dur || "",
    percentComplete: +gv("sched_pct") || 0,
    predecessors: gv("sched_preds")
  });
  saveData(state); closeModal("addSchedTask"); render();
};
window.schedMoveTask = (id, dir) => {
  const tasks = state.schedule.tasks;
  const i = tasks.findIndex(x=>x.id===id);
  if (i < 0) return;
  const j = i + dir;
  if (j < 0 || j >= tasks.length) return;
  [tasks[i], tasks[j]] = [tasks[j], tasks[i]];
  saveData(state); render();
};
window.runAutoSchedulePass = () => {
  schedAutoSchedule = true;
  render();
  showSaveIndicator("✓ Schedule recalculated");
};

async function processImportFiles(files) {
  const results = [];
  const startTime = Date.now();
  // Sort files: PDFs first (standard Viewpoint exports), then spreadsheets
  const sortedFiles = [...files].sort((a,b) => {
    const aIsPdf = a.name.toLowerCase().endsWith('.pdf') ? 0 : 1;
    const bIsPdf = b.name.toLowerCase().endsWith('.pdf') ? 0 : 1;
    return aIsPdf - bIsPdf;
  });

  for (const file of sortedFiles) {
    const ext  = file.name.split(".").pop().toLowerCase();
    const name = file.name.toLowerCase();
    showSaveIndicator("Importing: " + file.name + "...");

    if (ext === "xlsx" || ext === "xls" || ext === "csv") {
      const data = await file.arrayBuffer();
      try {
        if (typeof XLSX === "undefined") await loadSheetJS();
        const wb = XLSX.read(data);
        const detail = classifyAndImportWorkbook(wb, name, file.name);
        results.push({ file: file.name, status: "ok", detail: detail || "Imported" });
      } catch(e) {
        results.push({ file: file.name, status: "error", detail: e.message || "Parse error" });
        console.error(e);
      }
    } else if (ext === "pdf") {
      try {
        // Read file bytes — use Uint8Array so JSZip and PDF.js both get fresh data
        const rawBuf = await file.arrayBuffer();
        const uint8  = new Uint8Array(rawBuf);
        let text;
        let extractMethod;

        // Try ZIP extraction first (Claude-format packaged PDFs are ZIP archives).
        // Feed JSZip the Uint8Array directly — avoids ArrayBuffer transfer/detach issues.
        let zipAttempted = false;
        try {
          await _loadJSZip();
          const zip = await JSZip.loadAsync(uint8);
          const hasManifest = !!zip.file("manifest.json");
          const hasTxt = Object.keys(zip.files).some(n => /^\d+\.txt$/.test(n));
          if (hasManifest || hasTxt) {
            zipAttempted = true;
            // Extract ordered txt pages
            let pages = [];
            if (hasManifest) {
              const mf = JSON.parse(await zip.file("manifest.json").async("string"));
              pages = (mf.pages || []).map(p => p.text && p.text.path).filter(Boolean);
            }
            if (!pages.length) {
              // Fallback: numeric order
              pages = Object.keys(zip.files)
                .filter(n => /^\d+\.txt$/.test(n))
                .sort((a, b) => parseInt(a) - parseInt(b));
            }
            const parts = [];
            for (const p of pages) {
              const f2 = zip.file(p);
              if (f2) parts.push(await f2.async("string"));
            }
            text = parts.join("\n").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
            extractMethod = "zip-package";
          }
        } catch(zipErr) {
          console.log("[PlanWise] ZIP extraction failed:", zipErr.message);
        }

        if (!zipAttempted) {
          // Standard PDF: use PDF.js
          if (!_pdfJsReady) await _loadPdfJs();
          text = await _pdfExtractAllText(rawBuf);
          extractMethod = "pdf.js";
        }
        const pdfLines = text.split("\n").map(l=>l.trim()).filter(Boolean);
        const pdfPreview = pdfLines.slice(0,4).join(" | ").slice(0,200);
        const imported = await tryImportPDF(text, file.name);
        if (imported) {
          results.push({ file: file.name, status: "ok", detail: imported + "  \u2022 " + extractMethod + " \u2022 lines: " + pdfPreview });
          logActivity("import","import","PDF Import", imported);
        } else {
          results.push({ file: file.name, status: "warn", detail: "PDF format not recognized (" + extractMethod + ") \u2014 first lines: " + pdfPreview });
        }
      } catch(e) {
        results.push({ file: file.name, status: "error", detail: e.message });
      }
    } else if (ext === "xml") {
      const text = await file.text();
      if (text.includes("<Project") && (text.includes("<Task") || text.includes("<Tasks"))) {
        importMSProjectXML(text);
        results.push({ file: file.name, status: "ok", detail: "MS Project XML schedule imported" });
      } else {
        results.push({ file: file.name, status: "warn", detail: "XML format not recognized" });
      }
    } else if (ext === "mpp") {
      try {
        if (typeof XLSX === "undefined") await loadSheetJS();
        const data2 = await file.arrayBuffer();
        importMPPFile(new Uint8Array(data2), file.name);
        results.push({ file: file.name, status: "ok", detail: "MPP schedule imported" });
      } catch(e) {
        results.push({ file: file.name, status: "error", detail: e.message });
      }
    } else {
      results.push({ file: file.name, status: "warn", detail: "File type not supported" });
    }
  }

  // Single save + render after all files processed
  console.log("[PlanWise] Import complete — state.costs:", JSON.stringify((state.costs||[]).map(r=>({id:r.id,est:r.estimated,jtd:r.jtd,comm:r.openCommitted}))));
  saveData(state);
  render();

  const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
  if (results.length === 1) {
    // Single file — use old-style indicator
    const r = results[0];
    const icon = r.status === "ok" ? "✓" : r.status === "warn" ? "⚠" : "✗";
    showSaveIndicator(`${icon} ${r.detail}`);
  } else if (results.length > 1) {
    showImportSummary(results, elapsed);
  }
}

function escHtml(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function loadSheetJS() {
  return new Promise((resolve, reject) => {
    if (typeof XLSX !== "undefined") return resolve();
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = resolve;
    s.onerror = () => {
      // Fallback: try another CDN
      const s2 = document.createElement("script");
      s2.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
      s2.onload = resolve;
      s2.onerror = reject;
      document.head.appendChild(s2);
    };
    document.head.appendChild(s);
  });
}


// ═══════════════════════════════════════════════════════════════════════════════
// VISTA CRYSTAL REPORT PDF IMPORT ENGINE  (v2.0.6)
// Standard import format: Viewpoint Vista PDF exports (Crystal Reports).
// Uses PDF.js text extraction (already loaded via _loadPdfJs / _pdfExtractAllText).
//
//  1910 Project Summary Report    → project header, costs by CT, contract info, AR/cash flow
//  JC Committed Cost Detail       → purchase orders by vendor/phase, committed $, CT open committed
//  PO Purchase Orders by Job      → canonical PO list with totals/invoiced/paid
//  PO Purchase Order Status Report→ per-PO detail + AP invoice/payment history + change orders
//  JC Detail                      → actuals by transaction (accumulate JTD costs by CT)
//  JC Cost Types                  → reference only (no data written)
//  JC Phase Cost Types            → reference only (no data written)
//
//  Also preserves Axis Energy individual Purchase Agreement PDFs (Import PO PDF button).
// ═══════════════════════════════════════════════════════════════════════════════

// ── Helpers ──────────────────────────────────────────────────────────────────
function _pdfNum(s) {
  // Parse "1,234.56", "-1,234.56", "(1,234.56)" → number
  if (!s) return 0;
  const str = String(s).trim();
  const isNeg = str.startsWith("(") || str.startsWith("-");
  return (isNeg ? -1 : 1) * (parseFloat(str.replace(/[(),]/g, "").replace(/[^0-9.\-]/g, "")) || 0);
}

function _pdfDateStr(s) {
  // "MM/YY" → "20YY-MM-01",  "MM/DD/YY" or "MM/DD/YYYY" → "YYYY-MM-DD"
  if (!s) return "";
  const m2 = s.match(/^(\d{1,2})\/(\d{2})$/);
  if (m2) return `20${m2[2]}-${m2[1].padStart(2,"0")}-01`;
  const m3 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (!m3) return "";
  const yr = m3[3].length === 2 ? "20" + m3[3] : m3[3];
  return `${yr}-${m3[1].padStart(2,"0")}-${m3[2].padStart(2,"0")}`;
}

function _mergePOIntoState(po) {
  // po.poNumber is the canonical key
  if (!state.purchaseOrders) state.purchaseOrders = [];
  const existing = state.purchaseOrders.find(p => p.poNumber === po.poNumber);
  if (existing) {
    if (po.vendor)          existing.vendor          = po.vendor;
    if (po.description)     existing.description     = po.description;
    if (po.originalAmount)  existing.originalAmount  = po.originalAmount;
    if (po.adjustedAmount !== undefined) existing.adjustedAmount = po.adjustedAmount;
    if (po.orderDate)       existing.orderDate       = po.orderDate;
    if (po.status)          existing.status          = po.status;
    if (po.costType)        existing.costType        = po.costType;
    if (po.costLineId)      existing.costLineId      = po.costLineId;
    if (po.jobNumber)       existing.jobNumber       = po.jobNumber;
    if (po.invoices && po.invoices.length) {
      if (!existing.invoices) existing.invoices = [];
      const realInvoices = existing.invoices.filter(i => i.source !== "vp-import-placeholder");
      po.invoices.forEach(inv => {
        if (!realInvoices.find(i => i.ref === inv.ref && Math.abs(i.amount - inv.amount) < 0.01))
          realInvoices.push(inv);
      });
      existing.invoices = realInvoices;
    }
    return "updated";
  } else {
    state.purchaseOrders.push({
      id:             uid(),
      poNumber:       po.poNumber,
      vendor:         po.vendor         || "",
      description:    po.description    || "",
      originalAmount: po.originalAmount || 0,
      adjustedAmount: po.adjustedAmount !== undefined ? po.adjustedAmount : (po.originalAmount || 0),
      orderDate:      po.orderDate      || "",
      status:         po.status         || "Closed",
      jobNumber:      po.jobNumber      || "",
      costType:       po.costType       || "",
      costLineId:     po.costLineId     || "",
      invoices:       po.invoices       || [],
      importedVia:    "vista-pdf",
    });
    return "added";
  }
}

// ── Main dispatcher ───────────────────────────────────────────────────────────
async function tryImportPDF(text, filename) {
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const firstLines = lines.slice(0, 5).join(" ");
  console.log("[PlanWise PDF Import] File:", filename);
  console.log("[PlanWise PDF Import] First 5 lines:", JSON.stringify(lines.slice(0, 5)));
  console.log("[PlanWise PDF Import] firstLines joined:", firstLines.slice(0, 200));

  // ── 1. 1910 Project Summary Report ──
  if (/1910 Project Summary Report/i.test(firstLines)) {
    return pdfImportProjectSummary(lines, filename);
  }

  // ── 2. JC Committed Cost Detail ──
  if (/JC Committed Cost Detail/i.test(firstLines)) {
    return pdfImportJCCommittedCost(lines, filename);
  }

  // ── 3. PO Purchase Orders by Job ──
  if (/PO Purchase Orders by Job/i.test(firstLines)) {
    return pdfImportPOByJob(lines, filename);
  }

  // ── 4. PO Purchase Order Status Report ──
  if (/PO Purchase Order Status Report/i.test(firstLines)) {
    return pdfImportPOStatusReport(lines, filename);
  }

  // ── 5. JC Detail ──
  if (/^JC Detail$/i.test(lines[0]) || (firstLines.includes("JC Detail") && firstLines.includes("Report Description") && !firstLines.includes("Committed"))) {
    return pdfImportJCDetail(lines, filename);
  }

  // ── 6. JC Cost Types (reference only) ──
  if (/JC Cost Types/i.test(firstLines)) {
    return "JC Cost Types imported (reference — no data changes)";
  }

  // ── 7. JC Phase Cost Types (reference only) ──
  if (/JC Phases and Cost Types/i.test(firstLines) || /JC Phase Cost Types/i.test(firstLines)) {
    return "JC Phase Cost Types imported (reference — no data changes)";
  }

  // ── 8. Axis Energy Purchase Agreement (existing flow, preserved) ──
  const parsed = _parseAxisPO(text);
  if (parsed) {
    return _importAxisPOParsed(parsed, filename);
  }

  return null; // unrecognized
}

// ── 1. 1910 Project Summary Report ───────────────────────────────────────────
function pdfImportProjectSummary(lines, filename) {
  const full = lines.join(" ");

  // ── Contract header ──
  // PDF.js may output "Through Month: 03/26" BEFORE "Contract: 24-001 Greenville Utilities"
  // so when joined: "...Through Month: 03/26 Contract: 24-001 Greenville Utilities Contract:..."
  // Try both orders:
  let jobNumber = "", jobDesc = "", throughMo = "";
  const jobM1 = full.match(/Contract:\s*([\w-]+)\s+(.+?)\s+Through Month:\s*(\d{2}\/\d{2,4})/i);
  const jobM2 = full.match(/Through Month:\s*(\d{2}\/\d{2,4})\s+Contract:\s*([\w-]+)\s+(.+?)(?:\s+Contract:|$)/i);
  if (jobM1) {
    jobNumber = jobM1[1].trim(); jobDesc = jobM1[2].trim(); throughMo = jobM1[3].trim();
  } else if (jobM2) {
    throughMo = jobM2[1].trim(); jobNumber = jobM2[2].trim(); jobDesc = jobM2[3].trim();
  } else {
    // Fallback: extract separately
    const jmF = full.match(/Contract:\s*([\w-]+)\s+([A-Za-z][\w\s]+?)(?:\s+Contract:|$)/i);
    if (jmF) { jobNumber = jmF[1].trim(); jobDesc = jmF[2].trim(); }
    const tmF = full.match(/Through Month:\s*(\d{2}\/\d{2,4})/i);
    if (tmF) throughMo = tmF[1].trim();
  }

  // ── PM ──
  const pmM  = full.match(/Project M\w*\s+\d+\s+([A-Za-z][A-Za-z ]+?)\s+(?:Last Billing|Cust Phone|Project Coord)/i);
  const pm   = pmM ? pmM[1].trim() : "";

  // ── Customer ──
  const custM    = full.match(/Cust Name:\s*([A-Z][A-Z0-9\s,./&-]+?)\s+(?:Bonded\?|CCIP)/i);
  const customer = custM ? custM[1].trim() : "";

  // ── Department ──
  const deptM = full.match(/Department:\s*([A-Za-z][A-Za-z0-9\s]+?)(?:\s+Estimator:|$)/i);
  const department = deptM ? deptM[1].trim() : "";

  // ── Dates ──
  const startM   = full.match(/Start Month:\s*(\d{2}\/\d{2,4})/i);
  const estCompM = full.match(/Est Complete Date:\s*(\d{2}\/\d{2}\/\d{2,4})/i);
  const contractStatusM = full.match(/Contract Stat\w*:\s*(\w+)/i);

  // ── Contract amounts — scan line-by-line ──
  // PDF.js may place the value on the SAME line, NEXT line, or even the PREVIOUS line
  // (e.g. "581,333.10" on line 51, then "Projected Profit" on line 52)
  function extractAmount(labelRe) {
    for (let i = 0; i < lines.length; i++) {
      if (!labelRe.test(lines[i])) continue;
      // Same line: trailing number
      const sameM = lines[i].match(/\b([\d,]+\.\d{2})\s*$/);
      if (sameM) return _pdfNum(sameM[1]);
      // Inline after label
      const inlineM = lines[i].match(new RegExp(labelRe.source + '[^\\d]*(\\d[\\d,.]*\\.\\d{2})', labelRe.flags));
      if (inlineM) return _pdfNum(inlineM[1]);
      // Check next non-empty lines (value AFTER label)
      for (let j = i + 1; j < Math.min(i + 4, lines.length); j++) {
        const nextM = lines[j].trim().match(/^([-\d,]+\.\d{2})(?:\s|$)/);
        if (nextM) return _pdfNum(nextM[1]);
        if (/^[A-Za-z]/.test(lines[j].trim())) break;
      }
      // Check preceding line (value BEFORE label, e.g. Projected Profit)
      if (i > 0) {
        const prevM = lines[i-1].trim().match(/^([-\d,]+\.\d{2})$/);
        if (prevM) return _pdfNum(prevM[1]);
      }
    }
    return 0;
  }

  const origAmt       = extractAmount(/Original Contract:/i);
  const revisedAmt    = extractAmount(/Revised Contract:/i);
  const approvedCOs   = extractAmount(/Approved Change Orders:/i);
  const pendingCOs    = extractAmount(/Pending Change Orders:/i);
  const projContValue = extractAmount(/Projected Contract Value:/i);
  const retainagePct  = extractAmount(/Retainage\s*%/i);
  const contractAmount = revisedAmt || origAmt;

  // ── Contract Progress ──
  const pctComplete = extractAmount(/%\s*Complete:/i);
  const pctBilled   = extractAmount(/%\s*Billed:/i);
  const billedToDate = extractAmount(/Billed To Date:/i);
  const earnedToDate = extractAmount(/Earned To Date:/i);
  const overUnder    = extractAmount(/Over\s*\/\s*\(\s*Under\s*\)/i);

  // ── Cash Flow ──
  const cashBilled     = extractAmount(/^Billed:/i) || billedToDate;
  const cashCollected  = extractAmount(/Collected To Date/i);
  const cashBalance    = extractAmount(/^Balance:/i);
  const cashPaidOut    = extractAmount(/Paid Out To Date/i);
  const netCashFlow    = extractAmount(/Net Cash Flow:/i);

  // ── Labor section ──
  const estHours     = extractAmount(/Estimated Hours/i);
  const jtdHours     = extractAmount(/Job To Date Hours/i);
  const estLaborRate = extractAmount(/Estimated Labor Rate/i);
  const actLaborRate = extractAmount(/Actual Labor Rate/i);

  // ── Projected Profit/Margin ──
  const projProfit   = extractAmount(/Projected Profit/i);
  const projMarginPct= extractAmount(/Projected Margin/i);

  // ── AR Aging — values may be mid-line (e.g. "100.00% Billed: 1,535,486.82 0 - 30 0.00") ──
  const arAging = {};
  for (const line of lines) {
    let m;
    if ((m = line.match(/\b0\s*-\s*30\s+([\d,]+\.?\d*)/))) arAging["0-30"] = _pdfNum(m[1]);
    if ((m = line.match(/\b31\s*-\s*60\s+([\d,]+\.?\d*)/))) arAging["31-60"] = _pdfNum(m[1]);
    if ((m = line.match(/\b61\s*-\s*90\s+([\d,]+\.?\d*)/))) arAging["61-90"] = _pdfNum(m[1]);
    if ((m = line.match(/\b91\s*&\s*Over\s+([\d,]+\.?\d*)/))) arAging["91+"] = _pdfNum(m[1]);
    if ((m = line.match(/\bRetention\s+([\d,]+\.?\d*)/))) arAging["retention"] = _pdfNum(m[1]);
  }

  // ── Write to state.project ──
  if (!state.project) state.project = {};
  if (jobNumber)        state.project.jobNumber        = jobNumber;
  if (jobDesc)          state.project.projectName      = jobDesc;
  if (pm)               state.project.pm               = pm;
  if (customer)         state.project.customer         = customer;
  if (department)       state.project.department       = department;
  if (contractAmount)   state.project.contractAmount   = contractAmount;
  if (origAmt)          state.project.originalContract = origAmt;
  if (approvedCOs)      state.project.approvedCOs      = approvedCOs;
  if (pendingCOs)       state.project.pendingCOs       = pendingCOs;
  if (retainagePct)     state.project.retainagePct     = retainagePct;
  if (startM)           state.project.startDate        = _pdfDateStr(startM[1]);
  if (estCompM)         state.project.estCompleteDate  = _pdfDateStr(estCompM[1]);
  if (contractStatusM)  state.project.contractStatus   = contractStatusM[1];
  if (throughMo)        state.project.throughMonth      = throughMo;
  if (pctComplete)      state.project.pctComplete      = pctComplete;
  if (billedToDate)     state.project.billedToDate     = billedToDate;
  if (earnedToDate)     state.project.earnedToDate     = earnedToDate;

  // Cash flow
  if (cashCollected || netCashFlow) {
    state.project.cashFlow = {
      billed: cashBilled, collected: cashCollected, balance: cashBalance,
      paidOut: cashPaidOut, netCashFlow: netCashFlow
    };
  }

  // AR Aging
  if (Object.keys(arAging).length) state.project.arAging = arAging;

  // Labor metrics
  if (estHours || jtdHours) {
    state.project.labor = {
      estimatedHours: estHours, jtdHours: jtdHours,
      estimatedRate: estLaborRate, actualRate: actLaborRate
    };
  }

  // Projected profit/margin
  if (projProfit)    state.project.projectedProfit  = projProfit;
  if (projMarginPct) state.project.projectedMargin  = projMarginPct;

  // ── Cost type rows ──
  // PDF.js format: "1    Labor  64,798.65  0.00  92,795.82  92,795.82  0.00  100.0%  0.00  0.00"
  const ctMap = {1:"ct1",2:"ct2",3:"ct3",4:"ct4",5:"ct5",6:"ct6",7:"ct7",12:"ct12",29:"ct29"};
  if (!Array.isArray(state.costs)) state.costs = blankCosts();

  let ctCount = 0;
  for (const line of lines) {
    const m = line.match(/^(\d+)\s+[A-Za-z].+?\s+([\d,]+\.?\d*)\s+([\d,]+\.?\d*)\s+([\d,]+\.?\d*)\s+[\d,]+\.?\d*\s+[-\d,]+\.?\d*\s+[\d.]+%\s+([-\d,]+\.?\d*)\s+([-\d,]+\.?\d*)$/);
    if (!m) continue;
    const key = ctMap[parseInt(m[1])];
    if (!key) continue;
    const row = state.costs.find(r => r.id === key);
    if (!row) { console.warn("[PlanWise] 1910: no row found for", key); continue; }
    row.estimated     = _pdfNum(m[2]);
    row.estimatedLocked = true;
    row.mtd           = _pdfNum(m[3]);
    row.jtd           = _pdfNum(m[4]);
    row.openCommitted = _pdfNum(m[5]);
    row.unapprovedAP  = _pdfNum(m[6]);
    ctCount++;
    console.log("[PlanWise] 1910 CT" + m[1] + ":", key, "est=" + row.estimated, "jtd=" + row.jtd);
  }
  }

  // ── Also try to extract Totals row ──
  for (const line of lines) {
    const totM = line.match(/^Totals for Contract\s+[\w-]+\s+([\d,]+\.?\d*)\s+([\d,]+\.?\d*)\s+([\d,]+\.?\d*)\s+([\d,]+\.?\d*)/);
    if (totM) {
      state.project.totalEstimated = _pdfNum(totM[1]);
      state.project.totalJTD       = _pdfNum(totM[3]);
    }
  }

  return `Project Summary imported — ${jobDesc} (${jobNumber}) · ${ctCount} cost types · PM: ${pm}`;
}

// ── 2. JC Committed Cost Detail ──────────────────────────────────────────────
// Actual PDF text patterns:
//   Phase/CT: "95-100- 1 GUC 499kw 2 Material"  or  "92-500- 6 Indirect Labor - Safety 5 IA"
//   PO line:  " 468 CAPITAL PO 20195 / 1 595.24 0.00 0.00 0.00"
//   CT total: "Material Totals 432,684.95 0.00 0.00 0.00"
//   Job total: "Greenville Utilities Totals 834,566.53 0.00 0.00 0.00"
function pdfImportJCCommittedCost(lines, filename) {
  const ctLineMap = {1:"ct1",2:"ct2",3:"ct3",4:"ct4",5:"ct5",6:"ct6",7:"ct7",8:"ct8",9:"ct9",12:"ct12",29:"ct29"};
  const ctNameMap = {
    "Material":"ct2","Subcontractor":"ct3","Equipment":"ct4","Labor":"ct1",
    "Administrative Cost":"ct6","Indirect Allocations":"ct5","Vehicle":"ct7",
    "Direct Allocation":"ct29","Safety Supplies":"ct12",
    // Abbreviations that may appear in phase headers
    "M":"ct2","S":"ct3","E":"ct4","L":"ct1","AC":"ct6","IA":"ct5","V":"ct7","DA":"ct29","SS":"ct12"
  };

  const poMap = {};
  let currentCTNum = 0;
  let currentCTName = "";
  let currentCTLineId = "";
  const ctOpenCommitted = {};

  let prevLine = "";
  for (const line of lines) {
    // Also handles "92-500- 6 Indirect Labor - Safety 5 IA"
    // Pattern: starts with phase code, ends with CT number + CT name/abbreviation
    const phaseM = line.match(/^\s*\d{2}-\d{3}-\s*\d+\s+.+?\s+(\d+)\s+(Material|Subcontractor|Equipment|Labor|Administrative Cost|Indirect Allocations|Vehicle|Direct Allocation|Safety Supplies|M|S|E|L|AC|IA|V|DA|SS)\s*$/i);
    if (phaseM) {
      currentCTNum = parseInt(phaseM[1]);
      currentCTName = phaseM[2];
      currentCTLineId = ctLineMap[currentCTNum] || "";
      continue;
    }

    // ── CT subtotal: PDF.js outputs amount on one line, then label on next ──
    // Line N:   "432,684.95 0.00 0.00 0.00"
    // Line N+1: "Material Totals"
    // Also try old format: "Material Totals 432,684.95 ..." (label + amount same line)
    const totM = line.match(/^(Material|Subcontractor|Equipment|Labor|Administrative Cost|Indirect Allocations|Vehicle|Direct Allocation|Safety Supplies)\s+Totals?\s+([-\d,]+\.?\d*)/i);
    if (totM) {
      const ctKey = ctNameMap[totM[1]];
      if (ctKey) {
        const amt = _pdfNum(totM[2]);
        ctOpenCommitted[ctKey] = (ctOpenCommitted[ctKey] || 0) + amt;
      }
      continue;
    }
    // Check if this is a "Name Totals" line with no amount — look at PREVIOUS line for amount
    const totLabelM = line.match(/^(Material|Subcontractor|Equipment|Labor|Administrative Cost|Indirect Allocations|Vehicle|Direct Allocation|Safety Supplies)\s+Totals?\s*$/i);
    if (totLabelM && prevLine) {
      const prevAmtM = prevLine.match(/^([-\d,]+\.\d{2})\s/);
      if (prevAmtM) {
        const ctKey = ctNameMap[totLabelM[1]];
        if (ctKey) {
          ctOpenCommitted[ctKey] = (ctOpenCommitted[ctKey] || 0) + _pdfNum(prevAmtM[1]);
        }
      }
      continue;
    }

    // ── PO line: " 468 CAPITAL PO 20195 / 1 595.24 0.00 0.00 0.00" ──
    // Also: " 100002 CHINT PO 24-001004 / 1 32,825.00 0.00 0.00 0.00"
    // Vendor code can be up to 6 digits, vendor name is truncated uppercase
    const poM = line.match(/\bPO\s+([\w-]+)\s*\/\s*\d+\s+([-\d,]+\.?\d*)/i);
    if (poM) {
      const poNum = poM[1];
      const amount = _pdfNum(poM[2]);
      if (!poMap[poNum]) {
        // Extract vendor name from beginning of line: " 468 CAPITAL PO ..."
        const vendM = line.match(/^\s*(\d+)\s+([A-Z][A-Z0-9\s&,.'+-]*?)\s+PO\s/i);
        const vendorCode = vendM ? vendM[1] : "";
        const vendorName = vendM ? vendM[2].trim() : "";
        poMap[poNum] = {
          costTypeNum: currentCTNum, costType: currentCTName,
          costLineId: currentCTLineId, total: 0,
          vendorCode, vendorName
        };
      }
      poMap[poNum].total += amount;
    }
    prevLine = line;
  }

  // Write openCommitted totals to state.costs
  if (!Array.isArray(state.costs)) state.costs = blankCosts();
  let ctUpdated = 0;
  console.log("[PlanWise] JC Committed ctOpenCommitted:", ctOpenCommitted);
  for (const [ctKey, amt] of Object.entries(ctOpenCommitted)) {
    const row = state.costs.find(r => r.id === ctKey);
    if (row) { row.openCommitted = amt; ctUpdated++; }
  }

  if (!state.purchaseOrders) state.purchaseOrders = [];
  let updated = 0, added = 0;

  for (const [poNum, data] of Object.entries(poMap)) {
    const existing = state.purchaseOrders.find(p => p.poNumber === poNum);
    if (existing) {
      existing.costLineId = data.costLineId;
      existing.costType   = data.costType;
      // Fill in vendor if currently missing
      if (!existing.vendor && data.vendorName) existing.vendor = data.vendorName;
      updated++;
    } else {
      state.purchaseOrders.push({
        id:             uid(),
        poNumber:       poNum,
        vendor:         data.vendorName || "",
        description:    `PO ${poNum}`,
        originalAmount: data.total,
        adjustedAmount: data.total,
        orderDate:      "",
        status:         "Closed",
        costLineId:     data.costLineId,
        costType:       data.costType,
        invoices:       [],
        importedVia:    "vista-committed-pdf",
      });
      added++;
    }
  }

  return `JC Committed Cost imported — ${ctUpdated} cost types (open committed), ${Object.keys(poMap).length} POs (${updated} updated, ${added} added)`;
}

// ── 3. PO Purchase Orders by Job ─────────────────────────────────────────────
// Actual PDF text format:
// "20195 GUC Fence Grounding Material 468 CAPITAL ELECTRIC 595.24 595.24 595.24 0.00 0.00"
// "24-001002 Engineering 3143 SOLPHI ENGINEERING PLLC 40,000.00 40,000.00 40,000.00 0.00 0.00"
// "24-001007 SEG 585W Modules 2660 SEG SOLAR INC 190,045.44 0.00 0.00 0.00 0.00"
function pdfImportPOByJob(lines, filename) {
  console.log("[PlanWise] pdfImportPOByJob — parsing", lines.length, "lines");
  if (!state.purchaseOrders) state.purchaseOrders = [];
  let added = 0, updated = 0;

  // Extract job number from header
  let jobNumber = "";
  for (const line of lines) {
    const jm = line.match(/^Job:\s*([\w-]+)/i);
    if (jm) { jobNumber = jm[1]; break; }
  }

  for (const line of lines) {
    // Skip headers, totals, and footer lines
    const firstWord = line.split(/\s+/)[0];
    if (/^(PO|Jobs|Total|Job|Sales|Axis|Page|Date|Purchase|Order|Vendor|Due)/i.test(firstWord)) continue;
    if (!firstWord || !/\d/.test(firstWord)) continue;
    // Skip page footer lines like "3 Axis Energy Inc Page 2"
    if (/\bPage\s+\d+/i.test(line)) continue;
    if (/\brpt\b/i.test(line) || /Date Format/i.test(line)) continue;

    // Find all decimal numbers (amounts like "40,000.00" or "595.24")
    const numPat = /[\d,]+\.\d{2}/g;
    const allNums = [];
    let nm;
    while ((nm = numPat.exec(line)) !== null) allNums.push({ val: _pdfNum(nm[0]), idx: nm.index });
    if (allNums.length < 3) continue;

    // Text before first amount = "PO# desc vendorCode vendorName"
    const beforeAmts = line.slice(0, allNums[0].idx).trim();
    const orderCost  = allNums[0].val;
    const invoiced   = allNums.length >= 2 ? allNums[1].val : 0;
    const paid       = allNums.length >= 3 ? allNums[2].val : 0;
    const tokens     = beforeAmts.split(/\s+/);
    const poNumber   = tokens[0];
    if (!poNumber || poNumber.length < 4) continue;

    // Vendor detection: find LAST "digits UPPERCASE" pattern in beforeAmts
    // e.g. "20195 GUC Fence Grounding Material 468 CAPITAL ELECTRIC"
    //   → vendor code = 468, vendor = "CAPITAL ELECTRIC"
    // Use GREEDY .* to skip past PO# and description to the vendor code
    // Also handles "Grounding468 CAPITAL ELECTRIC" (glued vendor code)
    const vendM = beforeAmts.match(/^.*\b(\d{2,6})\s+([A-Z][A-Z0-9\s,./&+()'-]+?)$/);
    let vendor = "", description = "";
    if (vendM) {
      vendor = vendM[2].trim();
      // Description is everything between PO# and vendor code
      const vendCodeStr = vendM[1];
      const vendStart = beforeAmts.lastIndexOf(vendCodeStr);
      description = beforeAmts.slice(poNumber.length, vendStart).trim()
                    .replace(/[-\s]+$/, "").trim();
    } else {
      description = tokens.slice(1).join(" ").trim();
    }

    const result = _mergePOIntoState({
      poNumber:       poNumber,
      vendor:         vendor,
      description:    description || `PO ${poNumber}`,
      originalAmount: orderCost,
      adjustedAmount: orderCost,
      jobNumber:      jobNumber,
    });
    if (result === "added") added++; else updated++;
  }

  console.log("[PlanWise] PO List result: added=", added, "updated=", updated, "total state POs=", state.purchaseOrders.length);
  return `PO List imported — ${added + updated} POs (${added} added, ${updated} updated)`;
}

// ── 4. PO Purchase Order Status Report ───────────────────────────────────────
// Actual PDF text structure per PO block:
//   "PO: 24-001022 BOS UG material Status: Closed Order Date: 05/15/25 Expected Date: 05/19/25"
//   " 977.12 0.00 0.00 977.12 977.12 977.12 0.00 0.00"   (8 amounts: Orig,Change,Tax,Adj,Invoiced,Paid,Unpaid,Remaining)
//   "Vendor: 387 BORDER STATES INDUSTRIES INC."
//   "PO Item: 1 BOS UG material"
//   "Job: 24-001 Greenville Utilities"
//   "JC Co: 3 Job: 24-001 Phase: 95-100- 1 JC Cost Type: 2"
//   AP Invoice/Payment History section...
//   PO Change Order History section...
function pdfImportPOStatusReport(lines, filename) {
  if (!state.purchaseOrders) state.purchaseOrders = [];
  let added = 0, updated = 0;

  const allText = lines.join("\n");

  // Split into PO blocks — each starts with "PO: "
  const poBlocks = allText.split(/(?=\nPO:\s+[\w-]+)/);

  for (const block of poBlocks) {
    // PO header: "PO: 24-001022 BOS UG material Status: Closed Order Date: 05/15/25"
    // Also handle "Expected Date: MM/DD/YY" or empty Expected Date
    const headerM = block.match(/PO:\s+([\w-]+)\s+(.+?)\s+Status:\s*(\w+)\s+Order Date:\s*(\d{2}\/\d{2}\/\d{2,4})/i);
    if (!headerM) continue;

    const poNumber  = headerM[1].trim();
    const poDesc    = headerM[2].trim();
    const poStatus  = headerM[3].trim();
    const orderDate = _pdfDateStr(headerM[4]);

    // Vendor: "Vendor: 387 BORDER STATES INDUSTRIES INC."
    const vendorM = block.match(/Vendor:\s*(\d+)\s+(.+)/i);
    const vendor  = vendorM ? vendorM[2].trim() : "";

    // Amounts row: 8 numbers on one line (PO-level totals, first occurrence)
    // Cols: OrigCost, ChangeCost, Tax, AdjCost(w/Tax), Invoiced+Disc, Paid, Unpaid, Remaining
    let origAmt = 0, changeAmt = 0, adjustedAmt = 0, invoicedAmt = 0, paidAmt = 0;
    const blockLines = block.split("\n").map(l => l.trim()).filter(Boolean);
    for (const bl of blockLines) {
      const am = bl.match(/^([-\d,]+\.?\d*)\s+([-\d,]+\.?\d*)\s+([-\d,]+\.?\d*)\s+([-\d,]+\.?\d*)\s+([-\d,]+\.?\d*)\s+([-\d,]+\.?\d*)\s+([-\d,]+\.?\d*)\s+([-\d,]+\.?\d*)$/);
      if (am) {
        origAmt     = _pdfNum(am[1]);
        changeAmt   = _pdfNum(am[2]);
        adjustedAmt = _pdfNum(am[4]);
        invoicedAmt = _pdfNum(am[5]);
        paidAmt     = _pdfNum(am[6]);
        break;
      }
    }

    // Cost type from "JC Cost Type: 2"
    let costLineId = "";
    const ctM = block.match(/JC Cost Type:\s*(\d+)/i);
    if (ctM) {
      const ctMap = {1:"ct1",2:"ct2",3:"ct3",4:"ct4",5:"ct5",6:"ct6",7:"ct7",12:"ct12",29:"ct29"};
      costLineId = ctMap[parseInt(ctM[1])] || "";
    }

    // Phase from "Phase: 95-100- 1"
    const phaseM = block.match(/Phase:\s*([\d-]+\s*\d*)/i);
    const phase = phaseM ? phaseM[1].trim() : "";

    // AP Invoices — "Mth Trans Ref 0 Date Amount ..."
    // Line=0 rows: "05/25 84 930423353 0 05/20/25 952.89 0.00 0.00 0.00"
    const invoices = [];
    const invRe = /(\d{2}\/\d{2})\s+(\d+)\s+(\S+)\s+0\s+(\d{2}\/\d{2}\/\d{2})\s+([-\d,]+\.?\d*)/g;
    let invM;
    while ((invM = invRe.exec(block)) !== null) {
      const amt = _pdfNum(invM[5]);
      if (amt === 0) continue; // skip zero-amount entries
      const inv = {
        id:           uid(),
        number:       invM[3],
        dateReceived: _pdfDateStr(invM[4]),
        dateApproved: "",
        datePaid:     "",
        amount:       amt,
        description:  "",
        source:       "vista-po-status",
      };
      // Look for matching payment row (same trans#, Line=1)
      const payRe = new RegExp(String.raw`${invM[1]}\s+${invM[2]}\s+${invM[3].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\s+1\s+\S+\s+(\d{2}\/\d{2})\s+(\d{2}\/\d{2}\/\d{2})\s+\S+\s+([-\d,]+\.?\d*)`);
      const payM = block.match(payRe);
      if (payM) inv.datePaid = _pdfDateStr(payM[2]);
      invoices.push(inv);
    }

    // PO Change Order History — "Mth Trans Description ChangeOrderCost BOCost"
    // e.g. "09/25 15 PO Close for PO Item Line: 1 -254.58 -254.58"
    const changeOrders = [];
    const coRe = /(\d{2}\/\d{2})\s+(\d+)\s+(.+?)\s+([-\d,]+\.\d{2})\s+([-\d,]+\.\d{2})\s*$/gm;
    let coM;
    while ((coM = coRe.exec(block)) !== null) {
      // Skip if this is inside AP Invoice section (has "AP" prefix patterns)
      if (/^\d{2}\/\d{2}\s+\d+\s+\S+\s+[01]\s/.test(coM[0])) continue;
      changeOrders.push({
        month: coM[1], description: coM[3].trim(),
        amount: _pdfNum(coM[4])
      });
    }

    const result = _mergePOIntoState({
      poNumber,  vendor,  description: poDesc,
      originalAmount: origAmt,
      adjustedAmount: adjustedAmt || (origAmt + changeAmt),
      orderDate,  status: poStatus,  costLineId,
      invoices,
    });
    if (result === "added") added++; else updated++;
  }

  return `PO Status Report imported — ${added + updated} POs (${added} added, ${updated} updated)`;
}

// ── 5. JC Detail ─────────────────────────────────────────────────────────────
// Accumulates "Total for Cost Type: N  0.000  0.00  AMOUNT" lines across all phases.
// Both 95-xxx (direct) and 92-xxx (overhead) phases contribute to their CT totals.
// Handles negative amounts (e.g. reversals: -1,883.47).
function pdfImportJCDetail(lines, filename) {
  console.log("[PlanWise] pdfImportJCDetail — parsing", lines.length, "lines");
  if (!Array.isArray(state.costs)) state.costs = blankCosts();

  const ctMap = {1:"ct1",2:"ct2",3:"ct3",4:"ct4",5:"ct5",6:"ct6",7:"ct7",12:"ct12",29:"ct29"};
  const ctTotals = {};

  for (const line of lines) {
    // Primary: "Total for Cost Type: 5  0.000  0.00  11,516.15"
    // Expects: units, hours, cost in that order after CT number
    let m = line.match(/^Total for Cost Type:\s*(\d+)\s+[-\d,.]+\s+[-\d,.]+\s+([-\d,]+\.?\d*)/i);
    // Fallback: just CT number + last dollar amount on line
    if (!m) m = line.match(/^Total for Cost Type:\s*(\d+).*\s([-\d,]+\.\d{2})$/i);
    if (m) {
      const key = ctMap[parseInt(m[1])];
      if (key) {
        const amt = _pdfNum(m[2]);
        ctTotals[key] = (ctTotals[key] || 0) + amt;
        console.log("[PlanWise] JC Detail matched:", line.slice(0,80), "→", key, amt);
      }
    }
  }

  let ctCount = 0;
  console.log("[PlanWise] JC Detail ctTotals:", ctTotals);
  for (const [key, total] of Object.entries(ctTotals)) {
    const row = state.costs.find(r => r.id === key);
    if (row) { row.jtd = total; ctCount++; }
    else { console.warn("[PlanWise] JC Detail: no cost row found for key", key); }
  }

  return `JC Detail imported — ${ctCount} cost types updated with JTD actuals`;
}

// ── Axis Energy PO import helper (preserved from v2.0.1) ─────────────────────
function _importAxisPOParsed(parsed, filename) {
  const existing = (state.purchaseOrders || []).find(p => p.poNumber === parsed.poNumber && parsed.poNumber);
  if (existing) {
    Object.assign(existing, {
      vendor:         parsed.vendor        || existing.vendor,
      description:    parsed.description   || existing.description,
      originalAmount: parsed.amount        || existing.originalAmount,
      adjustedAmount: parsed.amount        || existing.adjustedAmount,
      orderDate:      parsed.orderDate     || existing.orderDate,
      jobNumber:      parsed.jobNumber     || existing.jobNumber,
      shipTo:         parsed.shipTo        || existing.shipTo,
      sourceFile: filename, importedVia: "axis-pdf",
    });
    return `Updated PO ${parsed.poNumber} — ${parsed.vendor} — ${fmt$(parsed.amount)}`;
  }
  if (!state.purchaseOrders) state.purchaseOrders = [];
  state.purchaseOrders.push({
    id: uid(), poNumber: parsed.poNumber, vendor: parsed.vendor,
    description: parsed.description, originalAmount: parsed.amount,
    adjustedAmount: parsed.amount, orderDate: parsed.orderDate,
    jobNumber: parsed.jobNumber, shipTo: parsed.shipTo,
    orderedBy: "", invoices: [],
    sourceFile: filename, importedVia: "axis-pdf",
  });
  return `Imported PO ${parsed.poNumber} — ${parsed.vendor} — ${fmt$(parsed.amount)}`;
}


function classifyAndImportWorkbook(wb, nameLower, originalName) {
  const sheets = wb.SheetNames;
  let imported = [];
  
  // ── VIEWPOINT VISTA detection — check filename and content signatures ──
  const vpResult = tryViewpointImport(wb, nameLower, originalName);
  if (vpResult) {
    logActivity("import", "import", "Viewpoint Vista Import", vpResult);
    return vpResult;
  }

  for (const sn of sheets) {
    const ws = wb.Sheets[sn];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});
    if (rows.length < 2) continue;
    
    const flatText = rows.slice(0,5).flat().join(" ").toLowerCase();
    const headerRow = rows[0].map(c=>String(c).toLowerCase());
    
    // Spec Exceptions detection
    if (flatText.includes("variance request") || flatText.includes("spec") && flatText.includes("exception") || 
        headerRow.some(h=>h.includes("variance")) || flatText.includes("justification")) {
      importSpecExceptions(rows, sn);
      imported.push("Spec Exceptions");
      continue;
    }
    
    // Subcontractor / Scope Tracker detection
    if (flatText.includes("pwa") || flatText.includes("rfp sent") || flatText.includes("pricing received") ||
        (flatText.includes("company") && flatText.includes("contact") && (flatText.includes("union") || flatText.includes("quote")))) {
      importSubcontractors(rows, sn);
      imported.push("Subcontractors (" + sn + ")");
      continue;
    }
    
    // RFI Log detection
    if (flatText.includes("rfi") && (flatText.includes("question") || flatText.includes("response"))) {
      importRFIs(rows);
      imported.push("RFIs");
      continue;
    }
    
    // Invoice / PO detection
    if (flatText.includes("invoice") && (flatText.includes("po") || flatText.includes("purchase order") || flatText.includes("vendor"))) {
      importInvoicePO(rows, sn);
      imported.push("Invoices/POs");
      continue;
    }
    
    // Submittal Log detection
    if (flatText.includes("submittal") && (flatText.includes("upload") || flatText.includes("review status") || flatText.includes("approved"))) {
      importSubmittals(rows);
      imported.push("Submittals");
      continue;
    }
    
    // Change Order detection
    if (flatText.includes("change order") || (flatText.includes("co #") && flatText.includes("amount"))) {
      importChangeOrders(rows);
      imported.push("Change Orders");
      continue;
    }
    
    // Schedule / Gantt detection
    if (flatText.includes("predecessor") || flatText.includes("outline level") ||
        (flatText.includes("task") && flatText.includes("start") && flatText.includes("finish")) ||
        (flatText.includes("task name") && flatText.includes("duration")) ||
        (sn.toLowerCase().includes("schedule") || sn.toLowerCase().includes("gantt"))) {
      importScheduleXLSX(rows, sn);
      imported.push("Schedule (" + sn + ")");
      continue;
    }
    
    // Job Setup Breakdown
    if ((flatText.includes("budget breakdown") || flatText.includes("base contract value") || flatText.includes("cost types")) &&
        (flatText.includes("subtotal") || flatText.includes("indirect") || flatText.includes("subcontractor"))) {
      const result = importJobSetupBreakdown(rows);
      if (result) { imported.push("Budget Breakdown (" + sn + ")"); continue; }
    }
    // Cost Breakdown detection
    if (flatText.includes("budget") && flatText.includes("actual") && (flatText.includes("committed") || flatText.includes("forecast"))) {
      importCostBreakdown(rows, sn);
      imported.push("Costs (" + sn + ")");
      continue;
    }
    
    // Project Overview detection
    if (flatText.includes("job #") || flatText.includes("project name") || flatText.includes("contract amount")) {
      importProjectOverview(rows);
      imported.push("Project Overview");
      continue;
    }
  }
  
  if (imported.length) {
    logActivity("import", "import", "Imported from file", imported.join(", "));
    return imported.join(", ");
  }
  return null; // caller shows warning
}

// ═══════════════════════════════════════════════════════
// VIEWPOINT VISTA IMPORT ENGINE
// Handles 6 standard Viewpoint export report types:
//  1. Job Cost Detail Main Page  → Cost Breakdown + Project Overview
//  2. Job Cost Detail            → Cost line actuals (detailed)
//  3. Contract Control Sheet     → Change Orders
//  4. Open Commitments           → Purchase Orders
//  5. AR Aging                   → Pay Applications / Invoices
//  6. AP Unapproved Invoices     → AP Invoice tracker
// ═══════════════════════════════════════════════════════

function tryViewpointImport(wb, nameLower, originalName) {
  const ws0 = wb.Sheets[wb.SheetNames[0]];
  if (!ws0) return null;
  const rows = XLSX.utils.sheet_to_json(ws0, {header:1, defval:""});
  const topText = rows.slice(0,8).flat().map(v=>String(v)).join(" ").toLowerCase();

  // Detect which Viewpoint report this is
  if (topText.includes("custom jc contract cost report") || topText.includes("summary page") ||
      (topText.includes("contract costs to date") && topText.includes("estimated"))) {
    return vpImportJobCostMain(rows);
  }
  if (topText.includes("jc detail") || (nameLower.includes("job_cost_detail") && !nameLower.includes("main"))) {
    return vpImportJobCostDetail(rows);
  }
  if (topText.includes("contract control sheet") || topText.includes("pco") && topText.includes("aco") && topText.includes("approved")) {
    return vpImportContract(rows);
  }
  if (topText.includes("open committments") || topText.includes("open commitments")) {
    return vpImportCommitments(rows);
  }
  if (topText.includes("ar aged") || topText.includes("ar aging") || topText.includes("aged analysis")) {
    return vpImportARaging(rows);
  }
  if (topText.includes("ap unapproved") || topText.includes("unapproved invoices")) {
    return vpImportAPUnapproved(rows);
  }
  return null;
}

// ── Helper: parse Excel serial date or date string ──
function vpDate(v) {
  if (!v && v !== 0) return "";
  const n = parseFloat(v);
  if (!isNaN(n) && n > 30000 && n < 50000) {
    // Excel serial date — manual conversion (SheetJS not available here)
    const d = new Date((n - 25569) * 86400 * 1000);
    return d.toISOString().split("T")[0];
  }
  const s = String(v).trim();
  if (s.match(/^\d{4}-\d{2}-\d{2}$/)) return s;
  const parsed = new Date(s);
  if (!isNaN(parsed)) return parsed.toISOString().split("T")[0];
  return "";
}

// ── Helper: find text in rows array ──
function vpFindText(rows, text, maxRow=30) {
  for (let r=0; r<Math.min(rows.length, maxRow); r++) {
    for (let c=0; c<rows[r].length; c++) {
      if (String(rows[r][c]).toLowerCase().includes(text.toLowerCase())) return {r,c,v:rows[r][c]};
    }
  }
  return null;
}

function vpCellNear(rows, r, c, offset=1) {
  const row = rows[r];
  if (!row) return "";
  // Look right from c for the next non-empty cell
  for (let i=c+1; i<Math.min(c+offset+10, row.length); i++) {
    if (String(row[i]).trim()) return String(row[i]).trim();
  }
  return "";
}

function vpNum(v) { return parseFloat(String(v).replace(/[$,]/g,'')) || 0; }

// ─────────────────────────────────────────────────────────
// 1. JOB COST DETAIL MAIN PAGE → Cost Breakdown + Project Overview
// ─────────────────────────────────────────────────────────
function vpImportJobCostMain(rows) {
  const p = state.project;

  // Extract project info
  for (let r=0; r<Math.min(rows.length,25); r++) {
    const row = rows[r];
    const flat = row.map(v=>String(v)).join(" ");
    if (flat.includes("Contract Descript")) {
      // Extract the project name from the cell adjacent to the label
      for (let c=0; c<row.length; c++) {
        if (String(row[c]).includes("Contract Descript")) {
          const next = vpCellNear(rows, r, c, 4);
          if (next && next.length > 2) p.projectName = next;
        }
      }
    }
    if (flat.includes("Cust Name:")) {
      for (let c=0; c<row.length; c++) {
        if (String(row[c]).includes("Cust Name:")) {
          p.customer = vpCellNear(rows, r, c, 3);
        }
      }
    }
    if (flat.includes("Project Mg")) {
      for (let c=0; c<row.length; c++) {
        if (String(row[c]).includes("Project Mg")) {
          const pm = vpCellNear(rows, r, c, 5);
          if (pm && pm.length > 2) p.pm = pm;
        }
      }
    }
  }

  // Extract contract + billing amounts — scan entire header block
  // Viewpoint Vista JC Contract Cost Report has a "Contract Progress" panel with these labels
  for (let r = 0; r < Math.min(rows.length, 60); r++) {
    const row  = rows[r];
    const flat = row.map(v=>String(v)).join(" ");
    const flatL = flat.toLowerCase();
    const nums  = row.map(v=>vpNum(v)).filter(n=>n > 0);

    if (flatL.includes("original contract") && !flatL.includes("revised")) {
      if (nums.length) p.contractAmount = nums[nums.length-1] || p.contractAmount;
    }
    if (flatL.includes("approved change ord") || flatL.includes("approved co")) {
      if (nums.length) p.approvedCOsTotal = nums[nums.length-1];
    }
    if (flatL.includes("revised contract") || flatL.includes("current contract")) {
      if (nums.length) p.revisedContractAmount = nums[nums.length-1];
    }
    if (flatL.includes("billed to date") || flatL.includes("total billed") || flatL.includes("invoiced to date")) {
      if (nums.length) p.billedToDate = nums[nums.length-1];
    }
    if (flatL.includes("collected") && (flatL.includes("to date") || flatL.includes("received"))) {
      if (nums.length) p.collectedToDate = nums[nums.length-1];
    }
    if (flatL.includes("retainage") && !flatL.includes("release")) {
      const retNums = row.map(v=>vpNum(v)).filter(n=>n > 100);
      if (retNums.length) p.retainageBalance = retNums[retNums.length-1];
    }
  }

  // ── Cost breakdown section ──
  // Map Viewpoint CT numbers / label keywords → standard CT keys
  const CT_NUM_MAP = {1:"ct1",2:"ct2",3:"ct3",4:"ct4",5:"ct5",6:"ct6",7:"ct7",12:"ct12",29:"ct29"};
  const CT_KEYWORD_MAP = [
    ["labor",      "ct1"],["material",     "ct2"],["subcontract",  "ct3"],
    ["equipment",  "ct4"],["indirect",      "ct5"],["admin",         "ct6"],
    ["vehicle",    "ct7"],["safety",        "ct12"],["direct alloc","ct29"],
  ];

  // Ensure costs array is initialised
  if (!Array.isArray(state.costs)) state.costs = blankCosts();

  for (let r=0; r<rows.length; r++) {
    const row = rows[r];
    const flat = row.map(v=>String(v)).join(" ").toLowerCase();
    if (!flat.includes("estimated") || !flat.includes("job to date")) continue;

    // Detect column positions
    let colEst=-1, colMTD=-1, colJTD=-1, colCommit=-1, colUnapAP=-1;
    row.forEach((v,i)=>{
      const s=String(v).toLowerCase();
      if (s.includes("estimated"))                               colEst=i;
      else if (s.includes("month to date") || s.includes("mtd")) colMTD=i;
      else if (s.includes("job to date")   || s.includes("jtd")) colJTD=i;
      else if (s.includes("unapproved")    || s.includes("unap")) colUnapAP=i;
      else if (s.includes("committed")     || s.includes("open")) colCommit=i;
    });
    if (colEst<0 || colJTD<0) continue;

    for (let dr=r+1; dr<Math.min(r+25, rows.length); dr++) {
      const drow = rows[dr];
      const rawLabel = String(drow[7]||drow[8]||drow[6]||drow[0]||drow[1]||drow[2]||"").trim();
      const label    = rawLabel.toLowerCase();
      if (!label || label.includes("total") || label.includes("recap")) break;

      // Try to match by leading CT number first (e.g. "1    Labor", "29    Direct Allocation")
      const numMatch = rawLabel.match(/^(\d+)\s+/);
      let ctKey = null;
      if (numMatch) {
        ctKey = CT_NUM_MAP[+numMatch[1]];
      }
      // Fallback to keyword match
      if (!ctKey) {
        for (const [kw, k] of CT_KEYWORD_MAP) {
          if (label.includes(kw)) { ctKey = k; break; }
        }
      }
      if (!ctKey) continue;

      const estimated    = colEst>=0    ? vpNum(drow[colEst])    : 0;
      const mtd          = colMTD>=0    ? vpNum(drow[colMTD])    : 0;
      const jtd          = colJTD>=0    ? vpNum(drow[colJTD])    : 0;
      const openCommitted= colCommit>=0 ? vpNum(drow[colCommit]) : 0;
      const unapprovedAP = colUnapAP>=0 ? vpNum(drow[colUnapAP]) : 0;

      if (!estimated && !jtd && !openCommitted) continue;

      const row2 = state.costs.find(x=>x.id===ctKey);
      if (row2) {
        // Estimated: only update if not already locked, then lock it
        if (!row2.estimatedLocked && estimated > 0) {
          row2.estimated = estimated;
          row2.estimatedLocked = true;
        } else if (row2.estimatedLocked && estimated > 0) {
          // Already locked — update only if coming from Viewpoint (always re-set from authoritative source)
          row2.estimated = estimated;
        }
        row2.estimatedLocked = true;
        row2.mtd           = mtd;
        row2.jtd           = jtd;
        row2.openCommitted = openCommitted;
        row2.unapprovedAP  = unapprovedAP;
      }
    }
    break;
  }

  return "Job Cost Summary → Cost Breakdown, Project Info";
}

// ─────────────────────────────────────────────────────────
// 2. JOB COST DETAIL → Detailed cost actuals (skip — too granular)
// ─────────────────────────────────────────────────────────
function vpImportJobCostDetail(rows) {
  // Parse "Total for Cost Type: X | [hours] | amount" summary rows.
  // Only collect totals from the main EPC phase (95-xxx); skip overhead 92-xxx.
  const CODE_MAP = { 1:"labor", 2:"material", 3:"subs", 4:"equipment", 5:"indirectLabor", 6:"admin", 29:"admin" };
  const PHASE_RE = /9[25]-\d{3}/;   // matches 95-xxx and 92-xxx
  const MAIN_RE  = /95-\d{3}/;      // main project phase
  const TYPE_RE  = /total for cost type:\s*(\d+)/i;

  let inMainPhase = false;
  const actuals = {}; // catKey → total actual dollars

  for (const row of rows) {
    const flat = row.map(v=>String(v||"")).join(" ");
    // Detect phase section header — update inMainPhase flag
    if (PHASE_RE.test(flat) && flat.length < 120) {
      inMainPhase = MAIN_RE.test(flat);
      continue;
    }
    if (!inMainPhase) continue;
    const tm = flat.match(TYPE_RE);
    if (!tm) continue;
    const typeCode = parseInt(tm[1]);
    const catKey = CODE_MAP[typeCode];
    if (!catKey) continue;
    // Last numeric value in the row is the dollar total
    const nums = row.map(v=>parseFloat(v)).filter(n=>!isNaN(n)&&n>0);
    if (!nums.length) continue;
    const dollars = nums[nums.length-1];
    actuals[catKey] = (actuals[catKey]||0) + dollars;
  }

  if (!Object.keys(actuals).length) return "Job Cost Detail (no cost type totals found)";

  // Merge actuals into state.costs flat CT array
  // actuals keys are old catKeys — map them to CT keys
  const DETAIL_CT_MAP = {labor:"ct1",material:"ct2",subs:"ct3",equipment:"ct4",
    indirectLabor:"ct5",indirect:"ct5",admin:"ct6",vehicle:"ct7",safety:"ct12",direct:"ct29"};
  for (const [catKey, total] of Object.entries(actuals)) {
    const ctKey = DETAIL_CT_MAP[catKey] || catKey;
    const row = (state.costs||[]).find(r=>r.id===ctKey);
    if (row) { row.jtd = total; }
  }

  const summary = Object.entries(actuals).map(([k,v])=>`${k}: $${v.toLocaleString("en-US",{maximumFractionDigits:0})}`).join(", ");
  return `Job Cost Detail Actuals imported — ${summary}`;
}


// ─────────────────────────────────────────────────────────
// JOB SETUP BREAKDOWN XLSX → Cost Breakdown budget lines
// Format: Category header → line items → Subtotal rows
// ─────────────────────────────────────────────────────────
function importJobSetupBreakdown(rows) {
  const CAT_MAP = {
    "indirect labor":       "indirectLabor",
    "indirect allocation":  "indirectLabor",
    "subcontractor":        "subs",
    "material":             "material",
    "equipment":            "equipment",
    "direct allocation":    "admin",
    "admin":                "admin",
    "overhead":             "admin",
    "profit":               "admin",
  };

  // Find columns: col 0 = label, col 1 = value ($)
  let currentCat = null;
  const categories = {}; // catKey → [{name, budget}]
  let projectName = null;
  let contractAmount = null;

  for (const row of rows) {
    const label = String(row[0]||"").trim();
    const val   = parseFloat(row[1]) || 0;
    const labelL = label.toLowerCase();

    if (!label) continue;

    // Project title
    if (labelL.includes("budget breakdown") || labelL.includes("budget")) {
      if (!projectName && label.length > 5 && !labelL.includes("base")) projectName = label;
      continue;
    }
    // Base contract value
    if (labelL.includes("base contract") || labelL.includes("contract value")) {
      if (val > 0) contractAmount = val;
      continue;
    }
    // Skip header row (Cost Types | Value...)
    if (labelL === "cost types") continue;
    // Subtotal — just marks end of section, skip
    if (labelL === "subtotal") continue;

    // Check if this is a category header (no dollar value in col B)
    let matchedCat = null;
    for (const [kw, key] of Object.entries(CAT_MAP)) {
      if (labelL.includes(kw)) { matchedCat = key; break; }
    }
    if (matchedCat && !val) {
      currentCat = matchedCat;
      if (!categories[currentCat]) categories[currentCat] = [];
      continue;
    }

    // Line item — assign to current category
    if (currentCat && label && val > 0) {
      if (!categories[currentCat]) categories[currentCat] = [];
      categories[currentCat].push({ id:uid(), name:label, budget:val, committed:0, actual:0, forecast:val });
    }
  }

  if (!Object.keys(categories).length) return null;

  // Merge into state.costs CT flat array — map old catKey to CT id
  const SETUP_CT_MAP = {labor:"ct1",material:"ct2",subs:"ct3",equipment:"ct4",
    indirectLabor:"ct5",admin:"ct6",vehicle:"ct7"};
  for (const [catKey, lines] of Object.entries(categories)) {
    const ctKey = SETUP_CT_MAP[catKey];
    if (!ctKey) continue;
    const row = (state.costs||[]).find(r=>r.id===ctKey);
    if (row && !row.estimatedLocked) {
      // Sum budget from all lines in this category
      const total = lines.reduce((s,l)=>s+(+l.budget||0),0);
      row.estimated = total;
      row.estimatedLocked = true;
    }
  }

  if (contractAmount && !state.project.contractAmount) state.project.contractAmount = contractAmount;
  if (projectName && !state.project.projectName) state.project.projectName = projectName;

  const cats = Object.keys(categories).join(", ");
  return `Budget Breakdown imported — categories: ${cats}`;
}

// ─────────────────────────────────────────────────────────
// 3. CONTRACT CONTROL SHEET → Change Orders
// Viewpoint Vista layout:
//   - CO header row: col 0=date, col 5=description, col 9=PCO, col 12=ACO, col 17=Total CO Amount
//   - Phase detail rows: same PCO/ACO, col 17 empty, col 38=phase cost
//   - Subtotal row: col 5="Subtotal for OTHER", col 12=ACO, col 38=total cost for CO
// Strategy: use col 17 from the header row for single-phase COs;
//           use col 38 from subtotal rows for multi-phase COs where col 17 is empty.
// ─────────────────────────────────────────────────────────
function vpImportContract(rows) {
  // ── Multi-phase CO parser ──
  // Viewpoint Contract Control Sheet has 3 row types per CO:
  //   1. Header row:   col5=description, col9=PCO, col12=ACO, col13=Cd, col0=date, col3=apprDate
  //                    col17 MAY be blank (multi-phase) or have full amount (single-phase)
  //   2. Phase rows:   same PCO/ACO, col17=phase amount, col38=phase cost — accumulate
  //   3. Subtotal row: col5="Subtotal for OTHER:", col38=total CO cost — finalizes amount
  const cos = [];
  const coMap = {}; // key(aco||pco) → CO object
  let _currentKey = null;
  let _phaseCumulative = 0;  // accumulated col17 from phase rows
  let _subtotalCost = 0;     // col38 from subtotal row

  let foundHeader = false;
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    const flat = row.map(v=>String(v)).join(" ").toLowerCase();

    // Find data header row
    if (!foundHeader) {
      if (flat.includes("description") && (flat.includes("pco") || flat.includes("approved"))) {
        foundHeader = true;
      }
      continue;
    }

    // Skip legend / page-break rows
    if (flat.includes("codes:") || flat.includes("page ") || flat.includes("approved:") && flat.includes("pending:")) continue;

    const descCell = String(row[5]||"").trim();
    const pcoRaw   = String(row[9]||"").trim().replace(/\s+/g,"");
    const acoRaw   = String(row[12]||"").trim().replace(/\s+/g,"");
    const cdRaw    = String(row[13]||"").trim();
    const dateRaw  = vpDate(row[0]);
    const apprRaw  = vpDate(row[3]);
    const col17amt = vpNum(row[17]);
    const col38amt = vpNum(row[38]);

    // Skip completely empty rows
    if (!descCell && !pcoRaw && !acoRaw && !col17amt && !col38amt) continue;
    // Skip grand totals row
    if (flat.includes("grand total") || (flat.includes("total") && !pcoRaw && !acoRaw && !descCell)) continue;

    // ── Subtotal row ──
    // e.g. "Subtotal for OTHER:", col38 = total cost for this CO
    if (descCell.toLowerCase().startsWith("subtotal") && _currentKey) {
      const co = coMap[_currentKey];
      if (co) {
        // Finalize amount: prefer accumulated phase col17, else col38 subtotal cost
        if (co.amountSubmitted === 0) {
          co.amountSubmitted = _phaseCumulative || col38amt || 0;
        }
        // Set approved/pending based on finalized amount
        if (co._cdRaw === "A" || (co.dateApproved && co._cdRaw !== "P")) {
          co.amountApproved = Math.abs(co.amountSubmitted);
          co.amountPending = 0;
        } else if (co._cdRaw === "P") {
          co.amountPending = Math.abs(co.amountSubmitted);
          co.amountApproved = 0;
        }
      }
      _currentKey = null;
      _phaseCumulative = 0;
      _subtotalCost = 0;
      continue;
    }

    const pco = pcoRaw;
    const aco = acoRaw;
    const key = aco || pco;
    if (!key || key === "0") continue;

    // Skip "Original Contract" base row
    if (descCell === "Original Contract" || descCell === "Base Contract") continue;

    if (coMap[key]) {
      // ── Phase detail row for existing CO ──
      // Accumulate col17 phase amounts; also track col38
      if (col17amt) _phaseCumulative += col17amt;
      _currentKey = key;
    } else {
      // ── New CO header row ──
      // Require at minimum a description or a non-zero amount
      if (!descCell && !col17amt && !col38amt) continue;

      _currentKey = key;
      _phaseCumulative = col17amt || 0;
      _subtotalCost = 0;

      const co = {
        id: uid(),
        coNumber: aco || pco,
        dateSubmitted: dateRaw,
        dateApproved: apprRaw,
        description: descCell,
        // amountSubmitted finalized on subtotal row (or now if col17 is set)
        amountSubmitted: col17amt || 0,
        amountPending:   0,
        amountApproved:  0,
        custCONumber: pco,
        approvedBy: "",
        _cdRaw: cdRaw   // temp field for status resolution
      };

      // For single-phase COs col17 is set on header row — no subtotal row follows
      // Resolve immediately if col17 is present
      if (col17amt) {
        const isApproved = cdRaw === "A" || (apprRaw && cdRaw !== "P") || (!cdRaw && apprRaw);
        const isRejected = cdRaw === "V" || cdRaw === "D";
        if (isApproved) {
          co.amountApproved = Math.abs(col17amt);
        } else if (!isRejected) {
          co.amountPending = Math.abs(col17amt);
        }
      }

      coMap[key] = co;
      cos.push(co);
    }
  }

  // Handle any CO that never got a subtotal row (single-phase, file truncated, etc.)
  if (_currentKey && coMap[_currentKey]) {
    const co = coMap[_currentKey];
    if (co.amountSubmitted === 0 && _phaseCumulative) {
      co.amountSubmitted = _phaseCumulative;
    }
  }

  // Clean up temp fields and merge into state
  let created = 0, updated = 0;
  for (const co of cos) {
    delete co._cdRaw;
    // skip COs that ended up with zero amounts AND no description (phantom rows)
    if (!co.description && !co.amountSubmitted) continue;

    const exists = state.changeOrders.find(c => c.coNumber === co.coNumber);
    if (!exists) {
      state.changeOrders.push(co);
      created++;
    } else {
      exists.description     = exists.description     || co.description;
      exists.amountSubmitted = exists.amountSubmitted || co.amountSubmitted;
      exists.amountApproved  = exists.amountApproved  || co.amountApproved;
      exists.amountPending   = exists.amountPending   || co.amountPending;
      updated++;
    }
  }

  const approved = cos.filter(c=>c.amountApproved>0||c.amountApproved<0).length;
  const pending  = cos.filter(c=>c.amountPending >0).length;
  return `Contract Control Sheet — ${created} COs imported (${approved} approved, ${pending} pending)`;
}

// ─────────────────────────────────────────────────────────
// 4. OPEN COMMITMENTS → Purchase Orders
// ─────────────────────────────────────────────────────────
function vpImportCommitments(rows) {
  const pos = [];
  let currentPO = null;

  for (let r=0; r<rows.length; r++) {
    const row = rows[r];
    // Detect PO header row: "PO  24-003092   Description"
    const cell1 = String(row[1]||"").trim();
    if (cell1.startsWith("PO ") || cell1.startsWith("PO\t")) {
      // Parse PO number and description from cell1: "PO  24-003092   Description text"
      const parts = cell1.replace(/\s+/g," ").split(" ");
      const poNum = parts[1] || "";
      const poDesc = parts.slice(2).join(" ").trim();

      // Vendor is at col 26: "Vendor: RENTALL CONSTRUCTION, INC.  (315)"
      const vendorRaw = String(row[26]||"").trim();
      const vendor = vendorRaw.replace(/Vendor:\s*/i,"").split("(")[0].trim();

      // Order date col 16, ordered-by col 18
      const orderDate = vpDate(row[16]);
      const orderedBy = String(row[18]||"").trim();

      currentPO = {
        id: uid(),
        poNumber: poNum,
        vendor: vendor,
        description: poDesc,
        originalAmount: 0,
        adjustedAmount: 0,
        orderDate,
        orderedBy,
        invoices: []
      };
      pos.push(currentPO);
    }

    // Total for PO row: "Total for PO:  24-003092:"
    // Guard: skip the grand "Total for PO's" summary row (note the apostrophe)
    const cell12 = String(row[12]||"").trim();
    if (currentPO && cell12.includes("Total for PO") && !cell12.includes("PO'") && !cell12.includes("POs")) {
      // Col 26 = Total Costs ordered, col 29 = Total Invoiced, col 35 = To Be Invoiced
      const totalOrdered  = vpNum(row[26]);
      const totalInvoiced = vpNum(row[29]);
      const toBeInvoiced  = vpNum(row[35]);
      currentPO.originalAmount  = totalOrdered;
      currentPO.adjustedAmount  = totalOrdered;
      if (totalInvoiced > 0) {
        currentPO.invoices.push(normalizeInvoice({
          id: uid(),
          number: "VP-Import",
          dateReceived: "",
          amount: totalInvoiced,
          description: "Invoiced to date (Viewpoint)"
        }));
      }
    }
  }

  // Merge into state — create new or update existing PO amounts
  let created = 0, updated = 0;
  for (const po of pos) {
    if (!po.poNumber) continue;
    if (!state.purchaseOrders) state.purchaseOrders = [];
    const exists = state.purchaseOrders.find(p => p.poNumber === po.poNumber);
    if (!exists) {
      state.purchaseOrders.push(po);
      created++;
    } else {
      // Update amounts and refresh the summary invoice — preserve any manual invoices the user added
      exists.originalAmount  = po.originalAmount;
      exists.adjustedAmount  = po.adjustedAmount;
      exists.vendor          = po.vendor || exists.vendor;
      exists.description     = po.description || exists.description;
      // Replace the VP-Import summary invoice but keep any manually entered invoices
      exists.invoices = [
        ...(exists.invoices || []).filter(i => i.number !== "VP-Import"),
        ...(po.invoices || []).filter(i => i.number === "VP-Import")
      ];
      updated++;
    }
  }

  return `Purchase Orders — ${created} created, ${updated} updated`;
}

// ─────────────────────────────────────────────────────────
// 5. AR AGING → Pay Applications billed to owner
// ─────────────────────────────────────────────────────────
function vpImportARaging(rows) {
  // ── AR Aging Report parser ──
  // Viewpoint Vista row structure:
  //   col1=invoice# (with * suffix), col6=invDate (Excel serial), col10=description
  //   col15=total aged amount, col30=retainage amount
  // Summary rows:
  //   "Total Aged + Retain:" row → col15 = grand total retainage balance
  //   "Total Collected:" → col15 = total collected
  //   "Total Billed:" or "Total Invoice:" → col15 = total billed
  //
  // Also extract contract info from header:
  //   "Original Contract:" → col15 or nearest numeric
  //   "Revised Contract:"  → col15

  // Extract header billing info
  const p = state.project;
  for (let r = 0; r < Math.min(rows.length, 20); r++) {
    const flat = rows[r].map(v=>String(v)).join(" ");
    const flatL = flat.toLowerCase();
    if (flatL.includes("original contract")) {
      const nums = rows[r].filter(v => vpNum(v) > 10000);
      if (nums.length) p.contractAmount = p.contractAmount || vpNum(nums[0]);
    }
    if (flatL.includes("revised contract") || flatL.includes("current contract")) {
      const nums = rows[r].filter(v => vpNum(v) > 10000);
      if (nums.length) p.revisedContractAmount = vpNum(nums[0]);
    }
    if (flatL.includes("pm:") || flatL.includes("project manager:")) {
      for (let c = 0; c < rows[r].length; c++) {
        const cv = String(rows[r][c]);
        if (cv.match(/PM:/i)) {
          const pm = cv.replace(/.*PM:\s*/i,"").trim();
          if (pm && pm.length > 2 && !state.project.pm) state.project.pm = pm;
        }
      }
    }
  }

  // Parse invoice rows and summary rows
  const payApps = [];
  let totalBilled = 0, totalCollected = 0, totalRetainage = 0;

  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    const flatL = row.map(v=>String(v)).join(" ").toLowerCase();

    // ── Summary rows ──
    if (flatL.includes("total aged") && flatL.includes("retain")) {
      // "Total Aged + Retain:" = retainage balance
      const nums = row.filter(v => vpNum(v) > 0);
      if (nums.length) totalRetainage = vpNum(nums[nums.length-1]);
      continue;
    }
    if (flatL.includes("total collected") || flatL.includes("total received")) {
      const nums = row.filter(v => vpNum(v) > 0);
      if (nums.length) totalCollected = vpNum(nums[nums.length-1]);
      continue;
    }
    if ((flatL.includes("total billed") || flatL.includes("total invoice")) && !flatL.includes("retainage")) {
      const nums = row.filter(v => vpNum(v) > 0);
      if (nums.length) totalBilled = vpNum(nums[nums.length-1]);
      continue;
    }

    // ── Invoice detail rows ──
    const invCell = String(row[1]||"").trim().replace(/\*/g,"").trim();
    if (!invCell || isNaN(parseFloat(invCell))) continue;
    const invNum = parseInt(invCell);
    if (invNum < 100 || invNum > 9999) continue; // sanity: pay app numbers

    const invDate  = vpDate(row[6]);
    const desc     = String(row[10]||"").trim();
    // col15 = total aged (invoice face amount), col30 = retainage held on this invoice
    const aged     = vpNum(row[15]);
    const retain   = vpNum(row[30]);
    // Use aged amount if available (it represents the billed amount for the pay app)
    const amount   = aged || retain;

    if (!amount && !desc) continue;

    payApps.push({ invNum, invDate, desc, amount, retain, aged });
  }

  if (!payApps.length) return "AR Aging (no pay apps found)";

  // ── Derive summary totals if not explicitly in file ──
  if (!totalRetainage) totalRetainage = payApps.reduce((s,p)=>s+p.retain, 0);
  if (!totalBilled)    totalBilled    = payApps.reduce((s,p)=>s+p.aged, 0) || totalRetainage;

  // ── Store billing progress on project ──
  p.billedToDate      = totalBilled    || p.billedToDate;
  p.collectedToDate   = totalCollected || p.collectedToDate;
  p.retainageBalance  = totalRetainage || p.retainageBalance;

  // ── Build or update PAY-APPS PO ──
  const existingAR = (state.purchaseOrders||[]).find(po => po.poNumber === "PAY-APPS");

  const invoices = payApps.map(pa => normalizeInvoice({
    id: uid(),
    number: String(pa.invNum),
    dateReceived: pa.invDate,
    // Use aged (face value) as invoice amount so the PO total reflects billings, not just retainage
    amount: pa.aged || pa.retain || pa.amount,
    description: pa.desc || `Pay App ${pa.invNum}`
  }));

  const poAmount = totalBilled || invoices.reduce((s,i)=>s+i.amount,0);

  if (existingAR) {
    existingAR.invoices       = invoices;
    existingAR.originalAmount = poAmount;
    existingAR.adjustedAmount = poAmount;
    existingAR.vendor         = existingAR.vendor || p.customer || "Owner";
  } else {
    if (!state.purchaseOrders) state.purchaseOrders = [];
    state.purchaseOrders.push({
      id: uid(),
      poNumber:      "PAY-APPS",
      vendor:        p.customer || "Owner",
      description:   "Customer Pay Applications (AR Aging)",
      originalAmount: poAmount,
      adjustedAmount: poAmount,
      orderDate:     "",
      orderedBy:     p.pm || "",
      invoices
    });
  }

  const retFmt   = totalRetainage  ? `$${Math.round(totalRetainage ).toLocaleString()} retainage` : "";
  const billFmt  = totalBilled     ? `$${Math.round(totalBilled    ).toLocaleString()} billed`    : "";
  const collectFmt = totalCollected ? `, $${Math.round(totalCollected).toLocaleString()} collected` : "";
  return `AR Aging — ${payApps.length} pay apps (${billFmt}${collectFmt}${retFmt ? ", " + retFmt : ""})`;
}

// ─────────────────────────────────────────────────────────
// 6. AP UNAPPROVED INVOICES → Invoice tracker notes
// ─────────────────────────────────────────────────────────
function vpImportAPUnapproved(rows) {
  // ── AP Unapproved Invoices parser ──
  // Finds "Total for Job" summary row → last numeric = total unapproved amount
  // Also counts individual invoice lines (rows with vendor + amount)
  let totalAmt = 0;
  let invoiceCount = 0;

  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    const flatL = row.map(v=>String(v)).join(" ").toLowerCase();

    if (flatL.includes("total for job") || flatL.includes("job total")) {
      // Scan right-to-left for last non-zero numeric value
      for (let c = row.length - 1; c >= 0; c--) {
        const n = vpNum(row[c]);
        if (n !== 0) { totalAmt = Math.abs(n); break; }
      }
    }

    // Count invoice detail rows: look for rows with a vendor name + a dollar amount
    // Typically: seq# | vendor | ref | invDate | description | amount
    const seq = vpNum(row[0]);
    if (seq > 0 && seq < 9999) {
      const rowAmts = row.filter(v => vpNum(v) > 0);
      if (rowAmts.length >= 1 && String(row[1]||"").trim().length > 2) {
        invoiceCount++;
      }
    }
  }

  if (invoiceCount === 0 && totalAmt === 0) {
    logActivity("import","info","AP Unapproved Invoices","No unapproved invoices for this job");
    return "AP Unapproved Invoices — none pending";
  }

  // Log a note so the PM knows there are open AP items
  logActivity("import","warning","AP Unapproved Invoices",
    `${invoiceCount} unapproved invoice(s) totaling $${totalAmt.toLocaleString()} — requires AP approval`);

  return `AP Unapproved — ${invoiceCount} invoice(s), $${totalAmt.toLocaleString()} pending approval`;
}
function findHeaderRow(rows, keywords) {
  for (let i=0; i<Math.min(rows.length,5); i++) {
    const r = rows[i].map(c=>String(c).toLowerCase());
    if (keywords.some(k=>r.some(c=>c.includes(k)))) return {idx:i, headers:r};
  }
  return null;
}

function colIdx(headers, ...terms) {
  for (const t of terms) {
    const i = headers.findIndex(h=>h.includes(t));
    if (i>=0) return i;
  }
  return -1;
}

function cleanDate(v) {
  if (!v) return "";
  const s = String(v).trim();
  if (s.includes("T")) return s.split("T")[0];
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0,10);
  // Try parsing
  const d = new Date(s);
  if (!isNaN(d)) return d.toISOString().split("T")[0];
  return "";
}

function importScheduleXLSX(rows, sheetName) {
  // Find header row — look for task/name + start columns
  const hr = findHeaderRow(rows, ["task","name","start"]);

  const h = hr.headers;

  const ci = {
    name:     colIdx(h,"task name","task","name","description","activity"),
    level:    colIdx(h,"outline level","level","wbs","indent"),
    start:    colIdx(h,"start","start date","begin"),
    end:      colIdx(h,"finish","end","end date","completion","complete date"),
    dur:      colIdx(h,"duration"),
    pct:      colIdx(h,"% complete","percent","complete","progress"),
    preds:    colIdx(h,"predecessor","predecessors","depends"),
  };

  const newTasks = [];
  for (let i = hr.idx + 1; i < rows.length; i++) {
    const r   = rows[i];
    const raw = String(r[ci.name >= 0 ? ci.name : 0] || "").trim();
    if (!raw) continue;

    // Detect level from indentation (SheetJS sometimes preserves leading spaces)
    const spaces = raw.length - raw.trimStart().length;
    const name   = raw.trim();
    let level = 1;
    if (ci.level >= 0 && r[ci.level] !== undefined && r[ci.level] !== "") {
      level = Math.min(4, parseInt(r[ci.level]) || 1);
    } else {
      level = Math.min(4, Math.floor(spaces / 2));
    }

    const start = ci.start >= 0 ? cleanDate(r[ci.start]) : "";
    const end   = ci.end   >= 0 ? cleanDate(r[ci.end])   : "";
    const dur   = ci.dur   >= 0 ? parseMSPDuration(String(r[ci.dur]||"")) : 0;
    const pct   = ci.pct   >= 0 ? parseFloat(String(r[ci.pct]||"0").replace(/[%,]/g,"")) || 0 : 0;
    const preds = ci.preds >= 0 ? String(r[ci.preds]||"").trim() : "";
    const isSummary = level === 0 || (ci.level < 0 && spaces === 0 && !start);

    newTasks.push({
      id: uid(), name,
      level: isSummary ? 0 : level,
      start, end,
      duration: dur || "",
      percentComplete: pct,
      predecessors: preds
    });
  }
  if (newTasks.length) showMSPImportPreview(newTasks, "Excel: " + sheetName);
}
